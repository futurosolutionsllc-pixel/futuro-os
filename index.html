<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturoOS</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0f1a;color:#e5e7eb}
.topbar{display:flex;gap:10px;padding:12px;background:#020617;border-bottom:1px solid #1f2937}
button{background:#1e293b;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{background:#334155}
.panel{display:none;padding:20px}
.panel.active{display:block}
.card{background:#111827;padding:14px;margin-bottom:10px;border-radius:10px;border:1px solid #1f2937}
input, textarea{padding:8px;margin:5px 0;width:60%;background:#020617;color:white;border:1px solid #1f2937;border-radius:6px}
.badge{padding:3px 6px;border-radius:5px;font-size:10px;margin-left:6px}
.freight{background:#2563eb}
.govcon{background:#16a34a}
.pipeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#020617;padding:10px;border-radius:8px;border:1px solid #1f2937}
.actionbar{background:#020617;padding:10px;margin-bottom:10px;border-radius:6px}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('freight')">Freight</button>
  <button onclick="show('govcon')">GovCon</button>
  <button onclick="show('pipeline')">Pipeline</button>
  <button onclick="show('ai')">AI</button>
</div>

<div id="dashboard" class="panel active">
  <div class="card">FuturoOS Command Center</div>
</div>

<div id="freight" class="panel">
  <div class="card">
    <h2>Freight</h2>
    <input id="fTitle" placeholder="Load">
    <input id="fValue" placeholder="Value">
    <button onclick="addDeal('freight')">Add</button>
  </div>
  <div id="freightList"></div>
</div>

<div id="govcon" class="panel">
  <div class="card">
    <h2>GovCon</h2>
    <input id="gTitle" placeholder="Opportunity">
    <input id="gValue" placeholder="Value">
    <button onclick="addDeal('govcon')">Add</button>
  </div>
  <div id="govList"></div>
</div>

<div id="pipeline" class="panel">
  <h2>Pipeline</h2>
  <div class="pipeline">
    <div class="col"><h3>Lead</h3><div id="lead"></div></div>
    <div class="col"><h3>Active</h3><div id="active"></div></div>
    <div class="col"><h3>Closed</h3><div id="closed"></div></div>
  </div>
</div>

<div id="ai" class="panel">
  <div class="card">
    <h3>AI Command</h3>
    <input id="apiKey" placeholder="Paste OpenAI API Key">
    <textarea id="aiInput" placeholder="Ask something..."></textarea>
    <button onclick="runAI()">Run AI</button>
    <div id="aiOutput"></div>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// DATA
let deals = JSON.parse(localStorage.getItem('deals')) || [];

function save(){
  localStorage.setItem('deals', JSON.stringify(deals));
}

// ADD DEAL
function addDeal(type){
  const title = type==='freight'?fTitle.value:gTitle.value;
  const value = type==='freight'?fValue.value:gValue.value;
  if(!title) return;

  deals.push({
    id: Date.now(),
    type,
    title,
    value,
    stage:'lead'
  });

  fTitle.value=''; fValue.value='';
  gTitle.value=''; gValue.value='';

  save();
  renderAll();
}

// RENDER
function renderAll(){
  freightList.innerHTML='';
  govList.innerHTML='';
  lead.innerHTML='';
  active.innerHTML='';
  closed.innerHTML='';

  deals.forEach(d=>{
    const card = `
      <div class="card">
        ${d.title} - $${d.value}
        <span class="badge ${d.type}">${d.type}</span>
        <br>
        <button onclick="move(${d.id})">Next</button>
        <button onclick="del(${d.id})">Delete</button>
      </div>
    `;

    if(d.type==='freight') freightList.innerHTML+=card;
    if(d.type==='govcon') govList.innerHTML+=card;

    document.getElementById(d.stage).innerHTML+=card;
  });
}

// MOVE
function move(id){
  const d = deals.find(x=>x.id===id);
  if(d.stage==='lead') d.stage='active';
  else if(d.stage==='active') d.stage='closed';
  save();
  renderAll();
}

// DELETE
function del(id){
  deals = deals.filter(d=>d.id!==id);
  save();
  renderAll();
}

// AI
async function runAI(){
  const key = apiKey.value;
  const input = aiInput.value;

  if(!key){
    aiOutput.innerText = "Add API key";
    return;
  }

  aiOutput.innerText = "Thinking...";

  try{
    const res = await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + key
      },
      body: JSON.stringify({
        model:"gpt-4o-mini",
        messages:[{role:"user",content:input}]
      })
    });

    const data = await res.json();
    aiOutput.innerText = data.choices[0].message.content;

  }catch(e){
    aiOutput.innerText = "Error connecting";
  }
}

// INIT
renderAll();
</script>

</body>
</html>
