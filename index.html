async function acceptInbound(id){
  const l=INBOX.find(x=>x.id===id); if(!l) return;
  // Sanitize the untrusted public-form fields before they enter the stored CRM
  // object (these render through many innerHTML sinks — see scrub()).
  const co=scrub(l.company||l.name), nm=scrub(l.name), ph=scrub(l.phone),
        em=scrub(l.email), lane=scrub(l.lane), message=scrub(l.message);
  // create a real CRM lead from the inbound inquiry
  const lead={id:_genId('s'),co:co||'New Lead',st:'new',sg:'prospecting',sc:0,
    ind:'',ph:ph,em:em,city:'',sta:'',src:'website',
    fr:[EQUIP_MAP[l.equipment]||'dry_van'],vol:0,sp:0,mg:0,ld:0,rv:0,
    tg:['website-lead'],lc:Date.now(),fu:Date.now()+2*864e5,
    activities:[{ic:'ti-world',su:'Inbound website inquiry',bo:(lane?'Lane: '+lane+'. ':'')+message,oc:'new lead',ts:Date.now()}],
    contacts: nm?[{id:_genId('ct'),nm:nm,ti:'Inquiry contact',ph:ph,em:em}]:[]};
  S.unshift(lead); syncScore(lead);
  saveAll(); // cloud-saves the CRM with the new lead
  // mark the inbound row handled so it won't show again
  try{ await window.ffSupa.from('inbound_leads').update({status:'accepted'}).eq('id',id); }catch(e){ console.warn('mark accepted failed',e.message); }
  INBOX=INBOX.filter(x=>x.id!==id);
  rNav(); rInbox();
  // NOTE: no _setSaveBadge('cloud') here — saveAll() above only queues a debounced
  // write. Only a confirmed upsert in _pushToCloud() may claim a cloud save.
}

async function dismissInbound(id){
  if(!confirm('Dismiss this inquiry? It will be removed from your inbox.')) return;
  try{ await window.ffSupa.from('inbound_leads').update({status:'dismissed'}).eq('id',id); }catch(e){ console.warn('dismiss failed',e.message); }
  INBOX=INBOX.filter(x=>x.id!==id);
  rNav(); rInbox();
}

// HTML-escape any user- or network-sourced text before innerHTML interpolation
// (esp. public inbound_leads fields). Prevents stored XSS. [P0 fix 2026-07-12]
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Sanitize UNTRUSTED network data (anonymous public inbound_* form rows) at the
// trust boundary — strip tag-forming chars and cap length — before it is copied
// into stored CRM objects that render through many innerHTML sinks. This is the
// primary defense against stored XSS from the public lead funnel; esc() at the
// render sinks is the second layer. [hardening 2026-07-14]
function scrub(s){return String(s==null?'':s).replace(/[<>]/g,'').slice(0,2000);}
// Neutralize spreadsheet formula injection + RFC-4180 quote a single CSV cell.
// Finite numbers stay numeric text (negatives/zero preserved). Strings that begin
// with a spreadsheet-dangerous trigger (= + - @ TAB CR LF) get one leading
// apostrophe so Excel/Sheets treat them as text, not a formula; an already-
// neutralized value (leading apostrophe) is never re-prefixed. Then commas, quotes
// and newlines are quoted and embedded quotes doubled. Single central serializer —
// every exported cell routes through here. [S1 fix 2026-07-16]
function safeCsvCell(v){
  if(typeof v==='number'&&isFinite(v))return String(v);
  if(v==null)return'';
  let s=String(v);
  if(/^[=+\-@\t\r\n]/.test(s))s="'"+s;
  if(/[",\r\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
  return s;
}

const $u=ms=>{if(!ms)return{l:'—',ov:false};const d=Math.floor((ms-Date.now())/864e5);return d<0?{l:Math.abs(d)+'d overdue',ov:true}:d===0?{l:'Today',ov:false}:d===1?{l:'Tomorrow',ov:false}:{l:'In '+d+'d',ov:false};};

// ============================================================
// FIT SCORE ENGINE (config-driven, SaaS-ready)
// Returns {score, tier, label, factors[], known, total}
// "known" = how many of 5 factors had real data (completeness).
// ============================================================
function fitScore(s){
  const cfg=(orgSettings.scoring)||{};
  const W=cfg.weights||{volume:30,spend:25,equipment:20,source:15,engagement:10};
  const volMax=cfg.volMax||80, spendMax=cfg.spendMax||1500000;
  const pe=(cfg.priorityEquip||[]), ps=(cfg.priorityStates||[]);
  const sr=cfg.sourceRank||{};
  const F=[]; let score=0, known=0;

  // 1. Volume
  if(s.vol>0){ const r=Math.min(1,s.vol/volMax); const p=Math.round(r*W.volume); score+=p; known++;
    F.push({k:'Volume',v:s.vol+' loads/mo',p,max:W.volume}); }
  else F.push({k:'Volume',v:'unknown',p:0,max:W.volume,blank:true});

  // 2. Spend
  if(s.sp>0){ const r=Math.min(1,s.sp/spendMax); const p=Math.round(r*W.spend); score+=p; known++;
    F.push({k:'Spend',v:$m(s.sp)+'/yr',p,max:W.spend}); }
  else F.push({k:'Spend',v:'unknown',p:0,max:W.spend,blank:true});

  // 3. Equipment fit (against user's priority equipment; blank list = neutral 60%)
  if(s.fr&&s.fr.length){
    let r; if(!pe.length) r=0.6; else { const hit=s.fr.some(e=>pe.includes(e)); r=hit?1:0.35; }
    const p=Math.round(r*W.equipment); score+=p; known++;
    F.push({k:'Equipment',v:s.fr.map(e=>e.replace(/_/g,' ')).join(', ')+(pe.length?(s.fr.some(e=>pe.includes(e))?' · in focus':' · off-focus'):''),p,max:W.equipment}); }
  else F.push({k:'Equipment',v:'unknown',p:0,max:W.equipment,blank:true});

  // 4. Source quality
  if(s.src){ const r=sr[s.src]!=null?sr[s.src]:0.5; const p=Math.round(r*W.source); score+=p; known++;
    F.push({k:'Source',v:s.src.replace(/_/g,' '),p,max:W.source}); }
  else F.push({k:'Source',v:'unknown',p:0,max:W.source,blank:true});

  // 5. Engagement (status progression + logged activity)
  {
    const stRank={new:0,contacted:0.4,qualified:0.7,proposal:0.85,negotiation:0.95,won:1,lost:0.1};
    const hasAct=(s.activities&&s.activities.length)?0.2:0;
    let r=(stRank[s.st]!=null?stRank[s.st]:0)+hasAct; r=Math.min(1,r);
    const engaged = (s.st&&s.st!=='new')||hasAct>0;
    const p=Math.round(r*W.engagement);
    if(engaged){ score+=p; known++; F.push({k:'Engagement',v:(s.st||'new')+(hasAct?' · activity logged':''),p,max:W.engagement}); }
    else { score+=p; F.push({k:'Engagement',v:'not yet engaged',p,max:W.engagement,blank:true}); if(p>0)known++; }
  }

  score=Math.max(0,Math.min(100,Math.round(score)));
  const tier=score>=80?'A':score>=60?'B':score>=40?'C':'D';
  const label={A:'Pursue now',B:'Strong prospect',C:'Nurture / qualify',D:'Low priority'}[tier];
  return {score,tier,label,factors:F,known,total:5};
}

function crmMetrics(){
  const openSt=s=>s.st!=='won'&&s.st!=='lost';
  const open=S.filter(openSt);
  const won=S.filter(s=>s.st==='won');
  const lost=S.filter(s=>s.st==='lost');
  // stage probability for weighting open pipeline value
  const prob={new:.1,contacted:.2,qualified:.4,proposal:.6,negotiation:.8};
  // expected value of an open lead = annual spend * margin% * stage probability
  const evOf=s=>{const m=(s.mg>0?s.mg:12)/100; const p=prob[s.st]!=null?prob[s.st]:.15; return (s.sp||0)*m*p;};
  const pipelineValue=open.reduce((a,s)=>a+evOf(s),0);
  const rawPipeline=open.reduce((a,s)=>a+(s.sp||0)*(((s.mg>0?s.mg:12))/100),0); // unweighted
  const revenue=won.reduce((a,s)=>a+(s.rv||0),0);
  const margLeads=S.filter(s=>s.mg>0);
  const avgMargin=margLeads.length?margLeads.reduce((a,s)=>a+s.mg,0)/margLeads.length:0;
  const activeLeads=open.length;
  const loads=S.reduce((a,s)=>a+(s.ld||0),0);
  const closedTotal=won.length+lost.length;
  const conversion=closedTotal>0?(won.length/closedTotal*100):null; // null = no data yet
  return {open,won,lost,pipelineValue,rawPipeline,revenue,avgMargin,activeLeads,loads,
          conversion,totalLeads:S.length,hasData:S.length>0};
}
function prioritySignals(){
  const now=Date.now(); const sig=[];
  const daysSince=ms=>ms?Math.floor((now-ms)/864e5):999;
  // 1. Overdue proposals/negotiations (follow-up date passed)
  S.filter(s=>(s.st==='proposal'||s.st==='negotiation')&&s.fu&&s.fu<now).forEach(s=>{
    const d=Math.floor((now-s.fu)/864e5);
    sig.push({pri:1,tone:'red',t:`${s.co} — ${s.st} follow-up overdue ${d}d`,b:'Late-stage deal going cold. Reach out today to keep it alive.',id:s.id});
  });
  // 2. Hot leads ready to close (A-tier, active stage)
  S.filter(s=>{const fs=fitScore(s);return fs.tier==='A'&&['qualified','proposal','negotiation'].includes(s.st);}).forEach(s=>{
    const fs=fitScore(s);
    sig.push({pri:2,tone:'green',t:`${s.co} — Fit Score ${fs.score}, close window open`,b:'High-fit prospect in an active stage. Prioritize this week.',id:s.id});
  });
  // 3. Stalled high-value leads (big spend, no contact 14d+, still open)
  S.filter(s=>s.st!=='won'&&s.st!=='lost'&&s.sp>=500000&&daysSince(s.lc)>=14).forEach(s=>{
    sig.push({pri:3,tone:'amber',t:`${s.co} — high-value, no contact ${daysSince(s.lc)}d`,b:`${$m(s.sp)}/yr potential going quiet. Re-engage before it slips.`,id:s.id});
  });
  // 4. Unworked new leads
  const fresh=S.filter(s=>s.st==='new');
  if(fresh.length){ sig.push({pri:4,tone:'blue',t:`${fresh.length} new lead${fresh.length>1?'s':''} not yet worked`,b:'Make first contact while interest is warm.',id:fresh[0].id}); }
  // sort by priority, cap at 4
  sig.sort((a,b)=>a.pri-b.pri);
  return sig.slice(0,4);
}

function rAnalytics(){
  const M=crmMetrics();
  // Live funnel: count leads at or past each status stage
  const order=['new','contacted','qualified','proposal','negotiation','won'];
  const labels={new:'Total Leads',contacted:'Contacted',qualified:'Qualified',proposal:'Proposal Sent',negotiation:'Negotiating',won:'Won'};
  // rank of each status so "reached this stage or beyond" can be counted
  const rank={new:0,contacted:1,qualified:2,proposal:3,negotiation:4,won:5,lost:-1};
  const total=S.length;
  const fn=order.map((st,i)=>{
    const cnt = st==='new' ? total : S.filter(s=>rank[s.st]!=null && rank[s.st]>=i).length;
    const pct = total>0 ? (cnt/total*100) : 0;
    return [labels[st],cnt,pct];
  });
  // Lane profitability: aggregate won/active leads by origin state -> equipment (real data only)
  const laneMap={};
  S.filter(s=>s.rv>0||s.ld>0).forEach(s=>{
    const key=(s.sta||'—')+' · '+((s.fr&&s.fr[0])?s.fr[0].replace(/_/g,' '):'mixed');
    if(!laneMap[key])laneMap[key]={rv:0,mgSum:0,n:0};
    laneMap[key].rv+=(s.rv||0); laneMap[key].mgSum+=(s.mg||0); laneMap[key].n++;
  });
  const lanes=Object.entries(laneMap).map(([k,v])=>[k,v.rv,v.n?v.mgSum/v.n:0]).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const kpiRow=[
    ['Weighted Pipeline', M.pipelineValue>0?$m(M.pipelineValue):'$0', M.activeLeads+' open'],
    ['Revenue Booked', M.revenue>0?$m(M.revenue):'$0', M.won.length+' won'],
    ['Conversion', M.conversion!=null?$p(M.conversion):'—', M.conversion!=null?'won/closed':'no closed deals'],
    ['Avg Deal Value', M.won.length?$m(M.revenue/M.won.length):'$0', M.won.length?'per won deal':'no wins yet']
  ];

  document.getElementById('content').innerHTML=`
  <div class="kpi-grid">${kpiRow.map(([l,v,c])=>`<div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div><div class="kpi-c" style="color:var(--t3);font-weight:400">${c}</div></div>`).join('')}</div>

    <div class="card"><div class="card-title">Lane Profitability</div><div class="card-sub">${lanes.length?'Top by revenue (from your data)':'No revenue logged yet'}</div>${lanes.length?lanes.map(([l,rv,m])=>`<div style="background:var(--bg4);border-radius:var(--rmd);padding:10px;margin-bottom:7px;display:flex;justify-content:space-between"><div><div style="font-size:11px;font-weight:600;color:var(--t1)">${esc(l)}</div><div style="font-size:11px;color:var(--t3)">${$m(rv)} revenue</div></div><div style="text-align:right"><div style="font-size:12px;font-weight:600;color:${m>=20?'var(--tgreen)':'var(--tamber)'}">${m>0?$p(m):'—'}</div><div style="font-size:11px;color:var(--t3)">margin</div></div></div>`).join(''):'<div style="padding:24px;text-align:center;font-size:12px;color:var(--t3)">Mark leads won with revenue and loads to see lane profitability.</div>'}</div>

let VETLOG=[], FLOATLOADS=[], SHIPCREDIT=[], DOCLOADS=[];
let vetState={}, flSeq=1, dlSeq=1, scSeq=1;

// ---- verified pure logic ----
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function ffLoadEconomics(shipperRate,carrierPay,opts){
  opts=opts||{};shipperRate=Number(shipperRate)||0;carrierPay=Number(carrierPay)||0;
  var factorPct=Number(opts.factorPct)||0,sweepPct=Number(opts.sweepPct)||0,
      marginFloorPct=Number(opts.marginFloor)||0,factoringOn=opts.factoringOn!==false;
  var gross=shipperRate-carrierPay, grossPct=shipperRate>0?(gross/shipperRate)*100:0;
  var factorCost=factoringOn?(factorPct/100)*shipperRate:0;
  var net=gross-factorCost, netPct=shipperRate>0?(net/shipperRate)*100:0;
  var sweep=net>0?(sweepPct/100)*net:0;
  var gate;
  if(shipperRate<=0||carrierPay<=0)gate='incomplete';
  else if(net<=0)gate='walk';
  else if(netPct<marginFloorPct)gate='walk';
  else if(netPct<marginFloorPct+3)gate='thin';
  else gate='book';
  return{gross:round2(gross),grossPct:round2(grossPct),factorCost:round2(factorCost),
    net:round2(net),netPct:round2(netPct),sweep:round2(sweep),gate:gate};
}
function loadExposure(carrierPay,shipperRate,factoringOn,advanceRatePct){
  var cp=Number(carrierPay)||0, sr=Number(shipperRate)||0;
  if(factoringOn!==false){var adv=(Number(advanceRatePct)||0)/100*sr;return Math.max(0,cp-adv);}
  return cp;
}
function floatLevel(exposure,cash,ratio){
  if(exposure<=0)return'clear';if(cash<=0)return'danger';
  if(ratio>=90)return'danger';if(ratio>=70)return'caution';return'safe';
}
function ffFloat(loads,availableCash,factoringOn,advanceRatePct){
  availableCash=Number(availableCash)||0;factoringOn=factoringOn!==false;
  var open=(loads||[]).filter(function(l){return!l.paid;});
  var exposure=0;
  open.forEach(function(l){exposure+=loadExposure(l.carrierPay,l.shipperRate,factoringOn,advanceRatePct);});
  exposure=round2(exposure);
  var ratio=availableCash>0?(exposure/availableCash)*100:(exposure>0?Infinity:0);
  return{exposure:exposure,ratio:round2(ratio),level:floatLevel(exposure,availableCash,ratio),openCount:open.length};
}
function ffFloatCheck(currentExposure,availableCash,newCarrierPay,newShipperRate,factoringOn,advanceRatePct){
  currentExposure=Number(currentExposure)||0;availableCash=Number(availableCash)||0;factoringOn=factoringOn!==false;
  var add=loadExposure(newCarrierPay,newShipperRate,factoringOn,advanceRatePct);
  var projected=round2(currentExposure+add);
  var ratio=availableCash>0?(projected/availableCash)*100:(projected>0?Infinity:0);
  return{add:round2(add),projected:projected,ratio:round2(ratio),level:floatLevel(projected,availableCash,ratio)};
}
function ffNegotiation(s,c,opts){return ffLoadEconomics(s,c,opts);}
function ffVetScore(c){
  c=c||{};var critical=[];
  if(c.bankingChangeUnverified)critical.push('Unverified banking/remittance change — verify by calling a known number');
  if(c.authorityNewOrChanged)critical.push('Authority under 6 months or recently reactivated/changed');
  if(c.refusesTracking)critical.push('Carrier evasive about tracking / check calls');
  if(c.insuranceInvalid)critical.push('Insurance expired or unverifiable');
  var conf=[['authorityActive',25],['phoneVerified',20],['emailMatch',15],['insuranceVerified',25],['fmcsaToolUsed',15]];
  var score=0,max=0;conf.forEach(function(p){max+=p[1];if(c[p[0]])score+=p[1];});
  var pct=max>0?Math.round(score/max*100):0;
  var warnings=[];if(c.acceptedAnyRate)warnings.push('Took any rate without negotiating — real carriers negotiate; verify legitimacy');
  var decision;
  if(critical.length)decision='NO-GO';else if(pct>=90)decision='GO';else if(pct>=60)decision='REVIEW';else decision='NO-GO';
  return{pct:pct,decision:decision,critical:critical,warnings:warnings};
}

function negCalc(){
  const g=id=>parseFloat(document.getElementById(id)?.value)||0;
  const sa=g('ng-sa'),st=g('ng-st'),sf=g('ng-sf'),co=g('ng-co'),ct=g('ng-ct'),cc=g('ng-cc');
  const opt={factorPct:orgSettings.factorPct,sweepPct:orgSettings.sweepPct,marginFloor:orgSettings.marginFloor,factoringOn:orgSettings.factoringOn};
  const scen=[['Best case','Shipper anchor × carrier opening',sa,co],['Target','Realistic settle',st,ct],['Worst acceptable','Shipper floor × carrier ceiling',sf,cc]];
  const gl={book:'BOOK',thin:'THIN',walk:'WALK',incomplete:'—'};
  const rows=scen.map(([t,d,sr,cp])=>{const e=ffNegotiation(sr,cp,opt);const c=GATE_C[e.gate];
    return`<div class="eco" style="margin-bottom:8px;border-left:3px solid ${c};display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:12px;font-weight:700;color:var(--t1)">${t}</div><div style="font-size:11px;color:var(--t3)">${d} · $${sr.toLocaleString()} / $${cp.toLocaleString()}</div></div>
      <div style="text-align:right"><div style="font-size:17px;font-weight:700;color:${c}">${$m(e.net)}</div><div style="font-size:11px;color:${c}">${e.netPct.toFixed(1)}% net · ${gl[e.gate]}</div></div></div>`;}).join('');
  const tt=[['Anchor first','State your number first on freight you understand — it frames the deal. Make them react to you.'],
    ['Justify the rate','“My rate buys guaranteed capacity and a driver I’ve already vetted. A cheaper quote that falls through costs you a missed delivery, not $100.”'],
    ['Counter “too expensive”','“What were you quoted? I can’t match a number that won’t put a real truck on this lane today — but I can commit to covering it now and tracking it door to door.”'],
    ['Hold the carrier line','“I’ve got the load and paperwork ready. $X is what it pays — say yes and I send the rate con now.”']];
  const ba=document.getElementById('ng-ba')?.value||'';
  document.getElementById('ng-out').innerHTML=`
    <div class="card" style="margin-bottom:12px"><div class="card-title" style="margin-bottom:8px">Outcome at each settle (net after factoring)</div>${rows}
      <div style="font-size:11px;color:var(--t3);margin-top:6px;text-align:center">Floor ${orgSettings.marginFloor}% · Factoring ${orgSettings.factoringOn?orgSettings.factorPct+'%':'off'} — set in Settings</div></div>
    <div class="card" style="margin-bottom:12px"><div class="card-title" style="margin-bottom:8px">Talk tracks</div>${tt.map(([q,a])=>`<div class="tt-card"><div class="tt-q">${q}</div><div class="tt-a">${a}</div></div>`).join('')}</div>
    <div class="card" style="border-left:3px solid var(--amber)"><div class="card-title" style="color:var(--tamber)">BATNA — negotiate from strength</div><div style="font-size:12px;color:var(--t2);margin-top:6px">${ba?ba:'<span style="color:var(--t3)">Fill in your best alternative. If you don’t know your walk-away option, you’ll cave on price.</span>'}</div></div>`;
}

function flAdd(){

// ---------- deterministic auto-classifier ----------
function classifyJob(j){
  const R={govcon:[],secure:[],postal:[],courier:[]};
  const g=j.gov||{};
  if(j.customerType==='government')R.govcon.push('customer type is government');
  if(g.contractNumber)R.govcon.push('contract number on file');
  if(g.taskOrder)R.govcon.push('task order present');
  if(g.dodaac)R.govcon.push('DoDAAC present');
  if(g.cage)R.govcon.push('CAGE code present');
  if(g.dd1149Required)R.govcon.push('DD1149 required');
  if(g.rfidRequired)R.govcon.push('RFID tagging required');
  if(g.agency)R.govcon.push('agency delivery ('+g.agency+')');
  if(j.governmentFlag&&!R.govcon.length)R.govcon.push('government flag set');
  if(j.confidentialityFlag)R.secure.push('confidential contents');
  if(j.medicalFlag)R.secure.push('medical shipment');
  if(j.legalFlag)R.secure.push('legal documents');
  if(j.highValueFlag)R.secure.push('high-value flag');
  if((+j.declaredValue||0)>=5000&&!j.highValueFlag)R.secure.push('declared value ≥ $5,000');
  if(j.chainOfCustodyRequired)R.secure.push('chain of custody required');
  if(j.tamperSealRequired)R.secure.push('tamper seal required');
  if(j.recipientIdRequired)R.secure.push('recipient ID verification required');
  if(j.temperatureSensitiveFlag)R.secure.push('temperature control required');
  if(j.directToPersonRequired)R.secure.push('direct-to-person delivery required');
  if(j.intakeSource==='ecommerce')R.postal.push('e-commerce parcel source');
  if(j.intakeSource==='retail')R.postal.push('retail parcel batch');
  if((+j.packageCount||0)>=10)R.postal.push('high package count ('+j.packageCount+')');
  if(/^usps/.test(j.serviceLevel||''))R.postal.push('USPS service selected');
  if(j.customerType==='business')R.courier.push('direct B2B pickup');
  if(j.serviceLevel==='same_day')R.courier.push('same-day service');
  if((+j.miles||0)>0&&(+j.miles||0)<=120)R.courier.push('local route ('+j.miles+' mi)');
  if(!R.secure.length&&!R.govcon.length)R.courier.push('no secure or government indicators');
  // priority when multiple rule groups match: GovCon > Secure > Postal > Courier
  let key='courier';
  if(R.govcon.length)key='govcon'; else if(R.secure.length)key='secure'; else if(R.postal.length)key='postal';
  const conf=Math.min(97,55+R[key].length*9);
  let lvl='S0';
  if(key==='govcon')lvl='S4';
  else if(key==='secure')lvl=(j.chainOfCustodyRequired||j.legalFlag||j.medicalFlag)?'S3':'S2';
  else if(j.signatureRequired||j.recipientIdRequired||j.photoPodRequired)lvl='S1';
  const docs={postal:['label','podreceipt','billback'],courier:['bol','podreceipt','billback'],
    secure:['secmanifest','custody','bol','podreceipt','billback','archsummary'],
    govcon:['dd1149','bol','custody','podreceipt','billback','archsummary']}[key];
  const acts=[],restr=[];
  if(key==='postal'){acts.push('Prepare USPS-compliant tubs/sacks + batch sheet','Generate label + manifest (simulation until USPS API is live)','Meet dropoff cutoff and record handoff');restr.push('Handoff blocked until label + manifest status are set');}
  if(key==='courier'){acts.push('Assign driver, vehicle, zone and stop order','Confirm SLA window with customer','Capture POD at delivery');}
  if(key==='secure'){acts.push('Assign a driver who passes the credential gate','Apply tamper seal and open the custody log','Recipient ID + signature + photo required at delivery');restr.push('Dispatch blocked until driver credential gate passes','No unattended delivery','Direct-to-person only');}
  if(key==='govcon'){acts.push('Complete the GovCon shipment checklist','Generate DD1149 draft','Package to contract spec (RFID / inspection as required)','Track government acceptance + invoice backup');restr.push('Dispatch blocked until driver credential gate passes','Contract compliance file must be complete before close');}
  if(j.temperatureSensitiveFlag)acts.push('Maintain temperature control; log package condition at both ends');
  j.jobType=JT[key]; j.jobTypeKey=key; j.securityLevel=lvl;
  j.classificationConfidence=conf;
  j.classificationReason=R[key].join('; ');
  j.requiredDocuments=docs.slice(); j.requiredActions=acts; j.dispatchRestrictions=restr;
  if(key==='secure'||key==='govcon'){ // secure lanes force real operational controls
    j.signatureRequired=true; j.photoPodRequired=true; j.recipientIdRequired=true; j.tamperSealRequired=true;
    if(lvl==='S3'||lvl==='S4')j.chainOfCustodyRequired=true;
    j.pod.noUnattended=true; j.pod.directToPerson=true;
  }
  if(j.stageStatus==='intake')j.stageStatus='classified';
  jobAudit(j,'Classified',j.jobType+' · '+lvl+' · '+conf+'% — '+(j.classificationReason||'default'));
  return {key,type:JT[key],lvl,conf,reasons:R[key],all:R,docs,acts,restr};
}

// ---------- credential gate ----------
const CRED_LABELS={backgroundCheckDate:'Background check',mvrCheckDate:'MVR check',hipaaTraining:'HIPAA training',oshaAwareness:'OSHA awareness',tsaEligible:'TSA eligibility',twic:'TWIC card',secureCourierSopAcknowledged:'Secure courier SOP acknowledged',ndaSigned:'NDA signed',insuranceVerified:'Insurance verified',vehicleInspectionVerified:'Vehicle inspection verified',activeStatus:'Active status'};
function _credOk(v){return v===true||(typeof v==='string'&&v.trim()!=='');}
function credentialGate(j,d){
  if(!d)return{pass:false,missing:['No driver assigned'],need:[]};
  const lvl=j.securityLevel||'S0';
  const need=['activeStatus','insuranceVerified'];
  if(lvl==='S2'||lvl==='S3'||lvl==='S4')need.push('backgroundCheckDate','mvrCheckDate','ndaSigned','secureCourierSopAcknowledged','vehicleInspectionVerified');
  if(lvl==='S3'&&j.medicalFlag)need.push('hipaaTraining');
  if(lvl==='S4')need.push('oshaAwareness');
  const missing=need.filter(k=>!_credOk(d[k])).map(k=>CRED_LABELS[k]||k);
  return{pass:missing.length===0,missing,need};
}
function driverCredScore(d){const ks=Object.keys(CRED_LABELS);return Math.round(ks.filter(k=>_credOk(d[k])).length/ks.length*100);}
function bestDriver(j){
  const pool=DRIVERS.filter(d=>d.activeStatus&&credentialGate(j,d).pass);
  if(!pool.length)return null;
  return pool.find(d=>d.zone===j.routeZone)||pool[0];
}

// ---------- cost / matrix engine ----------
const CT_TARGET_MARGIN={postal:0.18,courier:0.30,secure:0.42,govcon:0.35};
function ctVehicleFit(j){
  const w=+j.weight||0,pc=+j.packageCount||1;
  if(j.jobTypeKey==='postal')return 'usps';
  if((j.securityLevel==='S3'||j.securityLevel==='S4')&&!DRIVERS.some(d=>d.activeStatus&&credentialGate(j,d).pass))return 'secure_partner';
  if(w>3200||pc>90)return 'box_truck';
  if(w>2500||pc>60)return 'hr_van';
  if(w>150||pc>8)return 'cargo_van';
  return 'personal';
}
function estimateJobCost(j,vehId){
  const v=VEHICLES.find(x=>x.id===(vehId||j.recommendedVehicleId))||VEHICLES[1];
  const mi=+j.miles||10,pc=+j.packageCount||1;
  let cost=0,brk=[];
  if(j.jobTypeKey==='postal'){
    const per=((+j.weight||pc)/pc)>1?9.5:6.5; // rough per-piece postage placeholder (simulation)
    cost=pc*per+15+mi*0.65;
    brk=[['Postage est. ('+pc+' pcs · simulation)',round2(pc*per)],['Batch handling',15],['Injection drive ('+mi+' mi)',round2(mi*0.65)]];
  }else{
    const base=35+v.base, run=mi*(1.15+v.costMi), extra=Math.max(0,pc-3)*2.5;
    cost=base+run+extra;
    brk=[['Base + vehicle ('+v.n+')',round2(base)],['Run ('+mi+' mi)',round2(run)]];
    if(extra>0)brk.push(['Extra pieces',round2(extra)]);
    if(j.jobTypeKey==='secure'){cost+=45;brk.push(['Secure handling',45]);if(j.chainOfCustodyRequired){cost+=25;brk.push(['Chain of custody',25]);}}
    if(j.jobTypeKey==='govcon'){cost+=75;brk.push(['Contract compliance admin',75]);}
    if(j.temperatureSensitiveFlag){cost+=20;brk.push(['Temperature control',20]);}
  }
  return{cost:round2(cost),breakdown:brk,vehicle:v};
}
function ctcMatrix(j){
  if(!j.jobTypeKey)classifyJob(j);
  const vehId=ctVehicleFit(j), est=estimateJobCost(j,vehId), v=est.vehicle;
  const tm=CT_TARGET_MARGIN[j.jobTypeKey]||0.3;
  const charge=(+j.customerCharge>0)?+j.customerCharge:round2(est.cost/(1-tm));
  const margin=round2(charge-est.cost), marginPct=charge>0?round2(margin/charge*100):0;
  const d=bestDriver(j), gate=d?credentialGate(j,d):credentialGate(j,null);
  const needsGate=['S2','S3','S4'].includes(j.securityLevel);
  const sc={};
  sc.cost=Math.max(5,Math.min(100,Math.round(105-est.cost/8)));
  sc.speed={same_day:92,next_day:78,scheduled:68,standard:60,usps_priority:55,usps_ground:35}[j.serviceLevel]||60;
  sc.margin=Math.max(0,Math.min(100,Math.round(marginPct*2.2)));
  const fitOf=r=>r>1?15:r>.85?70:r>=.08?95:70;
  sc.vehicleFit=v.id==='usps'?90:Math.min(fitOf((+j.weight||1)/v.cap),fitOf((+j.packageCount||1)/v.pkg));
  sc.capacity=v.id==='usps'?95:Math.max(5,Math.round(100-Math.max((+j.weight||1)/v.cap,(+j.packageCount||1)/v.pkg)*80));
  sc.compliance=(()=>{let s=85;const gen=(j.generatedDocuments||[]).map(x=>x.kind);if((j.requiredDocuments||[]).every(k=>gen.includes(k))&&(j.requiredDocuments||[]).length)s=100;if(j.jobTypeKey==='govcon'&&!j.gov.contractNumber)s-=30;if(needsGate&&!gate.pass)s-=25;return Math.max(5,s);})();
  sc.securityRisk={S0:10,S1:25,S2:55,S3:70,S4:80}[j.securityLevel]||10;
  sc.credentialFit=!needsGate?100:(d?100:Math.max(0,100-(gate.missing.length*18)));
  sc.docBurden=Math.min(100,(j.requiredDocuments||[]).length*13);
  const risk=sc.securityRisk>=70?'Critical':sc.securityRisk>=50?'High':sc.securityRisk>=25?'Moderate':'Low';
  const nba={intake:'Classify the job (Auto-Classifier)',classified:'Stage the shipment (Sort & Stage)',staged:needsGate&&!d?'Fix driver credentials or tender to Secure Carrier Partner':'Dispatch (Courier Dispatch / ops screen)',dispatched:'Driver executes Mobile POD workflow',in_transit:'Driver executes Mobile POD workflow',delivered:'Complete billing + compliance archive, then close',closed:'Job closed — archived'}[j.stageStatus]||'Review job';
  return {vehId,vehicle:v.n,driver:d?d.name:null,gate,needsGate,est:est.cost,breakdown:est.breakdown,charge,margin,marginPct,risk,scores:sc,docs:(j.requiredDocuments||[]).map(k=>DOC_KINDS[k]||k),checklist:j.requiredActions||[],nextBestAction:nba,mode:j.jobType};
}
function applyMatrix(id){
  const j=findJob(id);if(!j)return null;
  const m=ctcMatrix(j);

  if(m.needsGate&&!m.driver&&!j.assignedCarrier)j.assignedCarrier='Secure Carrier Partner (recommended)';

// ---------- billing ----------
const FEE_FIELDS=[['baseRate','Base rate'],['mileageFee','Mileage fee'],['secureHandlingFee','Secure handling fee'],['chainOfCustodyFee','Chain of custody fee'],['afterHoursFee','After-hours fee'],['waitingTimeFee','Waiting time fee'],['restrictedAccessFee','Restricted access fee'],['highValueFee','High value fee'],['temperatureControlFee','Temperature control fee']];
const COST_FIELDS=[['driverPay','Driver pay'],['carrierCost','Carrier cost'],['fuelOrChargingCost','Fuel / charging'],['tolls','Tolls'],['packagingCost','Packaging'],['postageCost','Postage']];
function calcBilling(j){
  const b=j.billing;
  b.totalCost=round2(COST_FIELDS.reduce((a,[k])=>a+(+b[k]||0),0));
  b.customerCharge=round2(FEE_FIELDS.reduce((a,[k])=>a+(+b[k]||0),0));
  b.grossMargin=round2(b.customerCharge-b.totalCost);
  b.grossMarginPercent=b.customerCharge>0?round2(b.grossMargin/b.customerCharge*100):0;
  j.actualCost=b.totalCost; j.actualMargin=b.grossMargin;
  if(b.customerCharge>0)j.customerCharge=b.customerCharge;
  return b;
}
function billingFromEstimate(j){ // pull matrix pricing into the billing sheet
  const b=j.billing;
  const others=FEE_FIELDS.reduce((a,[k])=>a+(k==='baseRate'?0:(+b[k]||0)),0);
  b.baseRate=round2(Math.max(0,(+j.customerCharge||0)-others));
  if(!+b.driverPay&&j.assignedDriver)b.driverPay=round2((+j.estimatedCost||0)*0.45);
  if(!+b.fuelOrChargingCost&&j.jobTypeKey!=='postal')b.fuelOrChargingCost=round2((+j.miles||0)*0.18);
  if(j.jobTypeKey==='postal'&&!+b.postageCost)b.postageCost=round2((+j.estimatedCost||0)*0.7);
  return calcBilling(j);
}
function suggestFees(j){ // secure lane surcharges — real accessorials, applied once
  const b=j.billing;
  if(j.jobTypeKey==='secure'||j.securityLevel==='S2'||j.securityLevel==='S3'){
    if(!+b.secureHandlingFee)b.secureHandlingFee=65;
    if(j.chainOfCustodyRequired&&!+b.chainOfCustodyFee)b.chainOfCustodyFee=40;
    if(j.highValueFlag&&!+b.highValueFee)b.highValueFee=35;
    if(j.temperatureSensitiveFlag&&!+b.temperatureControlFee)b.temperatureControlFee=25;
  }
}

// ---------- lifecycle: stage / dispatch / deliver / close ----------
function stageJob(id){
  const j=findJob(id);if(!j)return;
  if(!j.jobTypeKey){alert('Classify this job first (Auto-Classifier or job page).');return;}
  if(j.jobTypeKey==='secure'&&j.tamperSealRequired&&!j.sealNumber){alert('Secure staging requires a tamper seal number first.');return;}
  if(j.jobTypeKey==='govcon'&&!j.gov.contractNumber){alert('GovCon staging requires a contract number (GovCon Shipments screen).');return;}
  j.stageStatus='staged';
  const det={postal:'USPS tubs/sacks prepared'+(j.postal.containerId?' · container '+j.postal.containerId:''),courier:'Routed '+j.routeZone+' · stop '+(j.stopOrder||1),secure:'Seal '+j.sealNumber+' applied · custody log open',govcon:'Packaged to contract spec'+(j.gov.rfidRequired?' · RFID tagged (placeholder)':'')}[j.jobTypeKey]||'';
  if(j.jobTypeKey==='secure'||j.jobTypeKey==='govcon')addCustody(j,'Staged / sealed',det);
  jobAudit(j,'Staged',det);
  touchJob(j);rPage();
}
function dispatchJob(id){
  const j=findJob(id);if(!j)return false;
  const needsGate=['S2','S3','S4'].includes(j.securityLevel);
  if(needsGate){
    const d=DRIVERS.find(x=>x.name===j.assignedDriver);
    const g=credentialGate(j,d);
    if(!g.pass&&!(j.assignedCarrier&&/secure/i.test(j.assignedCarrier))){
      raiseException(j.jobId,'credential_gate','high','Dispatch blocked ('+j.securityLevel+'): '+g.missing.join(', '));
      alert('⛔ CREDENTIAL GATE FAILED — dispatch blocked for '+j.jobId+' ('+j.securityLevel+')\n\nMissing:\n• '+g.missing.join('\n• ')+'\n\nFix credentials in Network → Drivers, assign an eligible driver, or tender to the Secure Carrier Partner.');
      touchJob(j);rPage();return false;
    }
    if(j.tamperSealRequired&&!j.sealNumber){alert('Tamper seal number is required before secure dispatch (Sort & Stage).');return false;}
    addCustody(j,'Dispatched under credential gate',(j.assignedDriver||j.assignedCarrier)+' cleared for '+j.securityLevel);
  }
  j.dispatchStatus='dispatched'; j.stageStatus='dispatched';
  jobAudit(j,'Dispatched',(j.assignedDriver||j.assignedCarrier||'unassigned')+(j.recommendedVehicle?' · '+j.recommendedVehicle:''));
  pushStatus(j,'dispatched');
  touchJob(j);rPage();return true;
}

// ---------- compliance archive + closure gate ----------
const ARCH_ITEMS=[['intake','Intake request saved'],['quote','Quote saved'],['docs','Label / BOL / DD1149 saved'],['pod','POD saved'],['photos','Photos saved'],['signatures','Signatures saved'],['gps','GPS / timestamps saved'],['invoice','Invoice backup saved'],['exceptions','Exception notes saved'],['checklist','Compliance checklist completed']];
function archRequired(j){
  if(j.jobTypeKey==='secure'||j.jobTypeKey==='govcon')return ARCH_ITEMS.map(x=>x[0]); // strict lane: everything
  const base=['intake','pod','invoice'];
  if(j.jobTypeKey==='postal')base.splice(1,0,'docs');
  return base;
}
function archState(j){
  const a=j.archive||{};const p=j.pod||{};
  const exs=EXCPTS.filter(e=>e.jobId===j.jobId);
  return{
    intake:true,
    quote:(+j.customerCharge>0)||!!a.quote,
    docs:(j.generatedDocuments||[]).some(d=>['bol','dd1149','label','secmanifest'].includes(d.kind))||!!a.docs,
    pod:j.podStatus==='complete'||!!a.pod,
    photos:(!!p.pickupPhoto&&!!p.deliveryPhoto)||(!j.photoPodRequired&&!!p.deliveryPhoto)||!!a.photos,
    signatures:(!!p.recipientSignature)||!!a.signatures,
    gps:(!!p.gpsDelivery||!!p.gpsPickup)||!!a.gps,
    invoice:(j.billing&&j.billing.invoiceStatus!=='draft')||!!a.invoice,
    exceptions:(exs.length===0||exs.every(e=>e.status==='resolved'))||!!a.exceptions,
    checklist:!!a.checklist,
  };
}
function archMissing(j){const st=archState(j);return archRequired(j).filter(k=>!st[k]).map(k=>(ARCH_ITEMS.find(x=>x[0]===k)||[k,k])[1]);}
function toggleArch(id,key){const j=findJob(id);if(!j)return;j.archive=j.archive||{};j.archive[key]=!j.archive[key];jobAudit(j,'Archive item '+(j.archive[key]?'checked':'unchecked'),(ARCH_ITEMS.find(x=>x[0]===key)||[key,key])[1]);touchJob(j);rPage();}
function closeJob(id){
  const j=findJob(id);if(!j)return;
  const miss=archMissing(j);
  if(miss.length){alert('🔒 Cannot close '+j.jobId+' — compliance archive incomplete ('+(j.jobTypeKey==='secure'||j.jobTypeKey==='govcon'?'strict':'standard')+' requirements):\n\n• '+miss.join('\n• ')+'\n\nComplete these in the job Compliance tab.');return;}
  if(!confirm('Close and lock '+j.jobId+'? The compliance archive becomes read-only.'))return;
  j.stageStatus='closed'; j.complianceStatus='locked';
  jobAudit(j,'Closed','Compliance archive complete — record locked');
  pushStatus(j,'closed');
  touchJob(j);rPage();
}

// ---------- exceptions ----------
function raiseException(jobId,type,severity,notes,owner,due){
  const t=EX_TYPES.find(x=>x[0]===type);
  const e={id:'ex'+(++exSeq),jobId:jobId||'',type,label:t?t[1]:type,severity:severity||'medium',owner:owner||'You',due:due||Date.now()+2*864e5,notes:notes||'',status:'open',ts:Date.now(),trail:[{ts:Date.now(),a:'Opened',d:notes||''}]};
  EXCPTS.unshift(e);
  const j=findJob(jobId);
  if(j){j.exceptionStatus='open';jobAudit(j,'Exception raised',e.label+' ('+e.severity+')'+(notes?' — '+notes:''));}
  saveAll();rNav();
  return e;
}
function exSetStatus(id,st){
  const e=EXCPTS.find(x=>x.id===id);if(!e)return;
  e.status=st;e.trail.push({ts:Date.now(),a:st==='resolved'?'Resolved':'Status → '+st,d:''});
  const j=findJob(e.jobId);
  if(j){
    if(st==='resolved'&&!EXCPTS.some(x=>x.jobId===e.jobId&&x.status!=='resolved')){j.exceptionStatus='resolved';jobAudit(j,'Exceptions cleared','');}
    else if(st!=='resolved'){j.exceptionStatus='open';}
  }
  saveAll();rNav();rPage();
}
function _openEx(){return EXCPTS.filter(e=>e.status!=='resolved').length;}

// ---------- KPI engine ----------
function jobKpis(){
  const total=JOBS.length;
  const done=JOBS.filter(j=>j.stageStatus==='delivered'||j.stageStatus==='closed');
  const active=total-done.length;
  const lateIds=EXCPTS.filter(e=>e.type==='late_delivery').map(e=>e.jobId);
  const onTime=done.length?Math.round(done.filter(j=>!lateIds.includes(j.jobId)).length/done.length*100):null;
  const sec=JOBS.filter(j=>j.jobTypeKey==='secure');
  const secDone=sec.filter(j=>j.stageStatus==='delivered'||j.stageStatus==='closed').length;
  const custodyJobs=JOBS.filter(j=>j.chainOfCustodyRequired);
  const custodyOk=custodyJobs.length?Math.round(custodyJobs.filter(j=>(j.custodyEvents||[]).length>=2).length/custodyJobs.length*100):null;
  const podOk=done.length?Math.round(done.filter(j=>j.podStatus==='complete').length/done.length*100):null;
  const exRate=total?Math.round(EXCPTS.length/total*100):0;
  const seals=EXCPTS.filter(e=>e.type==='seal_mismatch').length;
  const billed=JOBS.filter(j=>j.billing&&+j.billing.customerCharge>0);
  const avgMargin=billed.length?round2(billed.reduce((a,j)=>a+(+j.billing.grossMarginPercent||0),0)/billed.length):null;
  const byType={};JT_KEYS.forEach(k=>byType[k]={rev:0,margin:0,n:0});
  JOBS.forEach(j=>{const k=j.jobTypeKey;if(byType[k]){byType[k].rev+=(+j.billing.customerCharge||+j.customerCharge||0);byType[k].margin+=(+j.billing.grossMargin||0);byType[k].n++;}});
  const vehUse={};JOBS.filter(j=>j.stageStatus!=='closed'&&j.recommendedVehicle).forEach(j=>{vehUse[j.recommendedVehicle]=(vehUse[j.recommendedVehicle]||0)+1;});
  const drvComp=DRIVERS.length?Math.round(DRIVERS.reduce((a,d)=>a+driverCredScore(d),0)/DRIVERS.length):0;
  const gj=JOBS.filter(j=>j.jobTypeKey==='govcon');
  const govComp=gj.length?Math.round(gj.filter(j=>j.gov.checklistStatus==='complete').length/gj.length*100):null;
  const pj=JOBS.filter(j=>j.jobTypeKey==='postal');
  const postalOk=pj.length?Math.round(pj.filter(j=>['handed_off','confirmed'].includes(j.postal.handoffStatus)).length/pj.length*100):null;
  const claims=EXCPTS.filter(e=>['damaged','billing'].includes(e.type)).length;
  return{total,active,completed:done.length,onTime,secTotal:sec.length,secDone,custodyOk,podOk,exRate,seals,avgMargin,byType,vehUse,drvComp,govComp,postalOk,claims,openEx:_openEx()};
}

function ctDocCopy(){

  });
}
function ctDocPrint(jobId,docId){

function setJobNum(id,field,val){setJobField(id,field,parseFloat(val)||0);}
function setJobSub(id,block,field,val){const j=findJob(id);if(!j)return;j[block]=j[block]||{};j[block][field]=val;jobAudit(j,'Updated '+block+'.'+field,String(val));touchJob(j);}
function setJobFlag(id,flag,checked){const j=findJob(id);if(!j)return;j[flag]=!!checked;jobAudit(j,'Flag '+flag,checked?'on':'off');touchJob(j);}
function setBilling(id,field,val){const j=findJob(id);if(!j)return;j.billing[field]=parseFloat(val)||0;calcBilling(j);touchJob(j);const t=document.getElementById('bl-totals');if(t)t.innerHTML=billingTotals(j);}
function reclassify(id){const j=findJob(id);if(!j)return;classifyJob(j);applyMatrix(id);suggestFees(j);touchJob(j);rPage();}
function _removeJobRecord(id){
  for(let i=EXCPTS.length-1;i>=0;i--)if(EXCPTS[i].jobId===id)EXCPTS.splice(i,1);
  for(let i=GLOG.length-1;i>=0;i--)if(GLOG[i].jobId===id)GLOG.splice(i,1);
  const ix=JOBS.findIndex(x=>x.jobId===id);
  if(ix>-1)JOBS.splice(ix,1);
  selJobs.delete(id);
  if(selJob&&selJob.jobId===id)selJob=null;
}
function deleteJob(id){
  const j=findJob(id);if(!j)return;
  if(!confirm('Delete '+j.jobId+' ('+(j.customerName||'no customer')+')?\n\nIts documents, custody log, exceptions, and audit entries are removed with it.'))return;
  undoPoint('deleted job '+j.jobId);
  _removeJobRecord(id);
  saveAll();rNav();rPage();
  _toast('Deleted '+id);
}
function deleteSelectedJobs(){
  const ids=[...selJobs];if(!ids.length)return;
  if(!confirm('Delete '+ids.length+' job'+(ids.length!==1?'s':'')+'?\n\nTheir documents, custody logs, exceptions, and audit entries are removed with them.'))return;
  undoPoint('deleted '+ids.length+' job'+(ids.length!==1?'s':''));
  ids.forEach(_removeJobRecord);
  saveAll();rNav();rPage();
  _toast('Deleted '+ids.length+' job'+(ids.length!==1?'s':''));
}
function toggleSelJob(id){ if(selJobs.has(id))selJobs.delete(id); else selJobs.add(id); rLiveJobs(); }
function toggleAllJobs(){
  const list=_ljList();

  if(all)list.forEach(j=>selJobs.delete(j.jobId)); else list.forEach(j=>selJobs.add(j.jobId));
  rLiveJobs();
}

function nextBestAction(j){
  const A=(label,why,btnLb,fn,icon,tone)=>({label,why,btnLb,fn,icon:icon||'ti-arrow-right',tone:tone||'blue'});
  if(!j)return A('Create your first order','Every workflow starts at intake.','New Order',"go('neworder')",'ti-square-rounded-plus');
  const id=j.jobId;
  if(j.stageStatus==='closed')return A('Job closed and archived','The compliance record is locked. Nothing left to do.','View record',`openJob('${id}','cp')`,'ti-lock','green');
  if(j.stageStatus==='intake'||!j.jobTypeKey)return A('Classify this order','Classification sets the job type, security level, and required documents.','Classify',`reclassify('${id}')`,'ti-binary-tree');
  if(j.stageStatus==='classified'){
    if(j.jobTypeKey==='govcon'&&!(j.gov&&j.gov.contractNumber))return A('Add the contract number','GovCon jobs cannot stage until a contract number is on file (Operations tab).','Open job',`openJob('${id}','ops')`,'ti-building-bank','amber');
    if(j.jobTypeKey==='secure'&&j.tamperSealRequired&&!j.sealNumber)return A('Record the tamper seal number','Secure staging needs the seal number before the custody log opens (Operations tab).','Open job',`openJob('${id}','ops')`,'ti-shield-lock','amber');
    if(!(+j.customerCharge>0))return A('Run the cost-time matrix','Get the recommended vehicle and customer charge before staging.','Run matrix',`applyMatrix('${id}');touchJob(findJob('${id}'));rPage()`,'ti-table-options');
    return A('Stage the shipment','Pricing and paperwork are set — stage it for dispatch.','Stage',`stageJob('${id}')`,'ti-stack-2');
  }
  if(j.stageStatus==='staged'){
    const needsGate=['S2','S3','S4'].includes(j.securityLevel);
    if(needsGate){
      const d=DRIVERS.find(x=>x.name===j.assignedDriver);
      const g=credentialGate(j,d);
      if(!g.pass&&!(j.assignedCarrier&&/secure/i.test(j.assignedCarrier)))return A('Clear the driver credential gate','Missing: '+g.missing.join(', ')+'. Fix credentials, assign an eligible driver, or tender to the secure partner.','Open Drivers',`go('drivers')`,'ti-shield-x','red');
      if(j.tamperSealRequired&&!j.sealNumber)return A('Record the tamper seal number','Secure dispatch is blocked until the seal number is recorded (Sort & Stage).','Sort & Stage',`go('sortstage')`,'ti-shield-lock','amber');
    }
    return A('Dispatch this job','Driver, vehicle, and paperwork are ready.','Dispatch',`dispatchJob('${id}')`,'ti-truck-delivery');
  }
  if(['dispatched','in_transit'].includes(j.stageStatus)){
    if(!(j.pod&&j.pod.pickupConfirmed))return A('Confirm the pickup','Record pickup confirmation in Mobile POD — photo, signature, and condition.','Mobile POD',`podJobId='${id}';go('pod')`,'ti-device-mobile');
    return A('Complete delivery and POD','Capture the recipient signature, photo, and any required ID or seal checks.','Mobile POD',`podJobId='${id}';go('pod')`,'ti-device-mobile');
  }
  if(j.stageStatus==='delivered'){
    if(j.podStatus!=='complete')return A('Finish the POD record','Delivered, but the proof-of-delivery record is incomplete.','Mobile POD',`podJobId='${id}';go('pod')`,'ti-device-mobile','amber');
    if(j.billing&&j.billing.invoiceStatus==='draft')return A('Send the invoice','Billing is still in draft. Review the totals, then mark the invoice sent.','Open billing',`openJob('${id}','bl')`,'ti-receipt-2');
    const miss=archMissing(j);
    if(miss.length)return A('Complete the compliance archive','Missing: '+miss.slice(0,3).join(', ')+(miss.length>3?' +'+(miss.length-3)+' more':'')+'.','Open compliance',`openJob('${id}','cp')`,'ti-lock-square','amber');
    return A('Close the job','Everything is complete — close and lock the record.','Close job',`closeJob('${id}')`,'ti-lock','green');
  }
  return A('Review this job','','Open',`openJob('${id}')`,'ti-eye');
}

  const j=selJob;if(!j){go('livejobs');return;}

    qa.push(`<button class="btn-sm" onclick="reclassify('${j.jobId}')"><i class="ti ti-binary-tree"></i> Re-classify</button>`);

    if(j.stageStatus==='staged')qa.push(`<button class="btn" style="padding:5px 14px;font-size:11px" onclick="dispatchJob('${j.jobId}')">Dispatch</button>`);
    if(['dispatched','in_transit'].includes(j.stageStatus))qa.push(`<button class="btn" style="padding:5px 14px;font-size:11px" onclick="podJobId='${j.jobId}';go('pod')">Open Mobile POD</button>`);

    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">

          <div style="display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap">${$jt(j.jobTypeKey)}${$sec(j.securityLevel)}${$stage(j.stageStatus)}${jobFlags(j)}${locked?'<span class="badge" style="background:var(--bgreen);color:var(--tgreen)"><i class="ti ti-lock"></i> archive locked</span>':''}</div>
        </div>

  </div>
  ${locked?'':nbaCard(j)}
  <div class="tabs" id="job-tabs" role="tablist">

function deleteDoc(jobId,docId){
  const j=findJob(jobId);if(!j)return;
  if(j.stageStatus==='closed'){alert(j.jobId+' is closed — its compliance archive is locked and documents cannot be removed.');return;}
  const ix=(j.generatedDocuments||[]).findIndex(d=>d.id===docId);if(ix<0)return;
  const d=j.generatedDocuments[ix];
  if(!confirm('Delete "'+d.title+'" from '+j.jobId+'? You can regenerate it from the template later.'))return;
  undoPoint('deleted document '+d.title);
  j.generatedDocuments.splice(ix,1);
  jobAudit(j,'Document deleted',d.title);
  touchJob(j);rPage();
  _toast('Document deleted');
}

function createOrder(draft){
  const g=id=>document.getElementById('no-'+id);
  const val=id=>g(id)?g(id).value.trim():'';
  const num=id=>parseFloat(val(id))||0;
  const chk=id=>!!(g(id)&&g(id).checked);
  const err=document.getElementById('no-err');
  const fail=(id,msg)=>{
    if(err){err.style.display='block';err.textContent=msg;}
    const f=g(id);if(f){f.style.borderColor='var(--tred)';f.focus();f.addEventListener('input',()=>{f.style.borderColor='';if(err)err.style.display='none';},{once:true});}
  };
  if(!val('customerName')){fail('customerName','Customer name is required — who is this delivery for?');return;}
  if(!val('deliveryAddress')){fail('deliveryAddress','Delivery address is required — where is this going?');return;}
  const j=newJobObject({
    intakeSource:val('intakeSource')||'manual',customerName:val('customerName'),customerType:val('customerType')||'business',
    contactName:val('contactName'),contactPhone:val('contactPhone'),contactEmail:val('contactEmail'),
    pickupAddress:val('pickupAddress'),pickupWindow:val('pickupWindow'),deliveryAddress:val('deliveryAddress'),deliveryWindow:val('deliveryWindow'),
    serviceLevel:val('serviceLevel')||'standard',packageCount:num('packageCount')||1,weight:num('weight'),dimensions:val('dimensions'),miles:num('miles')||10,
    declaredValue:num('declaredValue'),contentsDescription:val('contentsDescription'),
    confidentialityFlag:chk('confidentialityFlag'),medicalFlag:chk('medicalFlag'),legalFlag:chk('legalFlag'),governmentFlag:chk('governmentFlag'),
    highValueFlag:chk('highValueFlag'),temperatureSensitiveFlag:chk('temperatureSensitiveFlag'),
    chainOfCustodyRequired:chk('chainOfCustodyRequired'),recipientIdRequired:chk('recipientIdRequired'),tamperSealRequired:chk('tamperSealRequired'),
    signatureRequired:chk('signatureRequired'),photoPodRequired:chk('photoPodRequired'),directToPersonRequired:chk('directToPersonRequired'),
    gov:{contractNumber:val('gov-contractNumber'),taskOrder:val('gov-taskOrder'),agency:val('gov-agency'),dodaac:val('gov-dodaac'),cage:val('gov-cage'),dd1149Required:chk('gov-dd1149Required')},
  });
  JOBS.unshift(j);
  if(draft===true){
    jobAudit(j,'Order draft saved','via '+j.intakeSource+' intake — not classified yet');
    saveAll();
    openJob(j.jobId);
    return;
  }
  jobAudit(j,'Order created','via '+j.intakeSource+' intake');
  const c=classifyJob(j);
  applyMatrix(j.jobId);suggestFees(j);billingFromEstimate(j);
  saveAll();
  openJob(j.jobId);
  setTimeout(()=>{infoModal(j.jobId+' created',`
    <div class="tut-step"><div class="tut-num" aria-hidden="true">✓</div><div><div class="tut-t">Classified: ${c.type}</div><div class="tut-d">${c.conf}% confidence · ${SEC_LEVELS[c.lvl]}</div></div></div>
    <div class="tut-step"><div class="tut-num" aria-hidden="true">?</div><div><div class="tut-t">Why</div><div class="tut-d">${c.reasons.join('; ')||'default routing'}</div></div></div>
    <div class="tut-step"><div class="tut-num" aria-hidden="true">→</div><div><div class="tut-t">Recommended</div><div class="tut-d">${j.recommendedVehicle||'—'} · customer charge ${$m(j.customerCharge)}</div></div></div>
    <div style="font-size:12.5px;color:var(--t2);margin-top:10px">The job page behind this dialog shows the next step. Wrong type? Fix the flags on the Overview tab and press Re-classify.</div>`);},60);
}

// ============================================================
function podAction(id,act){
  const j=findJob(id);if(!j)return;
  const p=j.pod,now=Date.now(),ts=new Date().toLocaleTimeString();
  const coc=j.chainOfCustodyRequired;
  switch(act){
    case 'start': p.routeStarted=now;j.stageStatus='in_transit';jobAudit(j,'POD: route started',ctGps());pushStatus(j,'out for pickup');break;
    case 'arrivep': p.arrivePickup=now;p.gpsPickup=ctGps();jobAudit(j,'POD: arrived pickup',p.gpsPickup);break;
    case 'confirmp': p.pickupConfirmed=now;if(!p.conditionPickup)p.conditionPickup='Good — verified at pickup';if(coc)addCustody(j,'Picked up','Condition: '+p.conditionPickup);jobAudit(j,'POD: pickup confirmed',ts);pushStatus(j,'picked up');break;
    case 'scan': p.scanConfirmed=true;jobAudit(j,'POD: package scanned (placeholder)',ts);break;
    case 'photop': p.pickupPhoto='pickup_'+j.jobId+'_'+now+'.jpg (placeholder)';jobAudit(j,'POD: pickup photo captured (placeholder)','');break;
    case 'sigs': p.senderSignature=(j.contactName||'Sender')+' — captured '+ts+' (placeholder)';jobAudit(j,'POD: sender signature (placeholder)','');break;
    case 'arrived': p.arriveDelivery=now;p.gpsDelivery=ctGps();jobAudit(j,'POD: arrived delivery',p.gpsDelivery);break;
    case 'photod': p.deliveryPhoto='pod_'+j.jobId+'_'+now+'.jpg (placeholder)';jobAudit(j,'POD: delivery photo captured (placeholder)','');break;
    case 'sigr': p.recipientSignature='Recipient — captured '+ts+' (placeholder)';jobAudit(j,'POD: recipient signature (placeholder)','');break;
    case 'idck': p.recipientIdVerified=!p.recipientIdVerified;jobAudit(j,'POD: recipient ID '+(p.recipientIdVerified?'verified':'unverified'),'');break;
    case 'sealck':
      if(!j.sealNumber){alert('No seal number on this job.');return;}
      p.sealVerified=!p.sealVerified;jobAudit(j,'POD: seal '+(p.sealVerified?'verified intact ('+j.sealNumber+')':'verification cleared'),'');
      if(coc&&p.sealVerified)addCustody(j,'Seal verified at delivery',j.sealNumber);
      break;
    case 'delivered':{
      const miss=[];
      if(!p.arriveDelivery)miss.push('Arrive at delivery first');
      if(j.photoPodRequired&&!p.deliveryPhoto)miss.push('Delivery photo');
      if(j.signatureRequired&&!p.recipientSignature)miss.push('Recipient signature');
      if(j.recipientIdRequired&&!p.recipientIdVerified)miss.push('Recipient ID verification');
      if(j.tamperSealRequired&&!p.sealVerified)miss.push('Seal verification');
      if(miss.length){alert('Cannot mark delivered — missing:\n• '+miss.join('\n• '));return;}
      p.deliveredAt=now;if(!p.conditionDelivery)p.conditionDelivery='Good — verified at delivery';
      j.podStatus='complete';j.stageStatus='delivered';j.dispatchStatus='completed';

function deleteException(id){
  const e=EXCPTS.find(x=>x.id===id);if(!e)return;
  if(!confirm('Delete this exception ('+e.label+')?\n\nIf it really happened, mark it "resolved" instead — deleting removes it from the record.'))return;
  undoPoint('deleted exception: '+e.label);
  EXCPTS.splice(EXCPTS.indexOf(e),1);
  const j=findJob(e.jobId);
  if(j&&j.exceptionStatus==='open'&&!EXCPTS.some(x=>x.jobId===e.jobId&&x.status!=='resolved')){
    j.exceptionStatus=EXCPTS.some(x=>x.jobId===e.jobId)?'resolved':'none';
  }
  saveAll();rNav();rPage();
  _toast('Exception deleted');
}
function exDetail(id){
  const e=EXCPTS.find(x=>x.id===id);if(!e)return;
  ffModal(e.label+' · '+(e.jobId||'no job'),

// ============================================================
// ACCESSIBILITY ENHANCER — keyboard access for clickable rows/cards
// Adds tabindex + role to any clickable non-button element the
// screens render, and lets Enter/Space activate them.
// ============================================================
function enhanceA11y(){
  document.querySelectorAll('#content [onclick]').forEach(el=>{
    const tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL')return;
    if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role'))el.setAttribute('role','button');
  });
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target;
  if(el&&el.getAttribute&&el.getAttribute('role')==='button'&&el.tagName!=='BUTTON'&&el.tagName!=='A'){
    e.preventDefault(); el.click();
  }
});

// Load saved data on startup
window.__ffInit = async function(bootEpoch){
const _res = await loadSnapshot();
// A bootstrap from a previous session must never paint or persist its result.
// loadSnapshot() already refuses to APPLY state across an epoch change; this
// abandons the rest of init (chip, lock, first-run save) as well.
if (window.__ffBoot && typeof bootEpoch === 'number' && bootEpoch !== window.__ffBoot.epoch) return;
syncAllScores(); // compute live Fit Scores from current data
ctMigrate(); // Control Tower schema v2: default-fill jobs, seed demo data on first run
// Update logo name if org settings were saved
const _logoEl = document.querySelector('.logo-name');
if (_logoEl) _logoEl.textContent = 'Futuro OS'; // product brand is fixed; company name lives in orgSettings for documents
// keyboard access for dynamically rendered clickable rows/cards
const _contentEl = document.getElementById('content');
if (_contentEl) new MutationObserver(()=>enhanceA11y()).observe(_contentEl,{childList:true,subtree:true});
// persistent save chip + cloud-state gating: derived from the load result, never
// from an assumption that reaching this line means the cloud is healthy.
__ffApplyLoadResult(_res);
go('control');
fetchInbox(); // pull website leads + populate inbox badge
fetchDeliveries(); // shared driver job list + badge + live sync with mobile
// Show subtle save indicator only when a cloud row actually loaded
if (_res.state === LOAD_STATE.LOADED) {
  const _st = getSaveStatus();
  const _ind = document.createElement('div');
  _ind.setAttribute('role','status');
  _ind.style.cssText = 'position:fixed;bottom:14px;right:14px;background:rgba(5,150,105,0.15);border:1px solid rgba(52,211,153,0.3);color:#34d399;font-size:12px;padding:6px 12px;border-radius:6px;z-index:999;font-family:Syne,sans-serif;pointer-events:none';
  _ind.textContent = '✓ Data restored' + (_st ? ' · saved ' + _st.toLocaleTimeString() : '');
  document.body.appendChild(_ind);
  setTimeout(() => _ind.remove(), 3000);
}
// First run: show the welcome walkthrough once. Gated on a verified-writable cloud
// state — orgSettings has no tutorialSeen default, so a FAILED load previously left
// this true and fired saveAll(), upserting empty state over a good cloud row.
if (_cloudWritable && !_crmLocked && !orgSettings.tutorialSeen) {
  orgSettings.tutorialSeen = true;
  saveAll();
  setTimeout(()=>showTutorial('welcome'), 400);
}
}; // end __ffInit — runs only after successful login

// ---- QUALIFICATION ENGINE (deterministic, rules-based — no AI/LLM) ----
function gcScore(o){
  const P=GC_PROFILE, flags=[];
  let fit=50, win=45, risk=25;
  const on=(o.naics||'').replace(/\D/g,'').slice(0,6);
  if(on){
    const match=P.naics.some(n=>n && (on.startsWith(String(n).slice(0,4))||String(n)===on));
    if(match){fit+=18;win+=8;flags.push({t:'ok',d:'NAICS '+esc(on)+' aligns with your registered codes'});}
    else{fit-=14;risk+=16;flags.push({t:'warn',d:'NAICS '+esc(on)+' is outside your registered codes'});}
  } else flags.push({t:'warn',d:'No NAICS on the opportunity — verify scope manually'});
  if(o.setAside){
    const held=P.setAsides.map(x=>String(x).toUpperCase());
    if(held.includes(String(o.setAside).toUpperCase())){fit+=10;win+=10;flags.push({t:'ok',d:'You hold the '+esc(o.setAside)+' set-aside'});}
    else{risk+=10;flags.push({t:'warn',d:'Set-aside '+esc(o.setAside)+' — confirm eligibility (not in your profile)'});}
  }
  const st=(o.location||'').toUpperCase().match(/\b([A-Z]{2})\b/);
  if(st){ if(P.geoStates.includes(st[1])){fit+=8;flags.push({t:'ok',d:'Within your service corridor ('+st[1]+')'});}
    else{risk+=6;flags.push({t:'warn',d:'Outside your usual corridor ('+esc(st[1])+')'});} }
  const v=+o.value||0;
  if(v>0&&v<250000){fit+=6;flags.push({t:'ok',d:'Right-sized for a solo/small operator'});}
  else if(v>=5000000){risk+=18;win-=8;flags.push({t:'warn',d:'Large ceiling (~$'+Math.round(v/1e6)+'M) — capacity/teaming risk'});}
  const days=gcDays(o.respDue);
  if(days!==null){
    if(days<0){risk+=20;flags.push({t:'warn',d:'Response date has passed'});}
    else if(days<7){risk+=12;flags.push({t:'warn',d:'Only '+days+' day(s) to respond'});}
    else if(days>21){fit+=4;flags.push({t:'ok',d:days+' days to respond — comfortable runway'});}
  }
  if(o.incumbent){win-=12;risk+=10;flags.push({t:'warn',d:'Incumbent present ('+esc(o.incumbent)+') — displacement is hard'});}
  fit=Math.max(0,Math.min(100,fit));win=Math.max(0,Math.min(100,win));risk=Math.max(0,Math.min(100,risk));
  const composite=Math.round(fit*0.45+win*0.35+(100-risk)*0.20);
  let verdict='CONDITIONAL';
  if(composite>=65&&risk<55)verdict='BID'; else if(composite<45||risk>=70)verdict='NO-BID';
  return {fit:Math.round(fit),win:Math.round(win),risk:Math.round(risk),composite,verdict,flags,scoredAt:Date.now()};
}
function gcRescore(o){o.score=gcScore(o);return o.score;}
function mkOpp(p){return Object.assign({id:gcId('opp'),title:'',agency:'',office:'',sol:'',naics:'',psc:'',setAside:'',noticeType:'o',value:0,location:'',respDue:'',postDate:'',incumbent:'',summary:'',source:'manual',stage:'identify',starred:false,trashed:false,activity:[],createdAt:Date.now(),updatedAt:Date.now()},p);}

// ---- GOVCON COMMAND ----
function rGCCommand(){
  const A=GC_OPPS.filter(gcActive);
  const closing=A.filter(o=>{const d=gcDays(o.respDue);return d!==null&&d>=0&&d<=14&&!['won','lost','nobid'].includes(o.stage);}).sort((a,b)=>gcDays(a.respDue)-gcDays(b.respDue));
  const awNoContract=GC_AWARDS.filter(a=>!a.contractId);
  const tosNoJob=GC_TOS.filter(t=>!(t.jobIds&&t.jobIds.length)&&t.status!=='converted');
  const bids=A.filter(o=>o.score&&o.score.verdict==='BID'&&['identify','qualify'].includes(o.stage));
  const pipelineVal=A.filter(o=>!['lost','nobid'].includes(o.stage)).reduce((s,o)=>s+(+o.value||0),0);
  const byStage=GC_STAGES.map(s=>({s,n:A.filter(o=>o.stage===s.id).length}));
  document.getElementById('content').innerHTML=`
  <div class="gc-stats">
    ${gcStatCard(A.length,'Open opportunities')}
    ${gcStatCard($m(pipelineVal),'Pipeline value (unweighted)')}
    ${gcStatCard(closing.length,'Closing ≤14 days')}
    ${gcStatCard(GC_CONTRACTS.length,'Active contracts')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">
    <div class="card">
      <div class="card-title">Needs a decision</div>
      <div class="card-sub">Deadlines and hand-offs waiting on you</div>
      ${(closing.length||awNoContract.length||tosNoJob.length||bids.length)?'':'<div class="empty-state" style="padding:20px">Nothing urgent. Add opportunities to get started.</div>'}
      ${bids.map(o=>`<div class="gc-flag"><i class="ti ti-thumb-up" style="color:var(--tgreen)"></i><div><strong>Qualified BID:</strong> <span class="clk" style="color:var(--tblue);cursor:pointer" onclick="openOpp('${o.id}')">${esc(o.title)}</span> — advance to capture.</div></div>`).join('')}
      ${closing.map(o=>{const d=gcDays(o.respDue);return `<div class="gc-flag"><i class="ti ti-clock-hour-5" style="color:${d<=3?'var(--tred)':'var(--tamber)'}"></i><div><strong>${d===0?'Due today':d+'d left'}:</strong> <span class="clk" style="color:var(--tblue);cursor:pointer" onclick="openOpp('${o.id}')">${esc(o.title)}</span></div></div>`;}).join('')}
      ${awNoContract.map(a=>`<div class="gc-flag"><i class="ti ti-award" style="color:var(--tamber)"></i><div><strong>Award needs a contract:</strong> ${esc(a.title)} <button class="btn-sm" onclick="gcAwardToContract('${a.id}')">Set up contract</button></div></div>`).join('')}
      ${tosNoJob.map(t=>`<div class="gc-flag"><i class="ti ti-list-check" style="color:var(--tcyan)"></i><div><strong>Task order awaiting job:</strong> ${esc(t.num||t.title||t.id)} <button class="btn-sm" onclick="gcTOToJob('${t.id}')">Create job</button></div></div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Capture pipeline</div>
      <div class="card-sub">Opportunities by stage · <button class="btn-sm" onclick="oppAdd()"><i class="ti ti-plus"></i> New opportunity</button></div>
      ${byStage.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><span class="gc-dot" style="background:${x.s.cl}"></span><span style="flex:1;color:var(--t2);font-size:12.5px">${x.s.lb}</span><span style="color:var(--t1);font-weight:600">${x.n}</span></div>`).join('')}
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--b1);font-size:11px;color:var(--t3)">Qualification is rules-based (NAICS, set-aside, geography, value, deadline, incumbent) driven by your <span class="clk" style="color:var(--tblue);cursor:pointer" onclick="go('gcprofile')">Capability Profile</span>. No AI model is used.</div>
    </div>
  </div>`;
}

function gcMatrixHTML(){if(!gcMatrix.length)return '';return `<div class="card" style="padding:0;overflow-x:auto"><div style="padding:12px 16px;border-bottom:1px solid var(--b1);font-weight:600;color:var(--t1);font-size:13px">Compliance Matrix — ${gcMatrix.length} requirement(s)</div><table class="gc-tbl"><thead><tr><th>#</th><th>Requirement</th><th>Source</th></tr></thead><tbody>${gcMatrix.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.text)}</td><td>${esc(r.tag)}</td></tr>`).join('')}</tbody></table></div>`;}
function gcParseRFP(){
  const t=document.getElementById('gc-rfp').value||'';
  if(!t.trim()){alert('Paste some RFP text first.');return;}
  const lines=t.split(/\r?\n/),out=[];
  lines.forEach(ln=>{const s=ln.trim();if(!s)return;
    const secL=s.match(/^(L|M)[.\-\s]?\d+/i);
    if(secL){out.push({text:s.slice(0,300),tag:'Section '+secL[1].toUpperCase()});return;}
    if(/\b(shall|must|is required to|will provide|required to)\b/i.test(s)&&s.length>12){out.push({text:s.slice(0,300),tag:'Requirement'});}
  });
  gcMatrix=out.slice(0,200);
  gcLog('RFP parsed',out.length+' requirements');
  document.getElementById('gc-matrix').innerHTML=gcMatrixHTML();
  if(!out.length)document.getElementById('gc-matrix').innerHTML='<div class="card"><div class="empty-state">No "shall/must" or Section L/M lines detected. Check the pasted text.</div></div>';
  else _toast(out.length+' requirements extracted',false);

function rContracts(){
  const c=document.getElementById('content');
  if(!GC_CONTRACTS.length){c.innerHTML=gcEmpty('ti-file-certificate','No contracts yet','Contracts are created from awards. Win an opportunity, convert to an award, then set up the contract.','');return;}
  c.innerHTML=`<div class="card" style="padding:0;overflow-x:auto"><table class="gc-tbl"><thead><tr><th>Contract</th><th>Agency</th><th>Type</th><th>Ceiling</th><th>PoP</th><th>Task Orders</th></tr></thead><tbody>${GC_CONTRACTS.map(k=>`<tr class="clk" onclick="openContract('${k.id}')"><td style="color:var(--t1);font-weight:600">${esc(k.title)}<div style="color:var(--t3);font-size:11px;font-weight:400">${esc(k.contractNumber||'—')}</div></td><td>${esc(k.agency||'—')}</td><td>${esc(k.type||'—')}</td><td>${k.ceiling?$m(k.ceiling):'—'}</td><td style="font-size:11.5px">${esc(k.popStart||'—')}${k.popEnd?' → '+esc(k.popEnd):''}</td><td>${GC_TOS.filter(t=>t.contractId===k.id).length}</td></tr>`).join('')}</tbody></table></div>`;
}
function rContractDetail(){
  if(!gcSel){go('gccontracts');return;}
  const k=GC_CONTRACTS.find(x=>x.id===gcSel.id);if(!k){gcSel=null;go('gccontracts');return;}
  const tos=GC_TOS.filter(t=>t.contractId===k.id);
  const opp=k.oppId?gcFindOpp(k.oppId):null;
  const award=GC_AWARDS.find(a=>a.id===k.awardId);
  const clinTotal=(k.clins||[]).reduce((s,cl)=>s+(+cl.value||0),0);
  const c=document.getElementById('content');
  c.innerHTML=`<button class="gc-back" onclick="gcSel=null;go('gccontracts')"><i class="ti ti-arrow-left"></i> Back to Contracts</button>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px"><div><div style="font-size:18px;font-weight:700;color:var(--t1)">${esc(k.title)}</div><div style="color:var(--t3);font-size:12.5px">${esc(k.contractNumber||'—')} · ${esc(k.agency||'—')}</div></div><span class="badge" style="background:var(--bgreen);color:var(--tgreen)">${esc(k.status||'active')}</span></div>
  <div class="gc-stats">${gcStatCard(k.ceiling?$m(k.ceiling):'—','Ceiling')}${gcStatCard(k.funded?$m(k.funded):'—','Funded')}${gcStatCard(tos.length,'Task orders')}${gcStatCard($m(clinTotal),'CLIN total')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">
    <div class="card"><div class="card-title">Contract details</div><dl class="gc-key">
      <dt>Type</dt><dd>${esc(k.type||'—')}</dd><dt>Period of performance</dt><dd>${esc(k.popStart||'—')}${k.popEnd?' → '+esc(k.popEnd):''}</dd><dt>NAICS / PSC</dt><dd>${esc(k.naics||'—')} / ${esc(k.psc||'—')}</dd><dt>Acceptance contact</dt><dd>${esc(k.acceptanceContact||'—')}</dd>
      <dt>Source opportunity</dt><dd>${opp?`<span class="clk" style="color:var(--tblue);cursor:pointer" onclick="openOpp('${opp.id}')">${esc(opp.title)}</span>`:'—'}</dd>
      <dt>Award</dt><dd>${award?esc(award.awardNumber||award.title):'—'}${award&&award.awardAmount?' · '+$m(award.awardAmount):''}</dd></dl></div>
    <div class="card"><div class="card-title">CLINs <button class="btn-sm" style="float:right" onclick="clinAdd('${k.id}')"><i class="ti ti-plus"></i> Add CLIN</button></div>
      ${(k.clins&&k.clins.length)?`<table class="gc-tbl"><thead><tr><th>CLIN</th><th>Description</th><th>Qty</th><th>Value</th></tr></thead><tbody>${k.clins.map(cl=>`<tr><td>${esc(cl.num||'—')}</td><td>${esc(cl.desc||'—')}</td><td>${esc(String(cl.qty||''))} ${esc(cl.unit||'')}</td><td>${cl.value?$m(cl.value):'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty-state" style="padding:16px">No CLINs yet.</div>'}</div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-title">Task Orders <button class="btn" style="float:right" onclick="toAdd('${k.id}')"><i class="ti ti-plus"></i> Add Task Order</button></div>
    ${tos.length?`<table class="gc-tbl"><thead><tr><th>Task Order</th><th>Value</th><th>Location</th><th>Due</th><th>Jobs</th><th></th></tr></thead><tbody>${tos.map(t=>`<tr><td style="color:var(--t1);font-weight:600">${esc(t.num||t.title||'—')}<div style="color:var(--t3);font-size:11px;font-weight:400">${esc(t.requiredService||'')}</div></td><td>${t.value?$m(t.value):'—'}</td><td>${esc(t.location||'—')}</td><td>${esc(t.dueDate||'—')}</td><td>${(t.jobIds&&t.jobIds.length)?t.jobIds.map(j=>`<span class="clk" style="color:var(--tblue);cursor:pointer" onclick="openJob('${j}')">${esc(j)}</span>`).join(', '):'<span style="color:var(--t4)">none</span>'}</td><td>${(t.jobIds&&t.jobIds.length)?'':`<button class="btn-sm" onclick="gcTOToJob('${t.id}')"><i class="ti ti-arrow-right"></i> Create job</button>`}</td></tr>`).join('')}</tbody></table>`:'<div class="empty-state" style="padding:16px">No task orders yet. Add one, then convert it into a Futuro OS job.</div>'}</div>
  <div class="card" style="margin-top:14px"><div class="card-title">Performance <button class="btn-sm" style="float:right" onclick="perfAdd('${k.id}')"><i class="ti ti-plus"></i> Record</button></div>
    ${GC_PERF.filter(p=>p.contractId===k.id).map(p=>`<div class="gc-flag"><i class="ti ti-star" style="color:var(--tamber)"></i><div><strong>${esc(p.scope||'Performance record')}</strong> — ${esc(p.periodStart||'')}${p.periodEnd?' to '+esc(p.periodEnd):''} · ${p.jobsCompleted||0} jobs · ${esc(String(p.onTimeRate||'—'))}% on-time ${p.official?'<span class="badge" style="background:var(--bgreen);color:var(--tgreen)">CPARS-eligible</span>':'<span class="badge" style="background:var(--bg4);color:var(--t3)">internal</span>'}</div></div>`).join('')||'<div class="empty-state" style="padding:16px">No performance records yet.</div>'}</div>`;
}
function clinAdd(cid){const k=GC_CONTRACTS.find(x=>x.id===cid);if(!k)return;ffModal('Add CLIN',fRow(fText('cl-num','CLIN #','0001'),fNum('cl-value','Value ($)'))+fText('cl-desc','Description')+fRow(fNum('cl-qty','Quantity'),fText('cl-unit','Unit','ea / mo')),()=>{(k.clins=k.clins||[]).push({id:gcId('cl'),num:_val('cl-num'),desc:_val('cl-desc'),qty:_numv('cl-qty'),unit:_val('cl-unit'),value:_numv('cl-value')});gcLog('CLIN added',k.title+' '+_val('cl-num'));saveAll();rContractDetail();_toast('CLIN added',false);});}
function toAdd(cid){const k=GC_CONTRACTS.find(x=>x.id===cid);if(!k)return;ffModal('Add Task Order',fRow(fText('to-num','Task Order #'),fNum('to-value','Value ($)'))+fText('to-service','Required service / scope')+fRow(fText('to-loc','Location','City, ST'),fText('to-due','Due','YYYY-MM-DD'))+fText('to-sec','Security requirement (optional)'),()=>{const num=_val('to-num');if(!num){alert('Task Order # required');return false;}GC_TOS.unshift({id:gcId('to'),contractId:k.id,num,title:num,value:_numv('to-value'),requiredService:_val('to-service'),location:_val('to-loc'),dueDate:_val('to-due'),securityReq:_val('to-sec'),status:'open',jobIds:[],createdAt:Date.now()});gcLog('Task order added',k.title+' TO '+num);saveAll();rContractDetail();_toast('Task order added',false);});}
function gcTOToJob(toId){
  const to=GC_TOS.find(t=>t.id===toId);if(!to)return;
  const k=GC_CONTRACTS.find(x=>x.id===to.contractId);
  const j=newJobObject({
    intakeSource:'govcon', customerName:(k&&k.agency)||to.title||'Government', customerType:'government', governmentFlag:true,
    deliveryAddress:to.location||'', contentsDescription:to.requiredService||'', serviceLevel:'standard',
    signatureRequired:true, photoPodRequired:true,
    notes:'Auto-created from Task Order '+(to.num||to.id)+(k?(' · Contract '+(k.contractNumber||k.id)):''),
    gov:{contractNumber:(k&&k.contractNumber)||'',taskOrder:to.num||'',agency:(k&&k.agency)||'',naics:(k&&k.naics)||GC_PROFILE.naicsPrimary,psc:(k&&k.psc)||'',deliveryLocation:to.location||'',acceptanceContact:(k&&k.acceptanceContact)||'',dd1149Required:true,securityReq:to.securityReq||''}
  });
  JOBS.unshift(j);
  jobAudit(j,'Order created','from GovCon task order '+(to.num||to.id));
  try{classifyJob(j);applyMatrix(j.jobId);suggestFees(j);billingFromEstimate(j);}catch(e){console.warn('job post-processing:',e.message);}
  (to.jobIds=to.jobIds||[]).push(j.jobId);to.status='converted';
  gcLog('Task order → job',(to.num||to.id)+' created '+j.jobId);saveAll();
  _toast('Job '+j.jobId+' created from task order',false);
  gcSel=null;openJob(j.jobId);
}
function perfAdd(cid){const k=GC_CONTRACTS.find(x=>x.id===cid);if(!k)return;const jobs=GC_TOS.filter(t=>t.contractId===cid).reduce((n,t)=>n+((t.jobIds||[]).length),0);ffModal('Record Performance',fText('pf-scope','Scope summary')+fRow(fText('pf-start','Period start','YYYY-MM-DD'),fText('pf-end','Period end','YYYY-MM-DD'))+fRow(fNum('pf-jobs','Jobs completed'),fNum('pf-ontime','On-time %'))+fTextarea('pf-notes','Notes')+`<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--t2)"><input type="checkbox" id="pf-official"> This qualifies as official government past performance (CPARS-eligible)</label>`,()=>{GC_PERF.unshift({id:gcId('pf'),contractId:cid,scope:_val('pf-scope'),agency:k.agency,periodStart:_val('pf-start'),periodEnd:_val('pf-end'),jobsCompleted:_numv('pf-jobs')||jobs,onTimeRate:_numv('pf-ontime'),official:document.getElementById('pf-official').checked,notes:_val('pf-notes'),value:k.funded||k.ceiling||0,createdAt:Date.now()});gcLog('Performance recorded',k.title);saveAll();rContractDetail();_toast('Performance recorded',false);});const pj=document.getElementById('pf-jobs');if(pj)pj.value=jobs;}
function rTaskOrders(){
  const c=document.getElementById('content');
  if(!GC_TOS.length){c.innerHTML=gcEmpty('ti-list-check','No task orders yet','Task orders live under a contract. Open a contract to add one, then convert it into a job.','');return;}
  c.innerHTML=`<div class="card" style="padding:0;overflow-x:auto"><table class="gc-tbl"><thead><tr><th>Task Order</th><th>Contract</th><th>Value</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${GC_TOS.map(t=>{const k=GC_CONTRACTS.find(x=>x.id===t.contractId);return `<tr><td style="color:var(--t1);font-weight:600">${esc(t.num||t.title||'—')}</td><td>${k?`<span class="clk" style="color:var(--tblue);cursor:pointer" onclick="openContract('${k.id}')">${esc(k.contractNumber||k.title)}</span>`:'—'}</td><td>${t.value?$m(t.value):'—'}</td><td>${esc(t.dueDate||'—')}</td><td>${(t.jobIds&&t.jobIds.length)?'<span class="badge" style="background:var(--bgreen);color:var(--tgreen)">'+t.jobIds.length+' job(s)</span>':'<span class="badge" style="background:var(--bamber);color:var(--tamber)">open</span>'}</td><td>${(t.jobIds&&t.jobIds.length)?'':`<button class="btn-sm" onclick="gcTOToJob('${t.id}')">Create job</button>`}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function rPerformance(){
  const c=document.getElementById('content');
  if(!GC_PERF.length){c.innerHTML=gcEmpty('ti-star','No performance records yet','Record completed work from a contract to build capability-statement evidence.','');return;}
  c.innerHTML=`<div class="card" style="padding:0;overflow-x:auto"><table class="gc-tbl"><thead><tr><th>Scope</th><th>Agency</th><th>Period</th><th>Jobs</th><th>On-time</th><th>Type</th></tr></thead><tbody>${GC_PERF.map(p=>`<tr><td style="color:var(--t1);font-weight:600">${esc(p.scope||'—')}</td><td>${esc(p.agency||'—')}</td><td style="font-size:11.5px">${esc(p.periodStart||'—')}${p.periodEnd?' → '+esc(p.periodEnd):''}</td><td>${p.jobsCompleted||0}</td><td>${p.onTimeRate?esc(String(p.onTimeRate))+'%':'—'}</td><td>${p.official?'<span class="badge" style="background:var(--bgreen);color:var(--tgreen)">CPARS-eligible</span>':'<span class="badge" style="background:var(--bg4);color:var(--t3)">internal</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

// ============================================================================
// Hand the initializer to the bootstrap coordinator in the auth script above.
// This MUST be the last statement in this block: if authentication has already
// resolved, the coordinator invokes __ffInit synchronously from right here, so
// every declaration it depends on has to exist by this point.
// ============================================================================
if (typeof window.__ffRegisterInit === 'function') window.__ffRegisterInit(window.__ffInit);
else console.warn('Futuro OS: bootstrap coordinator missing; app cannot start.');
</script>
</body>
</html>
