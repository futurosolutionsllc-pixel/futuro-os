<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturoOS</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.topbar{display:flex;gap:10px;padding:10px;background:#020617}
button{background:#1e293b;color:white;border:none;padding:8px 12px;cursor:pointer}
button:hover{background:#334155}
.panel{display:none;padding:20px}
.panel.active{display:block}
.card{background:#1e293b;padding:12px;margin-bottom:8px;border-radius:8px}
input, textarea{padding:8px;margin:5px 0;width:60%}
.badge{padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px}
.freight{background:#2563eb}
.govcon{background:#16a34a}
.pipeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#020617;padding:10px;border-radius:8px}
.sel{margin-right:6px}
.actionbar{background:#111827;padding:10px;margin-bottom:10px;border-radius:6px;display:none}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('freight')">Freight</button>
  <button onclick="show('govcon')">GovCon</button>
  <button onclick="show('pipeline')">Pipeline</button>
  <button onclick="show('ai')">AI</button>
</div>

<div id="dashboard" class="panel active">
  <div class="card">FuturoOS Dashboard</div>
</div>

<!-- FREIGHT -->
<div id="freight" class="panel">
  <div class="card">
    <h2>Freight Deals</h2>
    <input id="fTitle" placeholder="Load name">
    <input id="fValue" placeholder="Value">
    <button onclick="addFreight()">Add</button>
  </div>

  <div class="actionbar" id="actionbar">
    <button onclick="deleteSelected()">Delete Selected</button>
  </div>

  <div id="freightList"></div>
</div>

<!-- GOVCON -->
<div id="govcon" class="panel">
  <div class="card">
    <h2>GovCon Opportunities</h2>
    <input id="gTitle" placeholder="Opportunity">
    <input id="gValue" placeholder="Value">
    <button onclick="addGov()">Add</button>
  </div>

  <div id="govList"></div>
</div>

<!-- PIPELINE -->
<div id="pipeline" class="panel">
  <h2>Pipeline</h2>
  <div class="pipeline">
    <div class="col"><h3>Lead</h3><div id="lead"></div></div>
    <div class="col"><h3>Active</h3><div id="active"></div></div>
    <div class="col"><h3>Closed</h3><div id="closed"></div></div>
  </div>
</div>

<!-- AI -->
<div id="ai" class="panel">
  <div class="card">
    <h3>AI Command</h3>
    <textarea id="aiInput"></textarea>
    <button onclick="runAI()">Run</button>
    <div id="aiOutput"></div>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// STORAGE
let deals = JSON.parse(localStorage.getItem('deals')) || [];
let selected = [];

// SAVE
function save(){
  localStorage.setItem('deals', JSON.stringify(deals));
}

// ADD FREIGHT
function addFreight(){
  const title = fTitle.value;
  const value = fValue.value;
  if(!title) return;

  deals.push({
    id: Date.now(),
    type:'freight',
    title,
    value,
    stage:'lead'
  });

  fTitle.value='';
  fValue.value='';
  save();
  renderAll();
}

// ADD GOVCON
function addGov(){
  const title = gTitle.value;
  const value = gValue.value;
  if(!title) return;

  deals.push({
    id: Date.now(),
    type:'govcon',
    title,
    value,
    stage:'lead'
  });

  gTitle.value='';
  gValue.value='';
  save();
  renderAll();
}

// RENDER
function renderAll(){
  renderFreight();
  renderGov();
  renderPipeline();
}

// FREIGHT
function renderFreight(){
  const box = document.getElementById('freightList');
  box.innerHTML='';
  selected=[];

  deals.filter(d=>d.type==='freight').forEach((d,i)=>{
    box.innerHTML+=`
      <div class="card">
        <input type="checkbox" class="sel" onchange="toggle(${d.id})">
        ${d.title} - $${d.value}
        <span class="badge freight">Freight</span>
        <button onclick="move(${d.id})">Next</button>
        <button onclick="edit(${d.id})">Edit</button>
      </div>
    `;
  });
}

// GOV
function renderGov(){
  const box = document.getElementById('govList');
  box.innerHTML='';

  deals.filter(d=>d.type==='govcon').forEach(d=>{
    box.innerHTML+=`
      <div class="card">
        ${d.title} - $${d.value}
        <span class="badge govcon">GovCon</span>
      </div>
    `;
  });
}

// PIPELINE
function renderPipeline(){
  ['lead','active','closed'].forEach(s=>{
    document.getElementById(s).innerHTML='';
  });

  deals.forEach(d=>{
    document.getElementById(d.stage).innerHTML+=`
      <div class="card">
        ${d.title}<br>$${d.value}<br><small>${d.type}</small>
      </div>
    `;
  });
}

// MOVE
function move(id){
  const d = deals.find(x=>x.id===id);
  if(d.stage==='lead') d.stage='active';
  else if(d.stage==='active') d.stage='closed';
  save();
  renderAll();
}

// SELECT
function toggle(id){
  if(selected.includes(id)){
    selected = selected.filter(x=>x!==id);
  } else {
    selected.push(id);
  }
  document.getElementById('actionbar').style.display =
    selected.length ? 'block' : 'none';
}

// DELETE
function deleteSelected(){
  deals = deals.filter(d=>!selected.includes(d.id));
  selected=[];
  save();
  renderAll();
  document.getElementById('actionbar').style.display='none';
}

// EDIT
function edit(id){
  const d = deals.find(x=>x.id===id);
  const newTitle = prompt("Edit title", d.title);
  if(newTitle!==null) d.title=newTitle;
  save();
  renderAll();
}

// AI
function runAI(){
  aiOutput.innerText = "AI insight: looks solid.";
}

// INIT
renderAll();
</script>

</body>
</html>
