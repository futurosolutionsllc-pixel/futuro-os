<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturoOS</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
}

.topbar {
  display:flex;
  gap:10px;
  padding:10px;
  background:#020617;
}

button {
  background:#1e293b;
  color:white;
  border:none;
  padding:8px 12px;
  cursor:pointer;
}

button:hover {
  background:#334155;
}

.panel {
  display:none;
  padding:20px;
}

.panel.active {
  display:block;
}

.card {
  background:#1e293b;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('freight')">Freight</button>
  <button onclick="show('govcon')">GovCon</button>
  <button onclick="show('pipeline')">Pipeline</button>
  <button onclick="show('ai')">AI</button>
</div>

<div id="dashboard" class="panel active">
  <div class="card">Dashboard Overview</div>
</div>

<div id="freight" class="panel">
  <div class="card">Freight Module (base)</div>
</div>

<div id="govcon" class="panel">
  <div class="card">
    <h2>GovCon Workspace</h2>
    <p>Opportunities, contracts, pipeline tracking will go here.</p>
  </div>

  <div class="card">
    <input id="govInput" placeholder="Add opportunity..." style="padding:8px;width:70%">
    <button onclick="addGov()">Add</button>
  </div>

  <div id="govList"></div>
</div>

<div id="pipeline" class="panel">
  <div class="card">Unified Pipeline (coming next)</div>
</div>

<div id="ai" class="panel">
  <div class="card">
    <h3>AI Command</h3>
    <textarea id="aiInput" style="width:100%;height:80px"></textarea>
    <button onclick="runAI()">Run</button>
    <div id="aiOutput" style="margin-top:10px;"></div>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// GovCon simple system
let govData = [];

function addGov(){
  const val = document.getElementById('govInput').value;
  if(!val) return;
  govData.push(val);
  document.getElementById('govInput').value = '';
  renderGov();
}

function renderGov(){
  const list = document.getElementById('govList');
  list.innerHTML = '';
  govData.forEach((item,i)=>{
    list.innerHTML += `
      <div class="card">
        ${item}
        <button onclick="delGov(${i})">Delete</button>
      </div>
    `;
  });
}

function delGov(i){
  govData.splice(i,1);
  renderGov();
}

// Fake AI (placeholder)
function runAI(){
  const input = document.getElementById('aiInput').value;
  document.getElementById('aiOutput').innerText =
    "AI Response for: " + input;
}
</script>

</body>
</html>
