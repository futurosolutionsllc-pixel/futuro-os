<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Futuro OS — Solo Edition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06080f;--bg2:transparent;--bg3:rgba(13,19,32,0.82);--bg4:rgba(255,255,255,0.045);--bg5:rgba(255,255,255,0.08);
  --b1:rgba(124,156,214,0.12);--b2:rgba(124,156,214,0.20);--b3:rgba(124,156,214,0.32);
  --t1:#eaf0fb;--t2:#9fb1cc;--t3:#6f7f99;--t4:#46546b;
  --blue:#3b72ff;--bblue:rgba(59,114,255,0.15);--tblue:#86a6ff;
  --green:#22d39b;--bgreen:rgba(34,211,155,0.15);--tgreen:#52e3b8;
  --amber:#e8a33d;--bamber:rgba(232,163,61,0.15);--tamber:#f4ba63;
  --red:#ff5d6c;--bred:rgba(255,93,108,0.14);--tred:#ff8b96;
  --cyan:#22d3ee;--bcyan:rgba(34,211,238,0.14);--tcyan:#67e1f5;
  --rmd:10px;--rlg:14px;
  --am:#e8a33d;
  --panel-glass:rgba(18,26,44,0.46);--panel-solid:rgba(13,19,33,0.86);--shell:rgba(10,15,27,0.62);
  --blur:20px;--blur-solid:11px;--sh:0 8px 30px rgba(0,0,0,.45);
}
body{font-family:'Syne',system-ui,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--t1);line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.logo{padding:16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;color:white;font-size:16px;flex-shrink:0}
.logo-name{font-size:14px;font-weight:700;color:var(--t1)}
.logo-sub{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.nav{padding:8px;flex:1;overflow-y:auto}
.nb{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rmd);border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:12px;text-align:left;transition:all .12s;position:relative;margin-bottom:2px}
.nb:hover{background:var(--bg3);color:var(--t1)}
.nb.active{background:var(--bblue);color:var(--tblue);font-weight:600}
.nb i{font-size:15px;opacity:.85}
.nbadge{margin-left:auto;background:var(--red);color:white;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px}
.nav-section{font-size:10.5px;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-weight:600}
.nav-divider{height:1px;background:var(--b1);margin:4px 8px 6px}
.nav-footer{padding:12px 16px 18px;border-top:1px solid var(--b1)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bblue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tblue);flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--bg2);border-bottom:1px solid var(--b1);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.2px}
.topbar-sub{font-size:11px;color:var(--t3);margin-top:1px}
.search{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rmd);padding:5px 11px;gap:7px;min-width:180px}
.search input{border:none;background:transparent;outline:none;font-size:12px;color:var(--t1);width:100%}
.search input::placeholder{color:var(--t4)}
.btn{padding:7px 16px;background:var(--blue);color:white;border:none;border-radius:var(--rmd);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-ghost{padding:7px 14px;background:var(--bg3);color:var(--t1);border:1px solid var(--b2);border-radius:var(--rmd);font-size:12px;cursor:pointer}
.btn-sm{padding:5px 12px;background:var(--bg4);color:var(--t2);border:1px solid var(--b2);border-radius:var(--rmd);font-size:11px;cursor:pointer}
.btn-sm:hover{color:var(--t1);border-color:var(--b3)}
.btn-copy{padding:6px 14px;background:var(--bblue);color:var(--tblue);border:1px solid rgba(96,165,250,.2);border-radius:var(--rmd);font-size:11px;font-weight:600;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:16px}
.card-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--t3);margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:14px 16px}
.kpi-l{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.kpi-v{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.5px}
.kpi-c{font-size:11px;margin-top:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.th{display:grid;padding:8px 16px;background:var(--bg4);border-bottom:1px solid var(--b1);font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;gap:10px}
.tr{display:grid;padding:11px 16px;border-bottom:1px solid var(--b1);align-items:center;gap:10px;cursor:pointer;transition:background .1s}
.tr:hover{background:var(--bg5)}
.tr:last-child{border-bottom:none}
.cn{font-size:12px;font-weight:600;color:var(--t1)}
.cs2{font-size:11px;color:var(--t3);margin-top:2px}
.sb{display:flex;align-items:center;gap:6px}
.st{flex:1;height:5px;background:var(--b2);border-radius:3px;overflow:hidden}
.sf{height:100%;border-radius:3px;transition:width .5s}
.tabs{display:flex;gap:2px;background:var(--bg4);border-radius:var(--rmd);padding:3px;width:fit-content;margin-bottom:12px;border:1px solid var(--b1)}
.tab-btn{padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-size:11px;background:transparent;color:var(--t3);transition:all .12s}
.tab-btn.active{background:var(--bg3);color:var(--t1);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.taskrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.taskrow:last-child{border-bottom:none}
.cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.cb.done{background:var(--bgreen);border-color:var(--tgreen);color:var(--tgreen)}
.kanban{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:200px;flex:0 0 200px;background:var(--bg3);border-radius:var(--rlg);padding:10px;border:1px solid var(--b1)}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b1)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dc{background:var(--bg4);border:1px solid var(--b1);border-radius:var(--rmd);padding:10px;margin-bottom:7px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.dc:hover{background:var(--bg5)}
.arow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.arow:last-child{border-bottom:none}
.aicon{width:32px;height:32px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:var(--t2)}
.back-btn{background:none;border:none;color:var(--t2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:14px;padding:0}
.back-btn:hover{color:var(--t1)}
.lhead{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:18px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pi{background:var(--bg4);border-radius:var(--rmd);padding:10px 12px}
.pl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pv{font-size:16px;font-weight:600;color:var(--t1)}
.alert-bar{background:var(--bamber);border:1px solid rgba(217,119,6,.25);border-radius:var(--rmd);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tamber)}
/* Load Analyzer */
.la-grid{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}
.la-section{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--b1)}
.la-section:first-child{margin-top:0;border-top:none;padding-top:0}
.fg{margin-bottom:10px}
.fl{font-size:11px;color:var(--t2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;padding:8px 11px;background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);font-size:13px;color:var(--t1);outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus{border-color:var(--blue)}
.fi::placeholder{color:var(--t4)}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fi-pre{position:relative}
.fi-pre .fi{padding-left:22px}
.fi-sym{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;pointer-events:none}
.state-row{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:center}
.arr-mid{text-align:center;color:var(--t3);font-size:13px;margin-top:16px}
.btn-analyze{width:100%;padding:11px;background:var(--blue);color:white;border:none;border-radius:var(--rmd);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px}
.btn-analyze:hover{opacity:.88}
.la-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;color:var(--t3);text-align:center;padding:40px}
.v-banner{border-radius:var(--rlg);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.v-label{font-size:21px;font-weight:700;letter-spacing:-.3px}
.v-sub{font-size:12px;margin-top:2px;opacity:.8}
.g-ring{width:54px;height:54px;flex-shrink:0;position:relative}
.g-ring svg{transform:rotate(-90deg)}
.g-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{background:var(--bg4);border-radius:var(--rmd);padding:12px}
.mc-l{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mc-v{font-size:18px;font-weight:600;letter-spacing:-.3px}
.mc-s{font-size:11px;color:var(--t3);margin-top:2px}
.mkt-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1)}
.mkt-row:last-child{border-bottom:none}
.mkt-lbl{font-size:12px;color:var(--t2);min-width:140px}
.mkt-bar{flex:1;position:relative;height:6px}
.mkt-bg{height:6px;background:var(--b2);border-radius:3px}
.mkt-fill{height:6px;border-radius:3px;position:absolute;top:0;left:0;transition:width .6s}
.mkt-val{font-size:12px;font-weight:600;min-width:60px;text-align:right}
.pay-track{position:relative;height:8px;background:var(--b2);border-radius:4px;margin:8px 0}
.pay-range{position:absolute;height:8px;border-radius:4px;background:var(--bblue)}
.pay-m{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;transform:translateX(-50%)}
.pay-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}
.flag{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:var(--rmd);margin-bottom:6px;border:1px solid transparent}
.flag:last-child{margin-bottom:0}
.flag i{font-size:14px;flex-shrink:0;margin-top:1px}
.flag-txt{font-size:12px;line-height:1.4}
.flag-danger{background:var(--bred);border-color:rgba(248,113,113,.2);color:var(--tred)}
.flag-warn{background:var(--bamber);border-color:rgba(251,191,36,.2);color:var(--tamber)}
.flag-good{background:var(--bgreen);border-color:rgba(52,211,153,.2);color:var(--tgreen)}
.q-box{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:14px;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:11px;color:var(--t2);line-height:1.9;white-space:pre-wrap;word-break:break-word}
.hi-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg4);border-radius:var(--rmd);margin-bottom:5px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.hi-row:hover{background:var(--bg5);border-color:var(--b2)}
.hi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fade-in{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.sel-cb{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;transition:all .15s;background:transparent}
.sel-cb.checked{background:var(--blue);border-color:var(--blue);color:white}
.tr.selected{background:rgba(37,99,235,0.10)!important;border-left:2px solid var(--blue)}
.sel-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.25);border-radius:var(--rmd);margin-bottom:10px;font-size:12px;color:var(--tblue)}
.sel-bar button{padding:4px 12px;background:var(--bred);color:var(--tred);border:1px solid rgba(248,113,113,.25);border-radius:var(--rmd);font-size:11px;font-weight:600;cursor:pointer}
.sel-bar button:hover{background:rgba(220,38,38,.25)}
.set-field{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1);align-items:center;gap:10px}
.set-field:last-child{border-bottom:none}
.set-label{font-size:12px;color:var(--t2);flex-shrink:0;min-width:110px}
.set-value{font-size:12px;font-weight:600;color:var(--t1);flex:1;text-align:right}
.set-input{font-size:12px;color:var(--t1);background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:5px 9px;outline:none;flex:1;text-align:right}
.set-input:focus{border-color:var(--blue)}
.set-edit-btn{font-size:11px;color:var(--tblue);background:var(--bblue);border:1px solid rgba(96,165,250,.2);border-radius:var(--rmd);padding:3px 10px;cursor:pointer;font-weight:600;white-space:nowrap}
.set-save-btn{font-size:11px;color:var(--tgreen);background:var(--bgreen);border:1px solid rgba(52,211,153,.2);border-radius:var(--rmd);padding:3px 10px;cursor:pointer;font-weight:600;white-space:nowrap}
/* ── CHECKLIST ── */
.cl-section{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);margin-bottom:10px;overflow:hidden}
.cl-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.cl-header:hover{background:var(--bg4)}
.cl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cl-title{font-size:13px;font-weight:600;color:var(--t1);flex:1}
.cl-progress{font-size:11px;color:var(--t3)}
.cl-chevron{font-size:14px;color:var(--t3);transition:transform .2s}
.cl-chevron.open{transform:rotate(90deg)}
.cl-items{padding:0 16px 12px}
.cl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1)}
.cl-item:last-child{border-bottom:none}
.cl-cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;margin-top:1px}
.cl-cb.done{background:var(--bgreen);border-color:var(--tgreen);color:var(--tgreen)}
.cl-cb.req{border-color:rgba(251,191,36,.5)}
.cl-info{flex:1}
.cl-item-title{font-size:12px;font-weight:600;color:var(--t1)}
.cl-item-detail{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.5}
.cl-cost{font-size:11px;color:var(--tgreen);font-weight:600;flex-shrink:0;margin-top:1px}
.cl-req-badge{font-size:10.5px;background:rgba(251,191,36,.15);color:var(--tamber);padding:1px 6px;border-radius:99px;font-weight:600;margin-left:6px}
/* ── OUTREACH ── */
.ou-mode-btn{padding:7px 14px;border-radius:var(--rmd);border:1px solid var(--b2);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s}
.ou-mode-btn:hover{background:var(--bg3);color:var(--t1)}
.ou-mode-btn.active{background:var(--bblue);border-color:var(--tblue);color:var(--tblue);font-weight:600}
.ou-script{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:16px;font-size:12px;color:var(--t1);line-height:1.8;white-space:pre-wrap;font-family:'Syne',sans-serif;min-height:200px}
/* ── QUOTING ── */
.qt-quote-display{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:16px;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:11px;color:var(--t1);line-height:1.9;white-space:pre-wrap}
.qt-hist-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg4);border-radius:var(--rmd);margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.qt-hist-row:hover{background:var(--bg5);border-color:var(--b2)}
@media screen and (max-width:900px){.la-grid{grid-template-columns:1fr}.m-grid{grid-template-columns:repeat(2,1fr)}}
/* ── MONEY & RISK MODULES ── */
.gate-banner{border-radius:var(--rlg);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.gate-l{font-size:19px;font-weight:700;letter-spacing:-.3px}
.gate-s{font-size:12px;opacity:.85;margin-top:2px}
.meter{height:12px;background:var(--b2);border-radius:6px;overflow:hidden;position:relative}
.meter-fill{height:100%;border-radius:6px;transition:width .5s}
.meter-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:4px}
.eco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.eco{background:var(--bg4);border-radius:var(--rmd);padding:11px 13px}
.eco-l{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.eco-v{font-size:18px;font-weight:700;letter-spacing:-.3px}
.eco-s{font-size:11px;color:var(--t3);margin-top:2px}
.vet-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--b1);align-items:flex-start}
.vet-item:last-child{border-bottom:none}
.vet-cb{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;margin-top:1px}
.vet-cb.on{background:var(--bgreen);border-color:var(--tgreen);color:var(--tgreen)}
.vet-cb.flag{border-color:rgba(248,113,113,.4)}
.vet-cb.flag.on{background:var(--bred);border-color:var(--tred);color:var(--tred)}
.vet-info{flex:1}
.vet-t{font-size:12px;font-weight:600;color:var(--t1)}
.vet-d{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.45}

.tt-q{font-size:11px;font-weight:700;color:var(--tblue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tt-a{font-size:12px;color:var(--t1);line-height:1.55}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ===== NEO-CORPORATE THEME · matte-black · electric-blue + cyan + amber ===== */
body{font-family:'Syne',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  background:var(--topo) center center / cover fixed no-repeat;
  background-color:#06080f;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 85% at 86% -10%,rgba(59,114,255,.20),transparent 55%),
    linear-gradient(180deg,rgba(6,8,16,.56) 0%,rgba(6,8,16,.70) 60%,rgba(5,7,13,.80) 100%);}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(135% 100% at 50% 38%,transparent 52%,rgba(3,5,10,.66) 100%)}
.app{position:relative;z-index:1;background:transparent}
.logo-name,.topbar-title,.card-title,.kpi-v,.v-label,.mc-v,.eco-v,.pv,.hero-title,.hero-stat .hv{font-family:'Syne',sans-serif}
.kpi-v,.mc-v,.eco-v,.v-label,.hero-title,.hero-stat .hv{letter-spacing:-.4px}
/* mono uppercase microlabels */
.nav-section,.kpi-l,.hl,.hero-eyebrow,.logo-sub,.gate-l{font-family:'Syne',sans-serif;text-transform:uppercase}
.kpi-l,.hl,.logo-sub{letter-spacing:.13em}
/* shell */
.sidebar{background:var(--shell);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);border-right:1px solid var(--b1);box-shadow:1px 0 0 rgba(124,156,214,.05)}
.logo-icon{background:linear-gradient(135deg,#3b72ff,#22d3ee);box-shadow:0 4px 18px rgba(59,114,255,.45),0 0 0 1px rgba(124,156,214,.12)}
.topbar{height:60px;background:var(--shell);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);border-bottom:1px solid var(--b1)}
.nb{border-radius:10px}
.nb:hover{background:var(--bblue);color:var(--t1)}
.nb.active{background:var(--bblue);color:var(--tblue);font-weight:700;box-shadow:inset 0 0 0 1px rgba(59,114,255,.35),0 0 18px rgba(59,114,255,.12)}
.nb.active i{opacity:1;color:var(--tblue)}
.avatar{background:var(--bblue);color:var(--tblue)}
.search{background:rgba(124,156,214,.06);border:1px solid var(--b2)}
/* surfaces — DEFAULT = crisp (data legibility) */
.card{background:var(--panel-solid);backdrop-filter:blur(var(--blur-solid)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur-solid)) saturate(1.2);border:1px solid var(--b1);box-shadow:var(--sh);border-radius:var(--rlg)}
.kpi{background:var(--panel-glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);border:1px solid var(--b1);box-shadow:var(--sh);border-radius:var(--rlg);transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 1px rgba(59,114,255,.18)}
/* AIRY pages get full translucent glass */
body[data-page="dashboard"] .card,body[data-page="negotiation"] .card{background:var(--panel-glass);backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3)}
/* buttons */
.btn,.btn-analyze{background:linear-gradient(135deg,#3b72ff,#1e50d8);color:#fff;font-weight:700;border:none;box-shadow:0 2px 14px rgba(59,114,255,.42)}
.btn:hover,.btn-analyze:hover{opacity:1;filter:brightness(1.08)}
.btn-ghost{background:rgba(124,156,214,.06);border:1px solid var(--b2);color:var(--t1)}
.btn-sm{background:rgba(124,156,214,.05);border:1px solid var(--b2);color:var(--t2)}
.btn-sm:hover{background:rgba(124,156,214,.10);color:var(--t1);border-color:var(--b3)}
.btn-copy{background:var(--bcyan);color:var(--tcyan);border:1px solid rgba(34,211,238,.3);font-weight:700}
/* inputs */
.fi,.set-input{background:rgba(124,156,214,.06);border:1px solid var(--b2);color:var(--t1)}
.fi:focus,.set-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--bcyan);background:rgba(124,156,214,.09)}
.fi::placeholder,.set-input::placeholder{color:var(--t4)}
select.fi option{background:#0d1321;color:var(--t1)}
/* tables / tabs / inset surfaces */
.content{padding:24px}
.th{background:rgba(124,156,214,.05);color:var(--t3)}
.tr:hover{background:rgba(124,156,214,.05)}
.tabs{background:rgba(124,156,214,.05);border:1px solid var(--b1)}
.tab-btn{color:var(--t3)}
.tab-btn.active{background:rgba(124,156,214,.10);color:var(--t1);box-shadow:none}
.cl-section{background:var(--panel-solid);backdrop-filter:blur(var(--blur-solid));-webkit-backdrop-filter:blur(var(--blur-solid));box-shadow:var(--sh);border:1px solid var(--b1)}
.cl-header:hover{background:rgba(124,156,214,.04)}
.kcol{background:var(--panel-solid);backdrop-filter:blur(var(--blur-solid));-webkit-backdrop-filter:blur(var(--blur-solid));border:1px solid var(--b1)}
.dc{background:rgba(124,156,214,.05)}
.dc:hover{background:rgba(124,156,214,.09)}
.q-box,.qt-quote-display,.ou-script{background:rgba(0,0,0,.34);color:var(--t1);border:1px solid var(--b2)}
::-webkit-scrollbar-thumb{background:var(--b2)}::-webkit-scrollbar-thumb:hover{background:var(--b3)}
/* ── HERO (glass intelligence panel) ── */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:20px;min-height:176px;display:flex;align-items:center;
  background:var(--panel-glass);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid var(--b2);box-shadow:var(--sh)}
.hero-img{display:none}
.hero-wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,21,.62) 0%,rgba(8,11,21,.32) 55%,transparent 100%)}
.hero-glow{position:absolute;right:-40px;top:-50px;width:320px;height:320px;background:radial-gradient(circle,rgba(59,114,255,.32),rgba(34,211,238,.10) 45%,transparent 72%);pointer-events:none}
.hero-inner{position:relative;z-index:3;padding:26px 32px}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--tcyan);display:flex;align-items:center;gap:7px}
.hero-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.hero-title{font-size:28px;font-weight:700;color:#fff;margin-top:8px;line-height:1.08}
.hero-sub{font-size:13px;color:var(--t2);margin-top:7px;max-width:540px;line-height:1.5}
.hero-stats{display:flex;gap:24px;margin-top:15px}
.hero-stat .hv{font-size:18px;font-weight:700;color:#fff}
.hero-stat .hl{font-size:11px;color:var(--t3);letter-spacing:.08em;margin-top:1px}
@media screen and (max-width:720px){.hero-stats{display:none}.hero-title{font-size:22px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--panel-glass:rgba(15,21,36,0.94);--panel-solid:rgba(11,16,28,0.96);--shell:rgba(8,12,22,0.96)}
  body::before{background:linear-gradient(180deg,rgba(6,8,15,.78),rgba(5,7,13,.86))}
}

/* brand mark */

/* ── CONTROL TOWER ── */
.sec-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
.mode-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.wf-steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.wf-step{flex:1;min-width:76px;text-align:center;padding:7px 4px;border-radius:var(--rmd);font-size:11px;font-weight:600;background:var(--bg4);color:var(--t3);border:1px solid var(--b1)}
.wf-step.done{background:var(--bgreen);color:var(--tgreen);border-color:rgba(52,211,153,.25)}
.wf-step.now{background:var(--bblue);color:var(--tblue);border-color:rgba(96,165,250,.3)}
.pod-btn{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:var(--rlg);border:1px solid var(--b2);background:var(--bg3);color:var(--t1);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;text-align:left;transition:all .12s}
.pod-btn:hover{background:var(--bg5)}
.pod-btn.done{background:var(--bgreen);border-color:rgba(52,211,153,.3);color:var(--tgreen)}
.pod-btn.locked{opacity:.4;cursor:not-allowed}
.pod-btn i{font-size:19px;flex-shrink:0}
.pod-btn .pod-sub{font-size:11px;font-weight:400;color:var(--t3);margin-top:2px}
.arch-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--b1);font-size:12px;color:var(--t2)}
.arch-item:last-child{border-bottom:none}
.fchk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);padding:5px 0;cursor:pointer;user-select:none}
.fchk input{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.sim-bar{background:var(--bcyan);border:1px solid rgba(34,211,238,.25);border-radius:var(--rmd);padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tcyan)}
/* ===== UX PASS · type scale, spacing, focus, guidance layer ===== */
body{font-size:14px;line-height:1.55}
.content{padding:28px 32px 48px}
.card{padding:20px;border-radius:16px}
.card-title{font-size:15px;margin-bottom:4px}
.card-sub{font-size:12.5px;margin-bottom:14px}
.kpi{padding:16px 18px}
.kpi-l{margin-bottom:9px}
.kpi-c{font-size:12px}
.kpi-grid{gap:14px;margin-bottom:20px}
.g2{gap:16px;margin-bottom:16px}
.badge,.sec-badge,.mode-pill{font-size:11px}
.th{font-size:11px;padding:9px 16px}
.tr{padding:13px 16px}
.cn{font-size:13px}
.cs2{font-size:11.5px;margin-top:3px}
.btn{padding:9px 18px;font-size:13px}
.btn-ghost{padding:9px 16px;font-size:13px}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-copy{padding:8px 16px;font-size:12px}
.tab-btn{padding:7px 16px;font-size:12.5px}
.tabs{margin-bottom:16px}
.fl{font-size:11px;margin-bottom:5px}
.fg{margin-bottom:12px}
.fi{padding:10px 12px;font-size:14px}
.topbar-title{font-size:16px}
.topbar-sub{font-size:12px;margin-top:2px}
.sidebar{width:236px}
.nb{padding:10px 12px;font-size:13px;margin-bottom:1px}
.wf-step{font-size:11px;padding:9px 4px}
.alert-bar{padding:12px 16px;font-size:13px}
.sim-bar{padding:11px 16px;font-size:12.5px}
.la-section{font-size:11px;margin:18px 0 10px;padding-top:14px}
.lhead{padding:22px}
.mc-v{font-size:19px}
.eco-v{font-size:19px}
/* accessible focus */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.fi:focus-visible,.set-input:focus-visible{outline:none}
/* skip link */
.skip-link{position:absolute;left:-9999px;top:0;z-index:100001;background:var(--blue);color:#fff;padding:10px 18px;border-radius:0 0 10px 0;font-size:13px;font-weight:600}
.skip-link:focus{left:0}
/* grouped navigation */
.nav{padding:10px}
.nav-group{margin-bottom:2px}
.nav-group-head{width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:12px;font-weight:700;text-align:left;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:.09em}
.nav-group-head:hover{background:var(--bg3);color:var(--t1)}
.nav-group-head i:first-child{font-size:15px;opacity:.8}
.nav-chev{margin-left:auto;font-size:13px;transition:transform .18s;opacity:.6}
.nav-chev.open{transform:rotate(90deg)}
.nav-group.has-active .nav-group-head{color:var(--tblue)}
.nav-sub{padding:2px 0 6px 10px}
.nav-sub .nb{font-size:12.5px;padding:8px 11px}
.nav-active-dot{width:6px;height:6px;border-radius:50%;background:var(--tblue);flex-shrink:0}
.nav-toggle{display:none;background:var(--bg3);border:1px solid var(--b2);color:var(--t1);border-radius:10px;padding:9px 11px;font-size:18px;cursor:pointer;line-height:1}
#nav-ovl{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:8999}
/* page help bar */
.page-help{margin:0 32px;margin-top:20px;background:var(--panel-glass);backdrop-filter:blur(var(--blur-solid));-webkit-backdrop-filter:blur(var(--blur-solid));border:1px solid var(--b1);border-left:3px solid var(--cyan);border-radius:var(--rlg);padding:13px 18px;display:flex;gap:12px;align-items:flex-start}
.page-help i{color:var(--tcyan);font-size:17px;flex-shrink:0;margin-top:1px}
.page-help-what{font-size:13px;color:var(--t1);line-height:1.5}
.page-help-next{font-size:12.5px;color:var(--t2);margin-top:3px}
.page-help-next strong{color:var(--tcyan);font-weight:600}
.page-help-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
/* next best action card */
.nba-card{background:linear-gradient(135deg,rgba(59,114,255,.14),rgba(34,211,238,.07));border:1px solid rgba(59,114,255,.35);border-radius:var(--rlg);padding:16px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nba-card>i{font-size:26px;color:var(--tblue);flex-shrink:0}
.nba-l{font-size:11px;font-weight:700;color:var(--tcyan);text-transform:uppercase;letter-spacing:.12em;font-family:'Syne',sans-serif}
.nba-t{font-size:16px;font-weight:700;color:var(--t1);margin-top:2px}
.nba-why{font-size:12.5px;color:var(--t2);margin-top:2px}
.nba-btn{margin-left:auto}
/* today's actions rows */
.act-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--b1)}
.act-row:last-child{border-bottom:none}
.act-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.act-t{font-size:13px;font-weight:600;color:var(--t1)}
.act-s{font-size:11.5px;color:var(--t3);margin-top:1px}
.empty-state{padding:36px 24px;text-align:center;color:var(--t3);font-size:13px;line-height:1.6}
.empty-state i{font-size:26px;color:var(--t4);display:block;margin-bottom:8px}
/* tutorial / info modal */
.tut-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--b1);align-items:flex-start}
.tut-step:last-child{border-bottom:none}
.tut-num{width:24px;height:24px;border-radius:50%;background:var(--bblue);color:var(--tblue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.tut-t{font-size:13.5px;font-weight:600;color:var(--t1)}
.tut-d{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.55}
/* save chip */
#save-chip{font-size:11px;color:var(--t3);border:1px solid var(--b1);border-radius:99px;padding:5px 12px;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif;letter-spacing:.03em}
#save-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--t4)}
#save-chip.cloud .dot{background:var(--green)}
#save-chip.local .dot{background:var(--amber)}
/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== MOBILE · drawer nav + card-collapsed tables ===== */
@media screen and (max-width:760px){
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);height:100vh;height:100dvh;transform:translateX(-105%);transition:transform .22s ease;z-index:9000;background:rgba(8,12,22,.98);border-right:1px solid var(--b2)}
  .sidebar.open{transform:translateX(0)}
  .nav{min-height:0}
  .sidebar .logo{padding-top:calc(16px + env(safe-area-inset-top))}
  .nav-footer{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  body.nav-open{overflow:hidden}
  .nav-footer button{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .nav-toggle{display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center}
  .main{overflow:visible}
  .content{padding:16px 14px 60px;overflow-y:visible}
  .page-help{margin:14px 14px 0}
  .g2,.la-grid{grid-template-columns:1fr}
  .topbar{height:auto;min-height:58px;padding:10px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:800}
  .search,#save-chip{display:none}
  .th{display:none}
  .tr{grid-template-columns:1fr!important;gap:6px;padding:15px 16px}
  .tr>*{text-align:left!important}
  .btn,.btn-ghost,.btn-analyze{padding:12px 18px;font-size:14px}
  .btn-sm{padding:10px 14px;font-size:13px}
  .nb,.nav-group-head{padding:12px 14px}
  .hero-inner{padding:20px 18px}
  .m-grid,.eco-grid{grid-template-columns:1fr 1fr}
  .pgrid{grid-template-columns:1fr}
  .nba-card{padding:14px 16px}
  .nba-btn{margin-left:0;width:100%}
  .nba-btn .btn{width:100%}
  .fi,select.fi{font-size:16px}
  #ff-email,#ff-pass{font-size:16px!important}
}
/* ===== FUTURA GLOW PASS · 2026-07-08 · Syne type · topographic backdrop · sharp glowing edges ===== */
:root{--rmd:7px;--rlg:11px;--edge:rgba(134,166,255,.30);--edge-soft:rgba(124,156,214,.17)}
button,input,select,textarea{font-family:inherit}
/* backdrop tuning: let the contour lines read through */
body::before{background:
  radial-gradient(120% 85% at 86% -10%,rgba(59,114,255,.18),transparent 55%),
  radial-gradient(95% 75% at 6% 110%,rgba(34,211,155,.12),transparent 60%),
  linear-gradient(180deg,rgba(4,7,16,.44) 0%,rgba(4,7,16,.58) 60%,rgba(3,5,12,.72) 100%)}
body::after{background:radial-gradient(135% 100% at 50% 38%,transparent 55%,rgba(2,4,9,.62) 100%)}
/* sharper radii */
.card,.kpi,.cl-section,.kcol,.lhead,.v-banner,.nba-card,.page-help{border-radius:10px}
.hero{border-radius:12px}
.nb,.nav-group-head,.nav-toggle,.search{border-radius:7px}
.tabs{border-radius:8px}
.tab-btn{border-radius:5px}
.wf-step,.pi,.dc,.mc,.eco{border-radius:7px}
/* edge-lit surfaces */
.card,.cl-section,.kcol,.lhead{border:1px solid var(--edge-soft);box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 22px rgba(59,114,255,.05),inset 0 1px 0 rgba(160,190,255,.08)}
.kpi{border:1px solid var(--edge-soft);box-shadow:0 8px 26px rgba(0,0,0,.45),0 0 18px rgba(34,211,238,.05),inset 0 1px 0 rgba(160,190,255,.08)}
.kpi:hover{transform:translateY(-2px);border-color:var(--edge);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 26px rgba(34,211,238,.16),inset 0 1px 0 rgba(180,205,255,.12)}
.hero{border:1px solid var(--edge);box-shadow:0 12px 44px rgba(0,0,0,.5),0 0 34px rgba(59,114,255,.14),inset 0 1px 0 rgba(160,190,255,.10)}
/* glowing controls */
.btn,.btn-analyze{border-radius:7px;box-shadow:0 0 0 1px rgba(140,175,255,.38),0 2px 16px rgba(59,114,255,.5),0 0 30px rgba(59,114,255,.16);transition:box-shadow .18s,filter .18s}
.btn:hover,.btn-analyze:hover{filter:brightness(1.1);box-shadow:0 0 0 1px rgba(170,198,255,.6),0 2px 20px rgba(59,114,255,.62),0 0 42px rgba(59,114,255,.3)}
.btn-ghost{border-radius:7px;border:1px solid var(--edge-soft);transition:border-color .15s,box-shadow .15s}
.btn-ghost:hover{border-color:var(--edge);box-shadow:0 0 14px rgba(59,114,255,.18),inset 0 0 10px rgba(59,114,255,.06)}
.btn-sm{border-radius:6px;transition:all .15s}
.btn-sm:hover{border-color:var(--edge);box-shadow:0 0 12px rgba(59,114,255,.16)}
.btn-copy{border-radius:6px;box-shadow:0 0 14px rgba(34,211,238,.14)}
.btn-copy:hover{box-shadow:0 0 20px rgba(34,211,238,.3)}
/* nav + tabs */
.nb.active{box-shadow:inset 0 0 0 1px rgba(96,140,255,.45),0 0 20px rgba(59,114,255,.18)}
.tab-btn.active{box-shadow:inset 0 0 0 1px rgba(96,140,255,.4),0 0 14px rgba(59,114,255,.14)}
/* inputs */
.fi:focus,.set-input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.16)}
/* shell edge light */
.sidebar{border-right:1px solid var(--edge-soft);box-shadow:1px 0 0 rgba(134,166,255,.06),6px 0 30px rgba(59,114,255,.05)}
.topbar{border-bottom:1px solid var(--edge-soft);box-shadow:0 1px 0 rgba(134,166,255,.05),0 6px 26px rgba(4,8,18,.35)}
.logo-icon{box-shadow:0 0 0 1px rgba(134,166,255,.3),0 4px 18px rgba(59,114,255,.45),0 0 26px rgba(34,211,238,.14)}
/* guidance cards */
.nba-card{border:1px solid rgba(96,140,255,.45);box-shadow:0 0 26px rgba(59,114,255,.14),inset 0 1px 0 rgba(170,198,255,.1)}
.wf-step.now{box-shadow:inset 0 0 0 1px rgba(96,140,255,.4),0 0 14px rgba(59,114,255,.16)}
.wf-step.done{box-shadow:inset 0 0 0 1px rgba(52,211,153,.3),0 0 12px rgba(34,211,155,.12)}
/* modals */
#ff-modal-ov>div[role="dialog"]{border-radius:12px!important;border:1px solid var(--edge)!important;box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 40px rgba(59,114,255,.14),inset 0 1px 0 rgba(170,198,255,.1)!important}
/* login screen matches the app */
#ff-auth{background:linear-gradient(180deg,rgba(3,7,15,.72),rgba(3,7,15,.86)),var(--topo) center center / cover no-repeat #040a18!important}
#ff-auth>div{border-radius:12px!important;border:1px solid rgba(134,166,255,.24)!important;box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 40px rgba(59,114,255,.14),inset 0 1px 0 rgba(170,198,255,.1)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#ff-auth input,#ff-auth button{border-radius:7px!important}
#ff-auth #ff-login-btn{box-shadow:0 0 0 1px rgba(140,175,255,.38),0 2px 16px rgba(59,114,255,.5),0 0 26px rgba(59,114,255,.18)!important}

<script>
/* ===== FUTUROFREIGHT SUPABASE CONFIG ===== */
const FF_SUPABASE_URL = 'https://plsimvwufpqquuipkysi.supabase.co';
const FF_SUPABASE_KEY = 'sb_publishable_nXrPTG_v935fahzd7q_ZWQ_0A7t8s3J';
const ffSupa = window.supabase.createClient(FF_SUPABASE_URL, FF_SUPABASE_KEY);
window.ffSupa = ffSupa;

let FF_USER = null;
function ffAuthErr(m){const e=document.getElementById('ff-auth-err');e.style.display='block';e.textContent=m;}
function ffAuthMsg(m){const e=document.getElementById('ff-auth-msg');e.style.display='block';e.textContent=m;}
function ffClearMsgs(){document.getElementById('ff-auth-err').style.display='none';document.getElementById('ff-auth-msg').style.display='none';}

/* ---------- bootstrap handshake ----------
   This auth block and the application initializer (defined in the script block
   below) become ready in an order that is NOT guaranteed. If getSession() ever
   resolves synchronously — or within the first microtask — this block runs to
   completion before the next <script> has parsed, so window.__ffInit does not
   exist yet and initialization is silently skipped: signed in, but never loaded.
   It only works today because the real supabase-js getSession() happens to take
   a macrotask. That is a timing accident, not a guarantee.

   Both sides now report readiness to one coordinator, which starts initialization
   exactly once, when both are present, in either order, with no timing assumption. */
window.__ffBoot = { authResolved:false, user:null, init:null, started:false, epoch:0 };

function __ffBootTry(){
  const B = window.__ffBoot;
  if (B.started) return;                    // exactly once per authenticated bootstrap
  if (!B.authResolved || !B.init) return;   // the other side isn't ready yet
  if (!B.user) return;                      // resolved, but no session: login stays up
  B.started = true;
  const bootEpoch = B.epoch;
  FF_USER = B.user; window.FF_USER = B.user;
  const ov = document.getElementById('ff-auth');
  if (ov) ov.style.display = 'none';
  try {
    const p = B.init(bootEpoch);
    if (p && typeof p.catch === 'function') p.catch(e => console.warn('Futuro OS init failed:', e && e.message));
  } catch(e) { console.warn('Futuro OS init failed:', e && e.message); }
}

// Auth side. user === null means "auth resolved, but there is no session".
window.__ffAuthResolved = function(user){
  const B = window.__ffBoot;
  B.authResolved = true;
  B.user = user || null;
  __ffBootTry();
};
// App side. Called once the application script has defined its initializer.
window.__ffRegisterInit = function(fn){
  window.__ffBoot.init = fn;
  __ffBootTry();
};
// Sign-out side. Invalidates any pending or in-flight bootstrap: the epoch bump
// makes a late initializer from the previous session abandon its own result.
window.__ffBootInvalidate = function(){
  const B = window.__ffBoot;
  B.epoch++; B.started = false; B.authResolved = false; B.user = null;
};

document.getElementById('ff-login-btn').addEventListener('click', async ()=>{
  ffClearMsgs();
  const email=document.getElementById('ff-email').value.trim();
  const pass=document.getElementById('ff-pass').value;
  if(!email||!pass){ffAuthErr('Enter email and password.');return;}
  const {data,error}=await ffSupa.auth.signInWithPassword({email,password:pass});
  if(error){ffAuthErr(error.message);return;}
  window.__ffAuthResolved(data.user);
});

document.getElementById('ff-signup-btn').addEventListener('click', async ()=>{
  ffClearMsgs();
  const email=document.getElementById('ff-email').value.trim();
  const pass=document.getElementById('ff-pass').value;
  if(!email||!pass){ffAuthErr('Enter an email and a password (min 6 chars) to create your account.');return;}
  const {data,error}=await ffSupa.auth.signUp({email,password:pass});
  if(error){ffAuthErr(error.message);return;}
  if(data.session){ window.__ffAuthResolved(data.user); }
  else { ffAuthMsg('Account created. If email confirmation is on, check your inbox, then Sign In.'); }
});

// allow Enter key to submit
['ff-email','ff-pass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ff-login-btn').click();}));

// On load: report the session result to the coordinator. Correctness does not
// depend on WHEN this resolves — synchronously, in a microtask, or after a
// network round-trip all behave identically.
(async ()=>{
  try {
    const {data}=await ffSupa.auth.getSession();
    window.__ffAuthResolved(data && data.session ? data.session.user : null);
  } catch(e) {
    window.__ffAuthResolved(null);   // no session → login overlay stays usable
  }
})();

// Ordinary sign-out PRESERVES this account's offline cache so unsynced work can be
// recovered on the next sign-in. Teardown runs first: it bumps the auth epoch and
// cancels the pending debounced save, so nothing can write during signOut().
window.ffLogout = async function(){
  if (typeof window.__ffTeardown === 'function') window.__ffTeardown({ removeScoped:false });
  try { await ffSupa.auth.signOut(); } catch(e) { console.warn('Sign-out error:', e.message); }
  location.reload();
};

// Explicit, separate action: sign out AND drop this account's offline cache.
// Removes only the signed-in user's scoped key — never another account's key,
// never the legacy unscoped key, never a recovery key, never mobile's fos.* keys.
window.ffLogoutForget = async function(){
  const dirty = typeof window.__ffHasDirty === 'function' && window.__ffHasDirty();
  const warn = dirty
    ? 'Sign out and remove this account\'s offline data from this browser?\n\nYou have changes that have NOT been synced to the cloud. Those changes will be lost permanently.\n\nYour cloud data and any exported backups are not affected.'
    : 'Sign out and remove this account\'s offline data from this browser?\n\nAny local changes not yet synced to the cloud will be lost.\n\nYour cloud data and any exported backups are not affected.';
  if (!confirm(warn)) return;
  if (typeof window.__ffTeardown === 'function') window.__ffTeardown({ removeScoped:true });
  try { await ffSupa.auth.signOut(); } catch(e) { console.warn('Sign-out error:', e.message); }
  location.reload();
};

// ============================================================
// PERSISTENCE ENGINE — Supabase cloud snapshot (Stage 3, Approach A)
// Saves full CRM state as one JSON row per user in the "snapshot"
// table. Keeps a localStorage mirror as an offline safety net.
// ============================================================
// Local cache is keyed per authenticated user: `futurofreight_v1:<uid>`. The bare
// `futurofreight_v1` key is the pre-P0-A unscoped cache — it is preserved, never
// read as a normal source, and only ever imported on explicit owner confirmation.
const LS_PREFIX = 'futurofreight_v1';
const LS_LEGACY = 'futurofreight_v1';
const LS_RECOVERY_MAX = 3;   // preserved copies of an unreadable scoped cache, per user
let _lastSavedAt = null;
let _saveTimer = null;
let _saveInFlight = false;
let _savePending = false;

// --- account isolation + cloud-write gating ---
let _authEpoch = 0;          // bumped on sign-out; invalidates in-flight async work
let _cloudWritable = false;  // no cloud write until a load outcome authorizes one
let _initSaveDone = false;   // the first cloud row may only ever be created once
let _dirty = false;          // local changes not yet confirmed in the cloud
let _crmLocked = false;      // cloud unverifiable and no local data → read-only CRM

const LOAD_STATE = {
  LOADED: 'CLOUD_ROW_LOADED',
  ABSENT: 'CLOUD_ROW_ABSENT',
  ERROR:  'CLOUD_LOAD_ERROR'
};

// Resolved at call time, never cached: a stale closure must not be able to write
// one account's state under another account's key. Null means refuse all I/O.
function _lsKey(uid) {
  const id = uid || (window.FF_USER && window.FF_USER.id);
  return id ? LS_PREFIX + ':' + id : null;
}

// Capture identity + epoch before an await; re-check with _authOk before acting on
// the result. Note the snapshot itself carries no owner field — ownership lives on
// the database row — so identity must be tracked here, not read back out of state.
function _authCap() {
  return { uid: (window.FF_USER && window.FF_USER.id) || null, epoch: _authEpoch };
}
function _authOk(cap) {
  const uid = window.FF_USER && window.FF_USER.id;
  return !!(cap && cap.uid && uid && cap.epoch === _authEpoch && cap.uid === uid);
}

// savedAt is integer milliseconds since the epoch, as written by _collectState().
// One day of future skew is tolerated; anything beyond that is a broken clock.
function _validSavedAt(n) {
  return typeof n === 'number' && Number.isFinite(n) && n > 0 && n <= Date.now() + 86400000;
}

// Minimum structural contract. _applyState() dereferences S, T and CA unguarded,
// so a snapshot missing any of them would throw — validating all three is the
// least we can assume, and every snapshot this app has ever written has them.
function _validSnapshot(d) {
  return !!d && typeof d === 'object' &&
         Array.isArray(d.S) && Array.isArray(d.T) && Array.isArray(d.CA);
}

// An unreadable scoped cache is preserved byte-for-byte, never repaired, never
// shown, never uploaded. At the cap we stop creating copies rather than prune.
function _preserveCorruptLocal(uid, raw) {
  try {
    if (typeof raw !== 'string' || !raw) return 'skipped';
    const pfx = LS_PREFIX + ':recovery:' + uid + ':';
    let n = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(pfx) === 0) n++;
    }
    if (n >= LS_RECOVERY_MAX) return 'at-cap';
    const key = pfx + Date.now();
    if (localStorage.getItem(key) !== null) return 'collision';  // never overwrite
    localStorage.setItem(key, raw);
    return 'preserved';
  } catch (e) {
    return 'failed';   // out of quota: abandon preservation rather than destroy it
  }
}

// {state:'OK'|'ABSENT'|'CORRUPT'}. CORRUPT never deletes or rewrites the raw value.
function _readScopedLocal(uid) {
  const key = _lsKey(uid);
  if (!key) return { state: 'ABSENT' };
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) { return { state: 'ABSENT' }; }
  if (raw === null) return { state: 'ABSENT' };
  let data = null;
  try { data = JSON.parse(raw); }
  catch (e) { return { state: 'CORRUPT', preserve: _preserveCorruptLocal(uid, raw) }; }
  if (!_validSnapshot(data)) return { state: 'CORRUPT', preserve: _preserveCorruptLocal(uid, raw) };
  return { state: 'OK', data };
}

function _writeScopedLocal(data, uid) {
  const key = _lsKey(uid);
  if (!key) return false;
  try { localStorage.setItem(key, JSON.stringify(data)); return true; }
  catch (e) { return false; }
}

// Presence only — never reads the legacy VALUE, so deciding whether to offer
// recovery can never involve inspecting or parsing the legacy data.
function _legacyKeyPresent() {
  try {
    for (let i = 0; i < localStorage.length; i++) if (localStorage.key(i) === LS_LEGACY) return true;
    return false;
  } catch (e) { return false; }
}

// Does the current user's scoped cache hold actual records? Side-effect free —
// deliberately NOT _readScopedLocal(), which would create a recovery copy every
// time this is called from a render path.
function _scopedSnapshotHasContent(uid) {
  const key = _lsKey(uid);
  if (!key) return false;
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) { return false; }
  if (raw === null) return false;
  try {
    const d = JSON.parse(raw);
    if (!_validSnapshot(d)) return false;
    return (d.S.length + d.T.length + d.CA.length + ((d.JOBS && d.JOBS.length) || 0)) > 0;
  } catch (e) { return false; }
}

// Is the in-memory CRM still an untouched new account?
function _crmIsEmpty() {
  try {
    return S.length === 0 && T.length === 0 && CA.length === 0 && JOBS.length === 0 &&
           GC_OPPS.length === 0 && GC_CONTRACTS.length === 0 && GC_PROP.length === 0;
  } catch (e) { return false; }
}

/* ---------- centralized legacy-recovery eligibility ----------
   ONE check, used by the banner, the Settings action, and importLegacyCache
   itself, so those three can never disagree. Recovery is not merely warned
   about outside the approved state — it is unavailable.

   _recoveryState is set ONLY where the approved state is positively established
   (a confirmed CLOUD_ROW_ABSENT with no valid scoped snapshot). Cloud absence is
   never inferred from "no data is visible".

   Note on requirement 5: "no valid scoped snapshot exists" is recorded at load
   time rather than re-derived live, because new-user init writes a scoped
   snapshot moments later — a live reading would make recovery permanently
   ineligible in the one case it exists for. The live guard for "this account has
   nothing to lose" is _crmIsEmpty() + _scopedSnapshotHasContent(). */
let _recoveryState = null;     // {uid, epoch, cloudAbsent, scopedAbsentAtLoad} | null
let _recoveryImporting = false;
let _logoutInProgress = false;

function _recoveryEligibleCore(ignoreImporting) {
  if (!ignoreImporting && _recoveryImporting) return false;            // (9)
  if (_logoutInProgress) return false;                                 // (10)
  const B = window.__ffBoot;
  if (!B || !B.authResolved || !B.started) return false;               // (1)
  const uid = window.FF_USER && window.FF_USER.id;
  if (!uid) return false;                                              // (2)
  const R = _recoveryState;
  if (!R) return false;                                                // (4)(8)
  if (!R.cloudAbsent || !R.scopedAbsentAtLoad) return false;           // (4)(5)
  if (R.uid !== uid) return false;                                     // (2)
  if (R.epoch !== _authEpoch) return false;                            // (3)
  if (!_cloudWritable) return false;                                   // (8)
  if (_crmLocked) return false;                                        // (8)
  if (!_crmIsEmpty()) return false;                                    // (7)
  if (_scopedSnapshotHasContent(uid)) return false;                    // (5)
  if (!_legacyKeyPresent()) return false;                              // (6)
  return true;
}
function _recoveryEligible() { return _recoveryEligibleCore(false); }

// Show or remove the banner strictly according to eligibility.
function _syncRecoveryUi() {
  if (_recoveryEligible()) { _showLegacyRecovery(); return; }

// Actual network write to Supabase (one row per user, upserted).
// Every precondition here is load-bearing: a write is only ever allowed for a
// still-signed-in user whose cloud state we have positively verified.
async function _pushToCloud() {
  const cap = _authCap();
  if (!_authOk(cap)) { _savePending = false; return; }   // no user, or signed out
  if (!_cloudWritable) { _dirty = true; _setSaveChip('sync-unavailable'); return; }
  if (_saveInFlight) { _savePending = true; return; }
  _saveInFlight = true;
  const data = _collectState();
  if (!_validSnapshot(data)) { _saveInFlight = false; return; }
  _writeScopedLocal(data, cap.uid);   // scoped local mirror first (offline safety net)
  try {
    // supabase-js RESOLVES with {error} on RLS/4xx rather than throwing, so the
    // error object must be inspected explicitly — catch alone would miss it.
    const { error } = await window.ffSupa
      .from('snapshot')
      .upsert({ owner: cap.uid, data, updated_at: new Date().toISOString() }, { onConflict: 'owner' });
    if (!_authOk(cap)) return;   // signed out while the write was in flight
    if (error) { console.warn('Cloud save error:', error.message); _dirty = true; _setSaveBadge('local'); }
    else { _dirty = false; _initSaveDone = true; _lastSavedAt = new Date(); _setSaveBadge('cloud'); }
  } catch(e) {
    if (_authOk(cap)) { console.warn('Futuro OS cloud save failed:', e.message); _dirty = true; _setSaveBadge('local'); }
  } finally {
    _saveInFlight = false;
    if (_savePending) {
      _savePending = false;
      if (_authOk(cap) && _cloudWritable) _pushToCloud();
    }
  }
}

// Public saveAll() — same name/signature the whole app uses (82 call sites).
// Local saves under the scoped key always proceed; only the cloud write is gated.
function saveAll() {
  const cap = _authCap();
  if (!cap.uid) return;      // never touch storage before authentication resolves
  if (_crmLocked) return;    // account unverified: nothing here is safe to persist
  _writeScopedLocal(_collectState(), cap.uid);
  _dirty = true;
  clearTimeout(_saveTimer);
  if (!_cloudWritable) { _setSaveChip('sync-unavailable'); return; }
  _saveTimer = setTimeout(_pushToCloud, 600);
}

// Async load. Returns one of three DISTINCT states — an error is never reported
// as an absent row, because "no data" authorizes writes and "load failed" must not.
//   { state, source?, reason?, localCorrupt?, preserve? }
async function loadSnapshot() {
  const cap = _authCap();
  if (!cap.uid || !window.ffSupa) return { state: LOAD_STATE.ERROR, reason: 'no-auth', source: 'none' };

  let row = null, err = null;
  try {
    const res = await window.ffSupa
      .from('snapshot').select('data').eq('owner', cap.uid)
      .order('updated_at', { ascending: false }).limit(1).maybeSingle();
    row = res.data; err = res.error;   // explicit error-object inspection
  } catch (e) { err = e; }

  if (!_authOk(cap)) return { state: LOAD_STATE.ERROR, reason: 'auth-changed', source: 'none' };

  const local = _readScopedLocal(cap.uid);
  const corrupt = local.state === 'CORRUPT';

  // --- CLOUD_LOAD_ERROR: transport failure or a resolved error object ---
  if (err) {
    console.warn('Cloud load failed:', err.message || err);
    if (local.state === 'OK') {
      _applyState(local.data);
      _lastSavedAt = _validSavedAt(local.data.savedAt) ? new Date(local.data.savedAt) : null;
      return { state: LOAD_STATE.ERROR, reason: 'cloud-error', source: 'local', localCorrupt: corrupt, preserve: local.preserve };
    }
    return { state: LOAD_STATE.ERROR, reason: 'cloud-error', source: 'none', localCorrupt: corrupt, preserve: local.preserve };
  }

  // --- CLOUD_ROW_ABSENT: positively confirmed, no row for this owner ---
  if (!row || !row.data) {
    if (local.state === 'OK') {
      _applyState(local.data);
      _lastSavedAt = _validSavedAt(local.data.savedAt) ? new Date(local.data.savedAt) : null;
      return { state: LOAD_STATE.ABSENT, source: 'local', localCorrupt: corrupt, preserve: local.preserve };
    }
    return { state: LOAD_STATE.ABSENT, source: 'new', localCorrupt: corrupt, preserve: local.preserve };
  }

  // A row exists but is malformed: that is an integrity error, NOT a new user.
  // Treating it as new-user is what allowed an empty snapshot to overwrite it.
  if (!_validSnapshot(row.data)) {
    if (local.state === 'OK') {
      _applyState(local.data);
      _lastSavedAt = _validSavedAt(local.data.savedAt) ? new Date(local.data.savedAt) : null;
      return { state: LOAD_STATE.ERROR, reason: 'cloud-invalid', source: 'local', localCorrupt: corrupt, preserve: local.preserve };
    }
    return { state: LOAD_STATE.ERROR, reason: 'cloud-invalid', source: 'none', localCorrupt: corrupt, preserve: local.preserve };
  }

  // --- CLOUD_ROW_LOADED: both sides valid → newer savedAt wins ---
  const cAt = _validSavedAt(row.data.savedAt) ? row.data.savedAt : null;
  const lAt = (local.state === 'OK' && _validSavedAt(local.data.savedAt)) ? local.data.savedAt : null;

  let winner = row.data, source = 'cloud';
  if (local.state === 'OK') {
    // A snapshot with no usable timestamp never defeats one that has a valid one.
    // Cloud wins exact ties and wins when neither side is validly timestamped:
    // the local mirror is written from the cloud on load, so equal almost always
    // means identical, and preferring cloud converges across devices.
    if (lAt !== null && cAt === null) { winner = local.data; source = 'local'; }
    else if (lAt !== null && cAt !== null && lAt > cAt) { winner = local.data; source = 'local'; }
  }

  if (!_authOk(cap)) return { state: LOAD_STATE.ERROR, reason: 'auth-changed', source: 'none' };
  _applyState(winner);
  _lastSavedAt = _validSavedAt(winner.savedAt) ? new Date(winner.savedAt) : null;
  _writeScopedLocal(winner, cap.uid);
  return { state: LOAD_STATE.LOADED, source, localCorrupt: corrupt, preserve: local.preserve };
}

async function clearSave() {
  if (!confirm('Reset ALL data (cloud + this browser) back to defaults?\n\nThis permanently deletes every job, client, document record, and setting. Export a backup first (Settings & Backup).')) return;
  if (!confirm('Last check: this cannot be undone. Really erase everything?')) return;
  const cap = _authCap();
  if (!cap.uid) return;
  try {
    if (window.ffSupa) await window.ffSupa.from('snapshot').delete().eq('owner', cap.uid);
  } catch(e) { console.warn('Cloud clear failed:', e.message); }
  if (!_authOk(cap)) return;
  const k = _lsKey(cap.uid);                       // this account's cache only
  if (k) { try { localStorage.removeItem(k); } catch(e){} }
  location.reload();
}

// Ordered teardown, run BEFORE signOut() while FF_USER is still set so the scoped
// key can be resolved. The epoch bump is what actually stops in-flight work: the
// 600ms save timer can otherwise fire during `await signOut()` and write the
// outgoing user's CRM. Ordering alone would still be a race — the guard is not.
window.__ffTeardown = function(opts) {
  const removeScoped = !!(opts && opts.removeScoped);
  _logoutInProgress = true;    // recovery is ineligible from this instant
  _recoveryState = null;
  _recoveryImporting = false;
  _authEpoch++;
  // Invalidate any bootstrap that is pending or still in flight, so a late
  // initializer from this session cannot apply state into the next one.
  if (typeof window.__ffBootInvalidate === 'function') window.__ffBootInvalidate();
  clearTimeout(_saveTimer); _saveTimer = null;
  _cloudWritable = false;
  _savePending = false;
  _saveInFlight = false;
  _initSaveDone = false;
  _crmLocked = false;
  if (removeScoped) {
    const k = _lsKey();                            // current user's scoped key only
    if (k) { try { localStorage.removeItem(k); } catch(e){} }
  }
  _dirty = false;
  _lastSavedAt = null;
  try {
    S.length=0; T.length=0; CA.length=0; done.clear(); clDone.clear();
    qtHistory.length=0; laHistory.length=0;
    VETLOG.length=0; FLOATLOADS.length=0; SHIPCREDIT.length=0; DOCLOADS.length=0;
    JOBS.length=0; DRIVERS.length=0; GOVCONTACTS.length=0; EXCPTS.length=0;
    IMPLOG.length=0; GLOG.length=0;
    GC_OPPS.length=0; GC_PROP.length=0; GC_AWARDS.length=0;
    GC_CONTRACTS.length=0; GC_TOS.length=0; GC_PERF.length=0;
  } catch(e){}
  window.FF_USER = null;
  return true;
};

window.__ffHasDirty = function(){ return !!_dirty; };

// Import the pre-P0-A unscoped cache into the signed-in account. Only ever runs
// from an explicit click. The legacy key itself is never modified or removed.
const RECOVERY_UNAVAILABLE_MSG =
  'Recovering earlier browser data is not available right now.\n\n' +
  'It is offered only for an account that has no data of its own yet and whose ' +
  'cloud record has been positively confirmed as empty. This account already has ' +
  'data, or its cloud state could not be safely verified.';

const RECOVERY_WARNING =
  'This imports earlier browser data into the account currently signed in.\n\n' +
  'The app cannot verify that the earlier data belongs to this account.\n\n' +
  'Importing REPLACES the current in-memory Futuro OS state and may synchronize ' +
  'the imported data to this account\'s cloud record.\n\n' +
  'Export a backup first if there is anything you may need to preserve.\n\n' +
  'The original legacy browser copy will remain unchanged.\n\n' +
  'Press Cancel to leave everything exactly as it is.';

// The ONLY path that imports the legacy cache. Eligibility is re-checked here at
// execution time, not trusted from whatever UI produced the click — a banner or
// Settings button rendered in an earlier state must never authorize a later
// unsafe import. Nothing is parsed until eligibility holds.
function importLegacyCache() {
  const cap = _authCap();
  if (!_authOk(cap)) { _syncRecoveryUi(); return; }
  if (!_recoveryEligibleCore(false)) {          // stale UI, or state moved on
    alert(RECOVERY_UNAVAILABLE_MSG);
    _syncRecoveryUi();
    return;
  }
  _recoveryImporting = true;
  try {
    let raw = null;
    try { raw = localStorage.getItem(LS_LEGACY); } catch(e){}
    if (raw === null) { alert('No earlier Futuro OS data was found in this browser.'); return; }
    let data = null;
    try { data = JSON.parse(raw); }
    catch(e) { alert('The earlier data in this browser could not be read, so it cannot be imported. It has been left in place, unchanged.'); return; }
    if (!_validSnapshot(data)) { alert('The earlier data in this browser is not a usable Futuro OS snapshot. It has been left in place, unchanged.'); return; }

    if (!confirm(RECOVERY_WARNING)) return;     // Cancel → nothing changes

    // Re-check after the dialog: the user may have sat on it, and eligibility
    // must still hold at the instant we replace state.
    if (!_authOk(cap) || !_recoveryEligibleCore(true)) {
      alert(RECOVERY_UNAVAILABLE_MSG);
      _syncRecoveryUi();
      return;
    }
    if (!_applyState(data)) { alert('That data could not be applied.'); return; }
    ctMigrate(); syncAllScores();
    if (!_authOk(cap)) return;                  // signed out during apply
    _writeScopedLocal(_collectState(), cap.uid);
    _recoveryState = null;                      // consumed: single-use by design
    const b = document.getElementById('ff-legacy-banner'); if (b) b.remove();
    saveAll();                                  // guarded; reports real cloud result
    rNav(); go('control');
  } finally {
    _recoveryImporting = false;
  }
}

// Cloud unverifiable AND no local snapshot → the CRM must not be editable, and
// must not look like a new account. Deliberately NOT a covering overlay: the
// sidebar (sign out) and topbar stay live, so this state can never trap the app.
function _setCrmLock(on) {
  _crmLocked = !!on;
  const c = document.getElementById('content');
  if (c) {
    c.style.pointerEvents = on ? 'none' : '';
    c.style.opacity = on ? '.45' : '';
    c.setAttribute('aria-disabled', on ? 'true' : 'false');
  }
  const host = document.getElementById('ff-notices');
  let bar = document.getElementById('ff-cloud-lock');
  if (!on) { if (bar) bar.remove(); return; }
  if (bar || !host) return;
  bar = document.createElement('div');
  bar.id = 'ff-cloud-lock';
  bar.setAttribute('role', 'alert');
  bar.style.cssText = 'margin:10px 14px 0;padding:11px 14px;border-radius:10px;background:rgba(220,38,38,.10);border:1px solid rgba(248,113,113,.30);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
  const t = document.createElement('div');
  t.style.cssText = 'flex:1;min-width:220px;font-size:12.5px;color:var(--t2);line-height:1.5';
  t.textContent = 'Your account data could not be verified, so editing is paused to protect it. Nothing has been changed or deleted. This is not a new account — retry when you have a connection.';
  const r = document.createElement('button');
  r.type = 'button'; r.className = 'btn-sm';
  r.textContent = 'Retry';
  r.addEventListener('click', retryCloudVerify);
  bar.appendChild(t); bar.appendChild(r);
  host.appendChild(bar);
}

async function retryCloudVerify() {
  _setSaveChip('Checking cloud…');
  const res = await loadSnapshot();
  __ffApplyLoadResult(res);
  if (!_crmLocked) { rNav(); go('control'); }
}

// Single place that turns a load result into app state. Used by first init and by
// the retry action, so both paths can never drift apart.
function __ffApplyLoadResult(res) {
  if (res.preserve === 'at-cap') {
    console.warn('Local cache recovery copies are at the retention cap; none created.');
  }
  if (res.state === LOAD_STATE.ERROR) {
    _cloudWritable = false;
    _recoveryState = null;     // cloud unverified: recovery must never be offered
    if (res.source === 'local') {
      _setCrmLock(false);
      _setSaveChip('sync-unavailable');
    } else {
      _setCrmLock(true);
      _setSaveChip('sync-unavailable');
    }
    _syncRecoveryUi();
    return;
  }
  _cloudWritable = true;
  _setCrmLock(false);
  if (res.state === LOAD_STATE.ABSENT) {
    if (res.source === 'local') {
      // Cloud is empty but this account HAS local data: not a recovery state.
      // Importing here would destroy that data.
      _recoveryState = null;
      _dirty = true;
      saveAll();               // seed the first cloud row from preserved local data
      _setSaveChip('local');
    } else {
      // The one approved recovery state: cloud row positively confirmed absent
      // AND no valid scoped snapshot for this user at load time.
      _recoveryState = {
        uid: (window.FF_USER && window.FF_USER.id) || null,
        epoch: _authEpoch,
        cloudAbsent: true,
        scopedAbsentAtLoad: true
      };
      if (!_initSaveDone) { _initSaveDone = true; saveAll(); }   // new user, exactly once
      _setSaveChip('local');
    }
    _syncRecoveryUi();
    return;
  }
  // A cloud row loaded: this account has cloud state. Never a recovery state.
  _recoveryState = null;
  _syncRecoveryUi();
  _setSaveChip('cloud');
  if (res.source === 'local') { _dirty = true; saveAll(); }      // local was newer
}

// ---------- backup export / import ----------
function exportBackup(){
  try{
    const data=_collectState();
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='futurofreight-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){alert('Backup export failed: '+e.message);}
}
function importBackup(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(!data||!data.S){alert('That file is not a Futuro OS backup (missing expected data).');return;}
        const when=data.savedAt?new Date(data.savedAt).toLocaleString():'unknown date';
        if(!confirm('Restore backup from '+when+'?\n\nThis REPLACES everything currently in the app. Consider exporting the current data first.'))return;
        if(!_applyState(data)){alert('The backup could not be applied.');return;}
        ctMigrate();syncAllScores();saveAll();rNav();go('control');
        alert('Backup restored ('+ (data.JOBS?data.JOBS.length:0) +' jobs, '+(data.S?data.S.length:0)+' clients).'+(_cloudWritable?' It has been re-saved to your account.':' Saved on this browser only — the cloud is currently unavailable, so it will sync once the connection is verified.'));
      }catch(e){alert('Could not read that file: '+e.message);}
    };
    rd.readAsText(f);
  };
  inp.click();
}

// ---------- undo engine (snapshot-based) ----------
// Every delete takes a full-state snapshot first. Undo restores the
// most recent snapshot. Stack holds the last 10 destructive actions.
let _undoStack=[];
function undoPoint(label){
  try{ _undoStack.push({label,data:JSON.parse(JSON.stringify(_collectState()))}); if(_undoStack.length>10)_undoStack.shift(); }catch(e){ console.warn('undoPoint failed:',e.message); }
}
function undoLast(){
  const u=_undoStack.pop();
  if(!u){_toast('Nothing to undo',false);return;}
  _applyState(u.data);
  ctMigrate();syncAllScores();
  sel=null;selJob=null;selLeads.clear();selCarriers.clear();selTasks.clear();selJobs.clear();
  saveAll();rNav();renderHelpBar(page);rPage();
  _toast('Undone: '+u.label,false);
}
function _toast(msg,withUndo){
  const old=document.getElementById('ff-undo-toast'); if(old)old.remove();
  const t=document.createElement('div');
  t.id='ff-undo-toast'; t.setAttribute('role','status');
  t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel-solid,#111722);border:1px solid var(--b3,rgba(255,255,255,.2));color:var(--t1,#eaf0fb);font-size:13px;padding:11px 16px;border-radius:12px;z-index:60000;display:flex;gap:14px;align-items:center;box-shadow:0 12px 44px rgba(0,0,0,.55);max-width:min(92vw,480px)';
  const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  if(withUndo!==false){
    const b=document.createElement('button');
    b.textContent='Undo';
    b.style.cssText='background:var(--bblue,rgba(59,114,255,.15));color:var(--tblue,#86a6ff);border:1px solid rgba(59,114,255,.4);border-radius:8px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0';

}

let _modalPrevFocus=null;
function _trapFocus(ov){
  ov.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const f=[...ov.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}

function _csvParse(text){
  const rows=[]; let row=[], field='', inQ=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  row.push(field); rows.push(row);
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function _dlLeadTemplate(){
  const header=['company','city','state','industry','equipment','monthly_loads','annual_spend','source','phone','email','contact_name','contact_title','tags','notes'].map(safeCsvCell).join(',')+'\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([header],{type:'text/csv'}));
  a.download='futurofreight_leads_template.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function _toggleImport(on){
  const sb=document.getElementById('ff-modal-save'); if(!sb)return;
  sb.disabled=!on; sb.style.opacity=on?'1':'.45'; sb.style.cursor=on?'pointer':'not-allowed';
}
function parseLeadCsv(){
  _csvStaged=[];
  const prev=document.getElementById('csv-preview');
  const raw=(document.getElementById('csv-input')||{}).value||'';
  const warn=c=>`<div style="font-size:11.5px;color:var(--tamber,#f5a623)">${c}</div>`;
  if(!raw.trim()){ prev.innerHTML=warn('Paste some CSV first.'); _toggleImport(false); return; }
  let rows;
  try{ rows=_csvParse(raw); }catch(e){ prev.innerHTML=warn('Could not parse CSV: '+e.message); _toggleImport(false); return; }
  if(rows.length<2){ prev.innerHTML=warn('Need a header row plus at least one data row.'); _toggleImport(false); return; }
  const idx={};
  rows[0].forEach((h,j)=>{ const k=h.trim().toLowerCase().replace(/\s+/g,'_'); if(k) idx[k]=j; });
  if(idx.company==null){ prev.innerHTML=warn('Missing required <b>company</b> column in the header row.'); _toggleImport(false); return; }
  const EQ={}; FREIGHT_OPTS.forEach(([k,l])=>{ EQ[k]=k; EQ[l.toLowerCase()]=k; EQ[l.toLowerCase().replace(/\s+/g,'_')]=k; });
  const SRC=['cold_call','referral','inbound','linkedin','website','other'];
  const skipped=[], warnings=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const cell=h=>{ const j=idx[h]; return j==null?'':(r[j]||'').trim(); };
    const co=cell('company');
    if(!co){ skipped.push('Row '+(i+1)+': missing company'); continue; }
    let fr=cell('equipment').split('|').map(t=>EQ[t.trim().toLowerCase().replace(/\s+/g,'_')]).filter(Boolean);
    fr=[...new Set(fr)];
    if(!fr.length){ fr=['dry_van']; if(cell('equipment')) warnings.push(co+': equipment not recognized, defaulted to dry van'); }
    let src=cell('source').toLowerCase().trim().replace(/\s+/g,'_'); if(src==='research'||src==='cold') src='cold_call'; if(SRC.indexOf(src)<0) src='other';
    const numOf=h=>{ const v=cell(h); if(v==='') return 0; const n=parseFloat(v.replace(/[$,]/g,'')); if(isNaN(n)){ warnings.push(co+': '+h+' "'+v+'" is not a number, set to 0'); return 0; } return n; };
    const vol=numOf('monthly_loads'), sp=numOf('annual_spend');
    let sta=cell('state').toUpperCase(); if(sta && sta.length!==2) warnings.push(co+': state "'+sta+'" is not a 2-letter code');
    const tg=cell('tags').split('|').map(t=>t.trim()).filter(Boolean);
    const cName=cell('contact_name'), cTitle=cell('contact_title');
    const contacts=cName?[{name:cName,title:cTitle}]:[];
    const lead={id:_genId('s'),co,st:'new',sg:'prospecting',sc:0,
      ind:cell('industry'),ph:cell('phone'),em:cell('email'),city:cell('city'),sta,
      src,fr,vol,sp,mg:0,ld:0,rv:0,tg,lc:null,fu:Date.now()+7*864e5,activities:[],contacts};
    const note=cell('notes'); if(note) lead.activities.unshift({ic:'ti-notes',su:'Imported note',bo:note,oc:'research',ts:Date.now()});
    syncScore(lead);
    _csvStaged.push(lead);
  }
  const n=_csvStaged.length;
  if(!n){ prev.innerHTML=warn('No valid rows found.'+(skipped.length?' '+skipped.join(' · '):'')); _toggleImport(false); return; }
  const head='<div style="font-size:12px;font-weight:700;color:var(--t1,#e9ecf1);margin-bottom:8px">'+n+' ready to import'+(skipped.length?' · '+skipped.length+' skipped':'')+'</div>';
  const tbl='<div style="border:1px solid var(--b2,rgba(255,255,255,.1));border-radius:8px;overflow:hidden">'
    + _csvStaged.slice(0,12).map(l=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--b2,rgba(255,255,255,.06));font-size:11px"><span style="color:var(--t1,#e9ecf1);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.co)}</span><span style="color:var(--t3,#5f6877)">${esc(l.city||'—')}, ${esc(l.sta||'—')}</span><span style="font-weight:700;color:${$sc(l.sc)}">${l.sc}</span></div>`).join('')
    + (n>12?`<div style="padding:6px 10px;font-size:11px;color:var(--t3,#5f6877)">+${n-12} more</div>`:'')
    + '</div>';
  const sk=skipped.length?`<div style="margin-top:8px;font-size:11px;color:var(--t3,#5f6877)"><b style="color:var(--tred,#ff6b6b)">Skipped:</b> ${esc(skipped.join(' · '))}</div>`:'';
  const wn=warnings.length?`<div style="margin-top:6px;font-size:11px;color:var(--tamber,#f5a623)"><b>Notes:</b> ${esc(warnings.slice(0,6).join(' · '))}${warnings.length>6?' · +'+(warnings.length-6)+' more':''}</div>`:'';
  prev.innerHTML=head+tbl+sk+wn;
  _toggleImport(true);
}
function doLeadImport(){
  if(!_csvStaged.length){ alert('Parse a CSV first — nothing staged to import.'); return false; }
  for(let k=_csvStaged.length-1;k>=0;k--) S.unshift(_csvStaged[k]);
  const n=_csvStaged.length; _csvStaged=[];
  saveAll(); if(page==='leads')rLeads(); else if(page==='dashboard')rDash(); rNav();
  alert('Imported '+n+' lead'+(n!==1?'s':'')+'. Scored and in your pipeline.');
}
