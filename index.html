<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturoOS</title>

<style>
body{margin:0;font-family:system-ui;background:#0b0f1a;color:#e5e7eb}
.topbar{display:flex;gap:10px;padding:12px;background:#020617}
button{background:#1e293b;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{background:#334155}
.panel{display:none;padding:20px}
.panel.active{display:block}
.card{background:#111827;padding:14px;margin-bottom:10px;border-radius:10px}
input{padding:8px;width:60%;margin:5px 0;background:#020617;color:white;border:1px solid #1f2937}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px}
.freight{background:#2563eb}
.govcon{background:#16a34a}
.pipeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#020617;padding:10px;border-radius:8px}
.status{font-size:12px;color:#9ca3af;margin-top:5px}
</style>
</head>

<body>

<div class="topbar">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('freight')">Freight</button>
  <button onclick="show('govcon')">GovCon</button>
  <button onclick="show('pipeline')">Pipeline</button>
</div>

<div id="dashboard" class="panel active">
  <div class="card">
    <h2>Command Center</h2>
    <button onclick="loadAll()">Auto Source (Real + Simulated)</button>
    <div id="status"></div>
  </div>
</div>

<div id="freight" class="panel">
  <div class="card">
    <h2>Freight</h2>
    <button onclick="loadFreight()">Load Freight Deals</button>
  </div>
  <div id="freightList"></div>
</div>

<div id="govcon" class="panel">
  <div class="card">
    <h2>GovCon (Live SAM.gov)</h2>
    <input id="apiKey" placeholder="Paste SAM.gov API Key">
    <button onclick="loadGov()">Fetch Contracts</button>
  </div>
  <div id="govList"></div>
</div>

<div id="pipeline" class="panel">
  <h2>Pipeline</h2>
  <div class="pipeline">
    <div class="col"><h3>Lead</h3><div id="lead"></div></div>
    <div class="col"><h3>Active</h3><div id="active"></div></div>
    <div class="col"><h3>Closed</h3><div id="closed"></div></div>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// STORAGE
let deals = JSON.parse(localStorage.getItem('deals')) || [];

function save(){
  localStorage.setItem('deals', JSON.stringify(deals));
}

// =======================
// 🚚 FREIGHT (SIMULATED BUT STRUCTURED)
// =======================
function loadFreight(){
  updateStatus("Loading freight...");

  try{
    const freight = [
      {title:"Amazon Load VA→TX", value:5200},
      {title:"Walmart DC→FL", value:4100},
      {title:"Target MD→GA", value:3900}
    ];

    freight.forEach(d=>{
      deals.push({
        id:Date.now()+Math.random(),
        type:'freight',
        title:d.title,
        value:d.value,
        stage:'lead'
      });
    });

    save();
    renderAll();
    updateStatus("Freight loaded successfully");

  }catch(e){
    updateStatus("Freight error");
  }
}

// =======================
// 🏛 GOVCON (REAL API)
// =======================
async function loadGov(){
  const key = apiKey.value;
  if(!key){
    updateStatus("Missing API key");
    return;
  }

  updateStatus("Fetching SAM.gov...");

  try{
    const res = await fetch(`https://api.sam.gov/opportunities/v2/search?api_key=${key}&limit=5`);
    const data = await res.json();

    if(!data.opportunitiesData){
      updateStatus("No data returned");
      return;
    }

    data.opportunitiesData.forEach(op=>{
      deals.push({
        id:Date.now()+Math.random(),
        type:'govcon',
        title: op.title || "Untitled",
        value: op.award?.amount || 0,
        stage:'lead'
      });
    });

    save();
    renderAll();
    updateStatus("GovCon loaded successfully");

  }catch(e){
    updateStatus("API error (check key)");
  }
}

// =======================
// LOAD ALL
// =======================
function loadAll(){
  loadFreight();
}

// =======================
// RENDER
// =======================
function renderAll(){
  freightList.innerHTML='';
  govList.innerHTML='';
  lead.innerHTML='';
  active.innerHTML='';
  closed.innerHTML='';

  deals.forEach(d=>{
    const card = `
      <div class="card">
        ${d.title}
        <br>$${d.value}
        <span class="badge ${d.type}">${d.type}</span>
        <br>
        <button onclick="move(${d.id})">Next</button>
        <button onclick="del(${d.id})">Delete</button>
      </div>
    `;

    if(d.type==='freight') freightList.innerHTML+=card;
    if(d.type==='govcon') govList.innerHTML+=card;

    document.getElementById(d.stage).innerHTML+=card;
  });
}

// =======================
// PIPELINE CONTROL
// =======================
function move(id){
  const d = deals.find(x=>x.id===id);
  if(d.stage==='lead') d.stage='active';
  else if(d.stage==='active') d.stage='closed';
  save();
  renderAll();
}

function del(id){
  deals = deals.filter(d=>d.id!==id);
  save();
  renderAll();
}

// =======================
// STATUS + TESTING
// =======================
function updateStatus(msg){
  document.getElementById("status").innerText = msg;
  console.log("[STATUS]", msg);
}

// INIT
renderAll();
updateStatus("System ready");
</script>

</body>
</html>
