<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuturoFreight — Solo Edition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;--bg2:#0f172a;--bg3:#1a2540;--bg4:#162032;--bg5:#1e2d4a;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);--b3:rgba(255,255,255,0.16);
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#475569;--t4:#334155;
  --blue:#2563eb;--bblue:rgba(37,99,235,0.15);--tblue:#60a5fa;
  --green:#059669;--bgreen:rgba(5,150,105,0.12);--tgreen:#34d399;
  --amber:#d97706;--bamber:rgba(217,119,6,0.12);--tamber:#fbbf24;
  --red:#dc2626;--bred:rgba(220,38,38,0.12);--tred:#f87171;
  --rmd:8px;--rlg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--t1);line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b1);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.logo{padding:16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;color:white;font-size:16px;flex-shrink:0}
.logo-name{font-size:14px;font-weight:700;color:var(--t1)}
.logo-sub{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.nav{padding:8px;flex:1;overflow-y:auto}
.nb{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rmd);border:none;cursor:pointer;background:transparent;color:var(--t2);font-size:12px;text-align:left;transition:all .12s;position:relative;margin-bottom:2px}
.nb:hover{background:var(--bg3);color:var(--t1)}
.nb.active{background:var(--bblue);color:var(--tblue);font-weight:600}
.nb i{font-size:15px;opacity:.85}
.nbadge{margin-left:auto;background:var(--red);color:white;font-size:9px;font-weight:700;border-radius:99px;padding:1px 6px}
.nav-section{font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-weight:600}
.nav-divider{height:1px;background:var(--b1);margin:4px 8px 6px}
.nav-footer{padding:12px 16px 18px;border-top:1px solid var(--b1)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bblue);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tblue);flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--bg2);border-bottom:1px solid var(--b1);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.2px}
.topbar-sub{font-size:11px;color:var(--t3);margin-top:1px}
.search{display:flex;align-items:center;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rmd);padding:5px 11px;gap:7px;min-width:180px}
.search input{border:none;background:transparent;outline:none;font-size:12px;color:var(--t1);width:100%}
.search input::placeholder{color:var(--t4)}
.btn{padding:7px 16px;background:var(--blue);color:white;border:none;border-radius:var(--rmd);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-ghost{padding:7px 14px;background:var(--bg3);color:var(--t1);border:1px solid var(--b2);border-radius:var(--rmd);font-size:12px;cursor:pointer}
.btn-sm{padding:5px 12px;background:var(--bg4);color:var(--t2);border:1px solid var(--b2);border-radius:var(--rmd);font-size:11px;cursor:pointer}
.btn-sm:hover{color:var(--t1);border-color:var(--b3)}
.btn-copy{padding:6px 14px;background:var(--bblue);color:var(--tblue);border:1px solid rgba(96,165,250,.2);border-radius:var(--rmd);font-size:11px;font-weight:600;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:16px}
.card-title{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--t3);margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:14px 16px}
.kpi-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.kpi-v{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.5px}
.kpi-c{font-size:11px;margin-top:3px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.th{display:grid;padding:8px 16px;background:var(--bg4);border-bottom:1px solid var(--b1);font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;gap:10px}
.tr{display:grid;padding:11px 16px;border-bottom:1px solid var(--b1);align-items:center;gap:10px;cursor:pointer;transition:background .1s}
.tr:hover{background:var(--bg5)}
.tr:last-child{border-bottom:none}
.cn{font-size:12px;font-weight:600;color:var(--t1)}
.cs2{font-size:10px;color:var(--t3);margin-top:2px}
.sb{display:flex;align-items:center;gap:6px}
.st{flex:1;height:5px;background:var(--b2);border-radius:3px;overflow:hidden}
.sf{height:100%;border-radius:3px;transition:width .5s}
.tabs{display:flex;gap:2px;background:var(--bg4);border-radius:var(--rmd);padding:3px;width:fit-content;margin-bottom:12px;border:1px solid var(--b1)}
.tab-btn{padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-size:11px;background:transparent;color:var(--t3);transition:all .12s}
.tab-btn.active{background:var(--bg3);color:var(--t1);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.taskrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.taskrow:last-child{border-bottom:none}
.cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.cb.done{background:var(--bgreen);border-color:var(--tgreen);color:var(--tgreen)}
.kanban{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:200px;flex:0 0 200px;background:var(--bg3);border-radius:var(--rlg);padding:10px;border:1px solid var(--b1)}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b1)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dc{background:var(--bg4);border:1px solid var(--b1);border-radius:var(--rmd);padding:10px;margin-bottom:7px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.dc:hover{background:var(--bg5)}
.arow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.arow:last-child{border-bottom:none}
.aicon{width:32px;height:32px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:var(--t2)}
.back-btn{background:none;border:none;color:var(--t2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;margin-bottom:14px;padding:0}
.back-btn:hover{color:var(--t1)}
.lhead{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);padding:18px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pi{background:var(--bg4);border-radius:var(--rmd);padding:10px 12px}
.pl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pv{font-size:16px;font-weight:600;color:var(--t1)}
.alert-bar{background:var(--bamber);border:1px solid rgba(217,119,6,.25);border-radius:var(--rmd);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tamber)}
/* Load Analyzer */
.la-grid{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}
.la-section{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--b1)}
.la-section:first-child{margin-top:0;border-top:none;padding-top:0}
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--t2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;padding:8px 11px;background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);font-size:13px;color:var(--t1);outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus{border-color:var(--blue)}
.fi::placeholder{color:var(--t4)}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fi-pre{position:relative}
.fi-pre .fi{padding-left:22px}
.fi-sym{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;pointer-events:none}
.state-row{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:center}
.arr-mid{text-align:center;color:var(--t3);font-size:13px;margin-top:16px}
.btn-analyze{width:100%;padding:11px;background:var(--blue);color:white;border:none;border-radius:var(--rmd);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px}
.btn-analyze:hover{opacity:.88}
.la-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;color:var(--t3);text-align:center;padding:40px}
.v-banner{border-radius:var(--rlg);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.v-label{font-size:21px;font-weight:700;letter-spacing:-.3px}
.v-sub{font-size:12px;margin-top:2px;opacity:.8}
.g-ring{width:54px;height:54px;flex-shrink:0;position:relative}
.g-ring svg{transform:rotate(-90deg)}
.g-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{background:var(--bg4);border-radius:var(--rmd);padding:12px}
.mc-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.mc-v{font-size:18px;font-weight:600;letter-spacing:-.3px}
.mc-s{font-size:10px;color:var(--t3);margin-top:2px}
.mkt-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1)}
.mkt-row:last-child{border-bottom:none}
.mkt-lbl{font-size:12px;color:var(--t2);min-width:140px}
.mkt-bar{flex:1;position:relative;height:6px}
.mkt-bg{height:6px;background:var(--b2);border-radius:3px}
.mkt-fill{height:6px;border-radius:3px;position:absolute;top:0;left:0;transition:width .6s}
.mkt-val{font-size:12px;font-weight:600;min-width:60px;text-align:right}
.pay-track{position:relative;height:8px;background:var(--b2);border-radius:4px;margin:8px 0}
.pay-range{position:absolute;height:8px;border-radius:4px;background:var(--bblue)}
.pay-m{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;transform:translateX(-50%)}
.pay-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--t3)}
.flag{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:var(--rmd);margin-bottom:6px;border:1px solid transparent}
.flag:last-child{margin-bottom:0}
.flag i{font-size:14px;flex-shrink:0;margin-top:1px}
.flag-txt{font-size:12px;line-height:1.4}
.flag-danger{background:var(--bred);border-color:rgba(248,113,113,.2);color:var(--tred)}
.flag-warn{background:var(--bamber);border-color:rgba(251,191,36,.2);color:var(--tamber)}
.flag-good{background:var(--bgreen);border-color:rgba(52,211,153,.2);color:var(--tgreen)}
.q-box{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:14px;font-family:'Courier New',monospace;font-size:11px;color:var(--t2);line-height:1.9;white-space:pre-wrap;word-break:break-word}
.hi-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg4);border-radius:var(--rmd);margin-bottom:5px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.hi-row:hover{background:var(--bg5);border-color:var(--b2)}
.hi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fade-in{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.sel-cb{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s;background:transparent}
.sel-cb.checked{background:var(--blue);border-color:var(--blue);color:white}
.tr.selected{background:rgba(37,99,235,0.10)!important;border-left:2px solid var(--blue)}
.sel-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(37,99,235,0.12);border:1px solid rgba(37,99,235,0.25);border-radius:var(--rmd);margin-bottom:10px;font-size:12px;color:var(--tblue)}
.sel-bar button{padding:4px 12px;background:var(--bred);color:var(--tred);border:1px solid rgba(248,113,113,.25);border-radius:var(--rmd);font-size:11px;font-weight:600;cursor:pointer}
.sel-bar button:hover{background:rgba(220,38,38,.25)}
.set-field{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1);align-items:center;gap:10px}
.set-field:last-child{border-bottom:none}
.set-label{font-size:12px;color:var(--t2);flex-shrink:0;min-width:110px}
.set-value{font-size:12px;font-weight:600;color:var(--t1);flex:1;text-align:right}
.set-input{font-size:12px;color:var(--t1);background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:5px 9px;outline:none;flex:1;text-align:right}
.set-input:focus{border-color:var(--blue)}
.set-edit-btn{font-size:10px;color:var(--tblue);background:var(--bblue);border:1px solid rgba(96,165,250,.2);border-radius:var(--rmd);padding:3px 10px;cursor:pointer;font-weight:600;white-space:nowrap}
.set-save-btn{font-size:10px;color:var(--tgreen);background:var(--bgreen);border:1px solid rgba(52,211,153,.2);border-radius:var(--rmd);padding:3px 10px;cursor:pointer;font-weight:600;white-space:nowrap}
/* ── CHECKLIST ── */
.cl-section{background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rlg);margin-bottom:10px;overflow:hidden}
.cl-header{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.cl-header:hover{background:var(--bg4)}
.cl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cl-title{font-size:13px;font-weight:600;color:var(--t1);flex:1}
.cl-progress{font-size:10px;color:var(--t3)}
.cl-chevron{font-size:14px;color:var(--t3);transition:transform .2s}
.cl-chevron.open{transform:rotate(90deg)}
.cl-items{padding:0 16px 12px}
.cl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1)}
.cl-item:last-child{border-bottom:none}
.cl-cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--b2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s;margin-top:1px}
.cl-cb.done{background:var(--bgreen);border-color:var(--tgreen);color:var(--tgreen)}
.cl-cb.req{border-color:rgba(251,191,36,.5)}
.cl-info{flex:1}
.cl-item-title{font-size:12px;font-weight:600;color:var(--t1)}
.cl-item-detail{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.5}
.cl-cost{font-size:10px;color:var(--tgreen);font-weight:600;flex-shrink:0;margin-top:1px}
.cl-req-badge{font-size:9px;background:rgba(251,191,36,.15);color:var(--tamber);padding:1px 6px;border-radius:99px;font-weight:600;margin-left:6px}
/* ── OUTREACH ── */
.ou-mode-btn{padding:7px 14px;border-radius:var(--rmd);border:1px solid var(--b2);background:transparent;color:var(--t2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s}
.ou-mode-btn:hover{background:var(--bg3);color:var(--t1)}
.ou-mode-btn.active{background:var(--bblue);border-color:var(--tblue);color:var(--tblue);font-weight:600}
.ou-script{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:16px;font-size:12px;color:var(--t1);line-height:1.8;white-space:pre-wrap;font-family:-apple-system,sans-serif;min-height:200px}
/* ── QUOTING ── */
.qt-quote-display{background:var(--bg4);border:1px solid var(--b2);border-radius:var(--rmd);padding:16px;font-family:'Courier New',monospace;font-size:11px;color:var(--t1);line-height:1.9;white-space:pre-wrap}
.qt-hist-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg4);border-radius:var(--rmd);margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.qt-hist-row:hover{background:var(--bg5);border-color:var(--b2)}
@media(max-width:900px){.la-grid{grid-template-columns:1fr}.m-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">

</div>
</div>

const LS_KEY = 'futurofreight_v1';

function saveAll() {
  try {
    const data = {
      S,
      T,
      CA,
      done: [...done],
      orgSettings,
      qtHistory,
      qtSeq,
      laHistory: (laHistory||[]).slice(0, 20),
      clDone: [...clDone],
      savedAt: Date.now(),
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('FuturoFreight save failed:', e.message);
  }
}

function loadAll() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.S) return false;
    // Restore arrays
    S.length = 0; data.S.forEach(x => S.push(x));
    T.length = 0; data.T.forEach(x => T.push(x));
    CA.length = 0; data.CA.forEach(x => CA.push(x));
    // Restore Sets
    done.clear(); (data.done||[]).forEach(x => done.add(x));
    clDone.clear(); (data.clDone||[]).forEach(x => clDone.add(x));
    // Restore objects/primitives
    if (data.orgSettings) {
      orgSettings.name  = data.orgSettings.name  || orgSettings.name;
      orgSettings.mc    = data.orgSettings.mc    || orgSettings.mc;
      orgSettings.email = data.orgSettings.email || orgSettings.email;
    }
    if (data.qtHistory) { qtHistory.length=0; data.qtHistory.forEach(x=>qtHistory.push(x)); }
    if (data.qtSeq) qtSeq = data.qtSeq;
    if (data.laHistory) { laHistory.length=0; data.laHistory.forEach(x=>laHistory.push(x)); }
    return true;
  } catch(e) {
    console.warn('FuturoFreight load failed:', e.message);
    return false;
  }
}

function clearSave() {
  if (!confirm('Clear all saved data and reset to defaults? This cannot be undone.')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function getSaveStatus() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return data.savedAt ? new Date(data.savedAt) : null;
  } catch(e) { return null; }
}

function rChecklist(){

  const reqTotal=CHECKLIST.reduce((a,s)=>a+s.items.filter(i=>i.req).length,0);

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-size:15px;font-weight:700;color:var(--t1)">${done}/${total} completed</div><div style="font-size:11px;color:var(--t3);margin-top:1px">${reqDone}/${reqTotal} required items done</div></div>
        <div style="font-size:24px;font-weight:700;color:${pct>=100?'var(--tgreen)':pct>=60?'var(--tamber)':'var(--tred)'}">${pct}%</div>

      <div style="height:8px;background:var(--b2);border-radius:4px;overflow:hidden">

        <span><span style="color:var(--tamber)">■</span> = Required</span>
        <span>Est. total cost: <strong style="color:var(--t1)">$2,200-5,500 first year</strong></span>
      </div>
    </div>
    <div id="cl-body">${renderChecklistSections()}</div>
  </div>`;
}
function renderChecklistSections(){
  return CHECKLIST.map(sec=>{
    const done=sec.items.filter(i=>clDone.has(i.id)).length;
    const isOpen=clOpen.has(sec.sec);
    return`<div class="cl-section">
      <div class="cl-header" onclick="toggleSection('${sec.sec.replace(/'/g,"\'")}')">
        <div class="cl-dot" style="background:${sec.cl}"></div>
        <div class="cl-title">${sec.sec}</div>
        <div class="cl-progress">${done}/${sec.items.length}</div>
        <div style="width:60px;height:4px;background:var(--b2);border-radius:2px;margin:0 8px;overflow:hidden"><div style="width:${Math.round((done/sec.items.length)*100)}%;height:100%;background:${sec.cl};border-radius:2px"></div></div>
        <i class="ti ti-chevron-right cl-chevron${isOpen?' open':''}"></i>
      </div>
      ${isOpen?`<div class="cl-items">${sec.items.map(item=>{
        const isDone=clDone.has(item.id);
        return`<div class="cl-item">
          <div class="cl-cb${isDone?' done':item.req?' req':''}" onclick="toggleCl('${item.id}')">${isDone?'<i class="ti ti-check" style="font-size:10px"></i>':''}</div>
          <div class="cl-info">
            <div class="cl-item-title" style="${isDone?'text-decoration:line-through;color:var(--t3)':''}">${item.title}${item.req?'<span class="cl-req-badge">Required</span>':''}</div>
            <div class="cl-item-detail">${item.detail}</div>
          </div>
          <div class="cl-cost">${item.cost}</div>
        </div>`;}).join('')}</div>`:''}
    </div>`;
  }).join('');
}
function toggleSection(sec){
  if(clOpen.has(sec))clOpen.delete(sec);else clOpen.add(sec);
  const el=document.getElementById('cl-body');
  if(el)el.innerHTML=renderChecklistSections();
}
function toggleCl(id){
  if(clDone.has(id))clDone.delete(id);else clDone.add(id);
  saveAll();
  if(page==='checklist')rChecklist();
}

  const raw=OU_TEMPLATES[ouMode]?.fn(d)||'';return raw.split('\n').join('<br>');
}
function setOuMode(mode){ouMode=mode;if(page==='outreach')rOutreach();}
function ouUpdate(){const el=document.getElementById('ou-output');if(el)el.innerHTML=ouGenerate();}
function ouCopy(){
  const d=ouGetData();
  const txt=OU_TEMPLATES[ouMode]?.fn(d)||'';
  navigator.clipboard?.writeText(txt).then(()=>{
    const el=document.getElementById('ou-copied');
    if(el){el.style.display='flex';setTimeout(()=>el.style.display='none',2000);}
  });
}

// ============================================================
// RATE QUOTING VIEW
// ============================================================
let qtHistory=[],qtSeq=1000;
function qtNum(){return'QT-'+String(++qtSeq).padStart(5,'0');}
function rQuoting(){
  document.getElementById('content').innerHTML=`
  <div style="display:grid;grid-template-columns:360px 1fr;gap:14px;max-width:960px;align-items:start">
    <div>
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="card-title">Rate Quote Builder</div>
          <button class="btn-sm" onclick="qtClear()"><i class="ti ti-refresh"></i> Clear</button>
        </div>
        <div class="la-section" style="margin-top:0;border-top:none;padding-top:0">Shipper Info</div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Company Name</label><input class="fi" id="qt-co" placeholder="Acme Logistics" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Contact Name</label><input class="fi" id="qt-ct" placeholder="John Davis" oninput="qtPreview()"></div>
        </div>
        <div class="la-section">Lane Details</div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Origin City</label><input class="fi" id="qt-oc" placeholder="Chicago" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Origin State</label><input class="fi" id="qt-os" placeholder="IL" maxlength="2" oninput="this.value=this.value.toUpperCase();qtPreview()"></div>
        </div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Dest City</label><input class="fi" id="qt-dc" placeholder="Dallas" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Dest State</label><input class="fi" id="qt-ds" placeholder="TX" maxlength="2" oninput="this.value=this.value.toUpperCase();qtPreview()"></div>
        </div>
        <div class="la-section">Shipment</div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Equipment</label><select class="fi" id="qt-eq" onchange="qtPreview()"><option value="Dry Van">Dry Van</option><option value="Reefer">Reefer</option><option value="Flatbed">Flatbed</option><option value="Step Deck">Step Deck</option><option value="Tanker">Tanker</option><option value="LTL">LTL</option><option value="Expedited">Expedited</option></select></div>
          <div class="fg"><label class="fl">Miles</label><input class="fi" id="qt-mi" type="number" placeholder="781" oninput="qtPreview()"></div>
        </div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Commodity</label><input class="fi" id="qt-cm" placeholder="Retail Goods" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Weight (lbs)</label><input class="fi" id="qt-wt" type="number" placeholder="44000" oninput="qtPreview()"></div>
        </div>
        <div class="fi-row">
          <div class="fg"><label class="fl">Pickup Date</label><input class="fi" id="qt-pd" type="date" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Delivery Date</label><input class="fi" id="qt-dd" type="date" oninput="qtPreview()"></div>
        </div>
        <div class="la-section">Rate</div>
        <div class="fi-row">
          <div class="fg fi-pre"><label class="fl">Your Rate (all-in)</label><span class="fi-sym">$</span><input class="fi" id="qt-rt" type="number" placeholder="2400" oninput="qtPreview()"></div>
          <div class="fg"><label class="fl">Valid for (days)</label><input class="fi" id="qt-vd" type="number" placeholder="3" value="3" oninput="qtPreview()"></div>
        </div>
        <div class="fg"><label class="fl">Your Name</label><input class="fi" id="qt-br" placeholder="Your Name" oninput="qtPreview()"></div>
        <div class="fg"><label class="fl">Notes (optional)</label><input class="fi" id="qt-nt" placeholder="Tarped, no driver unload, etc." oninput="qtPreview()"></div>
        <button class="btn-analyze" onclick="qtSave()"><i class="ti ti-file-plus"></i> Generate & Save Quote</button>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="card-title">Quote History</div><span style="font-size:10px;color:var(--t3)">${qtHistory.length} saved</span></div>
        <div id="qt-hist">${qtRenderHistory()}</div>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title">Quote Preview</div>
        <div style="display:flex;gap:7px">
          <button class="btn-copy" onclick="qtCopy()"><i class="ti ti-copy"></i> Copy</button>
          <button class="btn" onclick="qtPrint()" style="padding:5px 12px;font-size:11px"><i class="ti ti-printer"></i> Print</button>
          <span id="qt-copied" style="font-size:10px;color:var(--tgreen);align-self:center;display:none"><i class="ti ti-check"></i> Copied!</span>
        </div>
      </div>
      <div class="qt-quote-display" id="qt-preview">${qtBuild()}</div>
    </div>
  </div>`;
  document.getElementById('qt-pd').value=new Date().toISOString().split('T')[0];
  qtPreview();
}
function qtGetVals(){return{
  co:document.getElementById('qt-co')?.value||'',
  ct:document.getElementById('qt-ct')?.value||'',
  oc:document.getElementById('qt-oc')?.value||'',
  os:document.getElementById('qt-os')?.value||'',
  dc:document.getElementById('qt-dc')?.value||'',
  ds:document.getElementById('qt-ds')?.value||'',
  eq:document.getElementById('qt-eq')?.value||'Dry Van',
  mi:parseFloat(document.getElementById('qt-mi')?.value)||0,
  cm:document.getElementById('qt-cm')?.value||'General Freight',
  wt:parseInt(document.getElementById('qt-wt')?.value)||0,
  pd:document.getElementById('qt-pd')?.value||'',
  dd:document.getElementById('qt-dd')?.value||'',
  rt:parseFloat(document.getElementById('qt-rt')?.value)||0,
  vd:parseInt(document.getElementById('qt-vd')?.value)||3,
  br:document.getElementById('qt-br')?.value||'',
  nt:document.getElementById('qt-nt')?.value||'',
};}
function qtBuild(qnum){
  const v=qtGetVals();
  const num=qnum||'[PENDING]';
  const today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const valid=new Date(Date.now()+(v.vd||3)*864e5).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const rpm=v.rt>0&&v.mi>0?(v.rt/v.mi).toFixed(2):'--';
  const lines=[
    'FREIGHT RATE QUOTE',
    '='.repeat(40),
    'Quote #:     '+num,
    'Date:        '+today,
    'Valid Until: '+valid,
    '',
    'SHIPPER',
    '-'.repeat(40),
    'Company:     '+(v.co||'[Company Name]'),
    'Contact:     '+(v.ct||'[Contact Name]'),
    '',
    'SHIPMENT DETAILS',
    '-'.repeat(40),
    'Origin:      '+(v.oc?v.oc+', ':'')+( v.os||'[State]'),
    'Destination: '+(v.dc?v.dc+', ':'')+( v.ds||'[State]'),
    'Equipment:   '+v.eq,
    'Commodity:   '+v.cm,
  ];
  if(v.wt) lines.push('Weight:      '+Number(v.wt).toLocaleString()+' lbs');
  lines.push('Miles:       '+(v.mi?Number(v.mi).toLocaleString()+' mi':'[Miles]'));
  if(v.pd) lines.push('Pickup:      '+v.pd);
  if(v.dd) lines.push('Delivery:    '+v.dd);
  lines.push('','RATE','-'.repeat(40));
  lines.push('All-In Rate: '+(v.rt?'$'+Number(v.rt).toLocaleString():'[Rate TBD]'));
  lines.push('Rate/Mile:   '+(rpm!=='--'?'$'+rpm+'/mi':'[Fill in miles]'));
  lines.push('Terms:       Net 30 from delivery');
  if(v.nt){lines.push('','NOTES','-'.repeat(40),v.nt);}
  lines.push('','ACCEPTANCE','-'.repeat(40));
  lines.push('Quote valid until '+valid+'. To accept,');
  lines.push('reply to confirm or sign below.');
  lines.push('');
  lines.push('Quoted by: '+(v.br||'[Your Name]'));
  lines.push('[Your Phone] | [Your Email]');
  lines.push('','_______________________    __________');
  lines.push('Shipper Signature           Date');
  return lines.join('\n');
}
function qtPreview(){const el=document.getElementById('qt-preview');if(el)el.textContent=qtBuild();}
function qtSave(){
  const v=qtGetVals();
  if(!v.rt||!v.mi||!v.os||!v.ds){
    alert('Please fill in: rate, miles, origin state, and destination state');return;
  }
  const qnum=qtNum();
  const built=qtBuild(qnum);
  qtHistory.unshift({num:qnum,co:v.co,os:v.os,ds:v.ds,rt:v.rt,mi:v.mi,eq:v.eq,ts:Date.now(),text:built});
  if(qtHistory.length>20)qtHistory.pop();
  saveAll();
  const el=document.getElementById('qt-preview');if(el)el.textContent=built;
  const hEl=document.getElementById('qt-hist');if(hEl)hEl.innerHTML=qtRenderHistory();
}
function qtRenderHistory(){
  if(!qtHistory.length)return'<div style="font-size:10px;color:var(--t3);text-align:center;padding:12px">No quotes saved yet</div>';
  const tago=ts=>{const s=Math.floor((Date.now()-ts)/1000);return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':Math.floor(s/3600)+'h ago';};
  return qtHistory.map((q,i)=>`<div class="qt-hist-row" onclick="qtLoad(${i})"><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;color:var(--t1)">${q.num} · ${q.os}→${q.ds} · ${q.eq}</div><div style="font-size:10px;color:var(--t3)">${q.co||'No company'} · $${Number(q.rt).toLocaleString()} · ${tago(q.ts)}</div></div><i class="ti ti-arrow-right" style="font-size:12px;color:var(--t3)"></i></div>`).join('');
}
function qtLoad(i){
  const q=qtHistory[i];
  const el=document.getElementById('qt-preview');
  if(el)el.textContent=q.text;
}
function qtCopy(){
  const el=document.getElementById('qt-preview');
  if(!el)return;
  navigator.clipboard?.writeText(el.textContent).then(()=>{
    const c=document.getElementById('qt-copied');
    if(c){c.style.display='flex';setTimeout(()=>c.style.display='none',2000);}
  });
}
function qtClear(){
  ['qt-co','qt-ct','qt-oc','qt-os','qt-dc','qt-ds','qt-mi','qt-cm','qt-wt','qt-pd','qt-dd','qt-rt','qt-br','qt-nt'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const eq=document.getElementById('qt-eq');if(eq)eq.value='Dry Van';
  const vd=document.getElementById('qt-vd');if(vd)vd.value='3';
  qtPreview();
}
function qtPrint(){
  const el=document.getElementById('qt-preview');
  if(!el)return;
  const w=window.open('','_blank');
  w.document.write('<pre style="font-family:monospace;font-size:13px;padding:30px;white-space:pre-wrap">'+el.textContent+'</pre>');
  w.document.close();w.print();
}

const _logoEl = document.querySelector('.logo-name');
if (_logoEl && orgSettings.name) _logoEl.textContent = orgSettings.name;
rNav();
rDash();

  _ind.textContent = '✓ Data restored' + (_st ? ' · saved ' + _st.toLocaleTimeString() : '');
  document.body.appendChild(_ind);
  setTimeout(() => _ind.remove(), 3000);
}
</script>
